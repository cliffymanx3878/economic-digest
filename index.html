    "description": "发展新质生产力是推动高质量发展的内在要求和重要着力点。为加快发展新质生产力，中共中央、国务院印发《关于发展新质生产力的意见》。 意见部署19项重点举措，涉及大力推进科技创新、推动科技创新和产业创新深度融合、着力推进发展方式创新、扎实推进体制机制创新、深化人才工作机制创新5个方面。 意见明确，坚持创新主导、改革为要、因地制宜、先立后破，坚持高技术、高效能、高质量，统筹处理好政府和市场、质态和业态、改革和发展、自主和开放的关系，统筹发展和安全，以科技创新为引领，以全要素生产率大幅提升为核心标志，推动技术革命性突破、生产要素创新性配置、产业深度转型升级，推动劳动者、劳动资料、劳动对象优化组合和更新跃升，全方位推进科技创新、产业创新、发展方式创新、体制机制创新、人才工作机制创新，加快形成同新质生产力更相适应的生产关系，营造有利于科技创新和产业创新深度融合的良好发展生态，更好支撑高质量发展。 10月10日，中国证监会党委书记、主席吴清在北京召开座谈会，与部分上市公司负责人、证券基金机构专家深入交流，就当前资本市场和金融形势充分听取意见建议。 座谈会上，大家一致认为，我国宏观经济稳中向好，产业结构转型持续深化，资本市场运行总体稳健，多层次市场功能有效发挥，虽然面临一些风险挑战，但高质量发展的态势不会改变，对经济运行和资本市场充满信心。同时，与会专家对更好推动资本市场平稳健康发展提出了具体建议，主要包括：持续加强稳市机制建设，进一步拓宽中长期资金来源、渠道和入市方式，发展壮大耐心资本；推动有条件的上市公司加大分红回购力度，完善投资者回报和权益保护机制；优化发行上市制度，支持不同类型、不同行业、多元化的优质企业发展壮大；强化交易监管，加强跨境风险监测应对；研究储备更多增量政策工具；等等。 吴清表示，上市公司和行业机构是市场的重要主体，希望大家积极建言献策，共同把资本市场建设好，更好回报广大投资者，为中国式现代化建设积极贡献力量。 3 四部门，周末发文！剑指汽车创新设计和研发测试验证 10月10日，工业和信息化部等四部门联合发布了《关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）》，这将进一步提升产品安全性能，推动汽车产业高质量发展。《征求意见稿》针对部分生产企业跟风推出新产品、测试验证不充分等问题，提出了多方面的要求。 在创新设计准入管理方面，通知明确，自2027年1月1日起，涉及创新设计的新申报产品，应增加填报创新设计技术参数，并按照《汽车产品创新设计技术指南》加强安全环保评估；未按要求测试验证、测试验证不充分或提供虚假材料的，不予公告。已取得公告的产品，应在2027年7月1日前补充报送有关技术参数及验证材料，逾期存在安全隐患的，应停止生产并实施召回。通知还明确提出，禁止配备全隐藏式门把手，不得采用折叠显示屏、柔性显示屏，相关创新设计须经充分测试验证，确保安全可靠。 在研发测试验证方面，通知要求，新申报产品应按照《汽车产品研发测试验证技术规范》，完成综合可靠性与耐久性、结构可靠性、软件功能可靠性、环境适应性、采暖与制冷、防护性能与密封性等方面测试验证。其中，环境适应性验证周期不少于1年，可靠性验证试验不低于30000公里。 此外，通知提出规范营销宣传活动。汽车生产企业应当真实客观开展营销宣传活动，如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任，确保消费者正确理解和使用汽车产品创新设计相关功能。 4 财政部：有...",

    "pubDate": "2026-10-11T21:48:37+08:00",
    "description": "第一财经 2026-10-09 22:09:33 听新闻 中国人民银行日前重磅发布关于人民币汇率的政策立场，一时间引发市场广泛关注。 2025年以来，人民币对美元汇率累计升值约9%。在此背景下，央行这一表态令市场困惑：汇率明明在走强，为何此时高调回应“低估”质疑？ 答案在外围。一段时间以来，部分西方经济体将中国外贸强势归因于人民币汇率被低估，并认为人民币应大幅升值。在市场看来，央行选择在此时发布政策立场，既是对外部施压的正面回应，也为市场构建出一个准确、完整的人民币汇率叙事与立场。 综合多位市场权威专家观点来看，这一官方文本传递了旗帜鲜明的信号：人民币汇率由市场供求决定，中国不预设汇率目标、不干预长期趋势，也无意通过汇率贬值获取竞争优势。 专家同时认为，当前人民币汇率难言低估，贸易顺差与汇率并无因果关系，全球失衡的根源在于逆差国自身与国际货币体系固有矛盾，需各国共同推进结构性改革。 人民币汇率被低估了吗？市场供求决定 人民币汇率被低估、被干预了吗？一段时间以来，西方存在质疑人民币汇率市场化程度不高、不够透明的声音，并将贬值及升值过慢归因于央行干预。 人民币汇率到底是怎么形成的？央行给出明确回应：中国实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。坚持让市场在汇率形成中发挥决定性作用。央行不预设汇率目标、不干预汇率长期趋势，2017年后已退出常态化外汇干预。 央行的底线，是防范汇率短期急剧贬值影响金融稳定。在疫情突发、2025年4月关税战等重大外部冲击时，运用宏观审慎工具调节预期，乃至在极端情景下直接干预，校正 “羊群效应”和非理性贬值预期的自我强化。 这样的做法符合国际规则和实践，并非中国独有。2026年7月，日元对美元一度贬至近40年低位，同样引发相关国家联合干预。 那么，人民币汇率被低估了吗？“难言明显失调。”华福证券首席经济学家管涛认为，汇率高估还是低估，是指市场汇率相对于均衡汇率的偏离，而均衡汇率是经济对内对外同时达到均衡状态时对应的汇率水平。现在人民币面临内外均衡的冲突：从对外部门贸易顺差、外汇供过于求的角度看，利多人民币，但从对内部门供强需弱、境内外负利差的角度看，又利空人民币。 2026年7月，国际货币基金组织（IMF）发布《2026年外部部门报告》，评定2025年中国外部平衡“偏强”，报告称人民币实际有效汇率缺口中值为-21.3%。个别观点将IMF的外部平衡评估结果错误援引到人民币名义汇率上，用作汇率指责的“官方依据”。 实际上，IMF用三种方法评估了人民币实际有效汇率水平，结果差异巨大甚至方向相反。 “故IMF的评估结果要审慎使用。”管涛表示，IMF对中国的政策建议主要是积极扩大内需等结构调整政策，而非推动人民币汇率升值。 民生银行首席经济学家温彬认为，经过多年发展，中国逐渐形成了功能完善的多层次外汇市场体系，市场供求在人民币汇率形成中发挥决定性作用。2026年以来，美元指数和美债收益率较快上行，非美货币普遍贬值，人民币对美元汇率总体仍延续升值走势。人民币汇率的稳健表现，本身就是对中国汇率制度有效性的有力证明。 贸易顺差是汇率的功劳吗？并无显著因果关系 一段时间以来，外界对中国顺差的讨论日渐升温。这在部分西方经济体眼中，被解读为人民币汇率低估的“功劳”。对于这一说法，市场专家给出的答案却截然相反：贸易顺差与汇率之间并无显著因果关系，二者都受到经济转型的共同影响。 “不应该将这几年中国贸易顺差的上升归因为人民币汇率变化的结果。”中金公司研究部首席宏观分析师张文朗认为。 通常来说，金融周期上行会压低经常项目但推升...",

    "description": "第一财经 2026-10-09 17:43:33 听新闻 今年是中国连续第二年实施更加积极的财政政策，这对支撑经济社会平稳运行意义重大。那么今年以来财政政策执行情况如何？财政部给出回应。 10月9日，财政部披露《2026年上半年中国财政政策执行情况报告》（下称《报告》），这份约1.8万字的《报告》详细阐述了上半年财政政策落地情况，并展望下一步财政政策重点。 财政部称，今年财政政策更加积极、精准发力，加强与其他政策协同联动，为实现“十五五”良好开局打下坚实基础。 面对内需不足这一问题，今年积极财政政策一大发力点就是投入真金白银来持续释放内需潜力，而且这一政策还根据实际执行不断优化。 比如，今年中央财政首次专门安排1000亿元，创新推出财政金融协同促内需一揽子政策，包括个人消费贷款贴息、服务业经营主体贷款贴息、中小微企业贷款贴息、设备更新贷款贴息、民间投资专项担保计划、支持民营企业债券风险分担机制等举措，引导金融资源、社会资本投向扩内需重点领域。 上述《报告》称，上述政策从供需两端定向支持居民消费和服务业经营主体，激发消费活力。1-6月，新发放相关领域贷款合计超17万亿元，同比增长4.6%，约9900万人次享受到贴息红利。 为了进一步释放上述政策红利，今年8月份财政部等发文，对上述政策进行优化，扩大贴息范围，提高贷款额度，增加经办机构等。 在财政促内需政策中，北上广深等50个试点城市中不少老百姓今年已经享受到了有奖发票“红包”。《报告》披露的数据显示，上半年，50个试点城市已投放奖金77.2亿元（含已中奖待兑付奖金），累计7.5亿人次参与活动，3.3亿人次中奖。 这意味着今年上半年有奖发票中奖率高达44%，每一人次中奖平均金额约23元。由于有奖发票带动消费和促进商户合规开票作用明显，湖北、河南、重庆等省份继续实施有奖发票试点。 财政资金取之于民、用之于民，今年更多的财政资金“投资于人”，财政加大保障和改善民生力度。 比如，《报告》称今年社会保障水平持续提升。中央财政持续加大对养老保险基金的补助力度，2026年已下达补助资金约1.2万亿元，支持地方确保基本养老金按时足额发放。中央财政下达育儿补贴补助资金999.3亿元、比上年增长10.6%，支持各地为符合条件的婴幼儿发放育儿补贴，减轻城乡居民养育成本，全国已发放2026年度育儿补贴超过2500万人。 今年财政一大重点工作是切实防范化解重点领域风险，其中存量隐性债务风险有效缓释。 《报告》称，今年有序化解存量隐性债务。落实一揽子化债方案，指导各地扎实推进地方存量隐性债务化解工作。截至7月末，各地发行置换债券1.73万亿元，完成2026年2万亿元额度的86.7%。 此次《报告》还展望了下一步财政政策。财政部将实施好更加积极的财政政策，充分发挥各项存量政策效能，根据宏观经济运行情况及时谋划出台务实管用的增量政策，加大逆周期调节力度，加力扩大内需、优化供给，切实保障和改善民生，推动经济持续向新向优向好发展。 在备受外界关注的财政增量政策方面，已经有两项政策出台。一项是9月底财政部等发布的《关于实施居民购房贷款贴息政策的通知》，自10月1日起对符合条件的居民商业住房贷款贴息1个百分点，最高能省近5万元房贷利息支出，以降低中低收入群体的房贷压力，保障和改善民生，推动房地产市场稳定。 另一项财政增量政策是，财政部安排使用地方政府债务结存限额5500亿元，用于提高县区一般公共预算保障能力和支持地方扩大有效投资。 除了上述增量政策之外，已有的存量财政政策也在加快落地。比如，《报告》要求下一步合理加快资金拨付和使用进度，持...",

    "description": "财联社10月11日讯，本周十大券商最新策略观点新鲜出炉，具体如下： 中信证券：用景气和供给出清来应对高利率，密切跟踪AI投资周期拐点 中信证券研报表示，油价回稳、非农数据低于预期、美联储加息预期下修，均未改变全球长债利率走高。背后的原因是持续强劲的私人部门投融资需求，在万亿美元投资带动下，北美率先走出了金融危机后低增长和低利率的“非常态”，全球高利率环境，在AI投资周期拐点前，是我们必须应对的常态。对海外高利率不敏感的需求只有北美AI以及与中国中央财政扩张相关的领域，而过去几年持股体验极佳的出海、资源板块都存在压力。在弱需求环境下，凸显出供给出清品种的稀缺性，反内卷进程明年依然值得重视。配置策略上，短期只能用景气品种和供给出清品种来应对高利率环境，建议密切跟踪AI投资周期拐点。 中信建投发布研报指出，节后A股行情低于预期，科技板块成为调整重心。短期看直接受FCC光模块限制与OpenAI收入不及预期冲击；根本原因是A股处于第二波杠杆结构调整期，叠加海外流动性紧缩与中东地缘扰动，风险偏好持续承压。但积极信号已开始累积：海外地缘缓和，国内稳市机制就位，同时科技板块业绩保持景气，后续若宏观扰动减轻叠加三季报业绩验证，市场预期有望扭转。配置上防御优先，红利资产为底仓；景气方向围绕三季报布局AI算力、化工资源品等盈利改善环节，以及欧洲能源安全逻辑下的新能源板块。 中金公司：业绩韧性与积极的稳增长信号有望支撑市场逐步回稳 中金公司发布研报称，展望10月，经历调整后，业绩韧性与积极的稳增长信号有望支撑市场逐步回稳。流动性紧缩预期是前期拖累市场情绪的重要因素。 中金公司认为，部分有色金属、受益于AI高景气与海外需求的科技硬件、创新药、CXO、水电核电、工程机械、液冷、集运油运、白酒、免税、旅游、游戏等领域三季报盈利增速有望较中报继续改善。面对偏弱的国内需求，近期稳增长信号已经陆续释放，有助维护投资者信心。 申万宏源：市场短期性价比已明显改善，小级别反弹可期 申万宏源研报指出，短期AI链仍偏逆风，但中期机会增加阶段，有效的AI链审美不变：1. 少数基本面预期能够超过6月底的方向。2. 27年景气相对26年继续改善的，可能是业绩消化估值后，分化走强的方向。3. 重视科技和非科技的主题投资。 非科技方向跑赢的时间拉长，高股息绝对收益时间拉长。非科技赛道方向，重点方向不变：CXO、创新药、煤炭、航运、贵金属、工业金属和基础化工。房地产销售新规后，进入历史遗留问题化解，增量政策布局期阶段；叠加短期地产销售有亮点，房地产中短期内可能反复有脉冲机会。高股息和科技赛道是“跷跷板效应”，据此关注银行和公用事业。在市场重回强势线索显现前，仍可以基于防御持有高股息。 东吴证券：政策延续“存量托底”主基调，AI产业趋势进展积极 东吴证券研报表示，政策延续“存量托底”主基调，AI产业趋势进展积极。节前政策端密集出台：央行下调PSL利率并扩围至“六张网”等新基建领域，科技创新及技改再贷款进一步加码支持重点项目；居民房贷贴息自10月1日起正式实施等。政策组合拳覆盖货币、财政与结构性工具等多个维度，既释放出稳增长、稳预期的明确信号，也凸显出本轮调控更加注重精准滴灌与存量优化。AI方面，产业层面虽无重磅的新共识形成但积极进展充足：模型发布加速，AI的新应用场景个人Agent出现渗透的早期信号。科技硬件作为即期和下期EPS能见度更高的品种在高息环境下具有分子端优势。 节后A股修复基础具备，外部风险犹存，短期均衡配置。节后A股存在修复基础，但短期行情空间受制于外部约束。制约因素方面，美债长端利率维持高...",

    "title": "优先股票配置！券商资管四季度最新策略",
    "link": "https://www.stcn.com/article/detail/4211291.html",
    "pubDate": "2026-10-11T21:48:40+08:00",
    "description": "今年以来，债券市场经历多次预期反转，权益市场波动也有所加大。进入四季度，大类资产该如何配置？“固收+”产品又将如何调整策略？ 券商中国记者近日采访了多家券商资管机构投研负责人。综合来看，股票整体优于商品及债券成为不少机构共识；债市方面，多家机构认为四季度大概率维持偏强震荡，利率中枢有望稳定。 股票配置优先级整体优于商品、债券 进入四季度，资管机构对于大类资产的排序如何？整体来看，多数受访机构将股票的配置优先级排在第一位，而债券与商品的排序则有分歧。 “从相对性价比看，股、债整体可能优于商品。”财通资管首席资产配置官李美岑告诉记者，股票方面，多数宽基指数估值处于历史60%左右分位，创业板指约25%分位，可在成长景气细分、传统低估分红可持续方向挑选三季度有业绩支撑或2027年具备估值切换机会的方向。商品方面，三季度石油链条、农产品涨幅较大，其他方向调整较多，四季度可围绕低位品种布局。 光证资管相关负责人认为，四季度大类资产相对性价比为“股票>债券>商品”。政策发力节奏后移，7—8月内需压力增大，下半年经济大概率“先抑后扬”，有利于四季度股市表现，行情有望从AI向传统行业扩散。债券虽利率处于历史低位，但考虑到央行维持适度宽松，“资产荒”大概率持续，债券在获取稳定收益方面仍有优势。商品四季度压力主要来自美联储，发达国家通胀仍高，油价涨幅可观，美联储抑制通胀决心坚定，原油和黄金短期都或有压力。 德邦资管的排序为“权益优于商品，商品优于债券；黄金作为货币信用对冲维持基准配置，同时保留一定现金缓冲”。权益排最前，因股债性价比处于57%分位、赔率改善，且“杀估值不杀盈利”意味着后续修复弹性更多在估值端。商品居中，原油是当前唯一达到“拐点级”变化的商品，三季度上涨约49.5%、全年约59.2%，直接对应输入型通胀风险；叠加AI建设对实物需求拉动，全球性通胀韧性较强。债券最后，因国内经济具备结构性韧性，债券赔率较弱、降息空间兑现较慢。 中泰资管基金经理唐军告诉券商中国记者，当前我国处于货币宽松、信用扩张偏弱状态，宏观流动性充裕。A股回调后的配置价值较高。大宗商品可能分化，铜、铝、锡等有色金属受AI算力、数据中心、电力投资需求拉动，同时受产能和全球资源民族主义供给制约，配置价值较高；能源、化工、农产品等受中东局势和超强厄尔尼诺预期影响，波动可能较大。债券表现较强，但隐含收益率已到较低位置，四季度若财政力度加大或房地产企稳，债市可能面临回调压力。 国联资管则认为，四季度所有大类资产面临全球流动性不确定性的共同约束。AI资产基本面仍强，但增速的增长速率已开始下行，流动性预期冲击对风险资产敏感性或大幅上行。长期维度相对看好商品中的黄金和有色金属；国内债券中性偏多，注重票息策略和曲线形状交易；对于权益资产则应保持更谨慎均衡的配置结构。 债市方面，多家机构认为四季度大概率维持偏强震荡，利率中枢有望保持稳定。 国金资管固定收益投资部认为，四季度债市偏强逻辑将延续，内需偏弱导致融资需求或继续磨底，基本面对债市支撑牢固。节奏上预计“先震荡后走强”：9月至10月上旬，政府债供给放量、季末信贷冲量、理财回表压力形成扰动；随着供给高峰过去、保险等配置盘跨年配置需求启动，叠加明年置换债退出后供给退坡预期，债市有望迎来走强窗口。 国联资管表示，今年以来债市经历多次预期反转，当前内需发力仍是重要发展点，保持合理宽松的必要性仍在，为债市创造了一定的稳定“温床”。外部压力虽有，但基调不变，冲击或有限。整体债券市场波动可能仍处于较低区间，四季度有望在可控区间内“震荡”，但需关注不可控变量对基本面和政策...",

    "title": "沙特利雅得机场遭袭致12死309伤 美总统：美军可能下场",
    "link": "https://www.cls.cn/detail/2501417",
    "pubDate": "2026-10-11T21:48:44+08:00",
    "description": "近期，也门冲突各方展开了激烈的“机场互袭战”，位于沙特利雅得的国际机场、位于也门政府军控制区的亚丁国际机场、以及位于也门胡塞武装控制区的萨那国际机场和荷台达国际机场频遭袭击。 在10日，沙特首都利雅得国际机场遭受了一次严重袭击。根据沙特民航部门11日凌晨公布的最新统计，此次袭击已造成12人死亡、309人受伤。 美国总统特朗普也在10日的沙特首都机场遭袭事件发生后作了声明，但仅表示美国有可能加入沙特对胡塞武装的打击行动，并未明确承诺。 沙特首都机场近期数度遭袭 已致数百人伤亡 沙特阿拉伯民航部门11日发表声明说，位于利雅得的哈立德国王国际机场10日下午再次遭到袭击，造成12人死亡、309人受伤，袭击造成机场设施不同程度的损坏，机场已暂停运营。 在10日的这次遭袭之前，沙特民航总局曾在9日发表过声明，确认哈立德国王国际机场在8日时遭到两次袭击，造成3名沙特公民死亡、多人受伤。在10月7日，沙特民航部门也曾发声，确认沙特西南部的艾卜哈国际机场和位于首都利雅得的哈立德国王国际机场6日至7日遭到袭击，共造成3人死亡、36人受伤。 沙特首都机场10日再遭袭 已无航班起降 在10日的这次最新的袭击事件发生后不久，有目击者称，哈立德国王国际机场3号航站楼当天下午传出爆炸声，机场内人员被疏散撤离。 爆炸发生后，航班追踪网站信息显示，该机场已无航班起降，部分飞往利雅得的航班已备降或返航。哈立德国王国际机场发布旅客提醒说，建议旅客在前往该机场前联系航空公司并确认航班状态。 受安全局势影响，科威特航空公司10日表示取消往返利雅得的航班。此前在8日和9日阿联酋阿提哈德航空公司和卡塔尔航空公司已分别宣布取消前往利雅得的多趟航班，在10日的爆炸发生后，阿提哈德航空公司宣布将取消航班的时间延长至10月12日。 美总统称美可能参与沙特对胡塞的军事打击 在10日的沙特首都机场遭袭事件发生后，美国总统特朗普也作了表态。特朗普称，美国“可能”加入沙特针对胡塞武装的打击行动，“我们将仔细考虑”。 此前在9月上旬胡塞武装持续攻占红海沿岸战略要地之际，沙特阿拉伯王储穆罕默德就曾被曝致电特朗普，要求美方打击胡塞武装，但美总统表示拒绝。据知情美官员透露，美国政府暂时没有直接打击胡塞武装的计划。 有分析认为，美国之所以一直对直接打击胡塞武装态度冷淡，出于多方面限制因素。在当前与伊朗战事还未结束且因伊朗战事大量消耗的弹药库未能得到补充的当下，保护沙特并非美国当前战略优先事项，因此美国不愿开辟也门新战线。 也门胡塞武装：愿与沙特避免互袭民用设施 胡塞武装方面，在10日当天，该武装控制的马西拉电视台也报道称，沙特领导的联军10日袭击了胡塞武装控制的也门萨那国际机场，目前尚无伤亡和损失的报告。当日稍晚时，胡塞武装方面则表达了愿与沙特停止互袭机场、海港等人道主义设施的意愿。 也门胡塞武装表示，愿意与沙特阿拉伯采取相互对等的措施，避免将机场、海港及其他具有人道主义功能的设施卷入不断升级的军事对抗。该组织还表示愿意推动各方避免袭击此类设施，并将机场和海港列为优先保护对象。 半岛电视台：胡塞武装袭击沙特机场系对等回应 胡塞武装此前一直指责沙特于7月13日袭击也门首都萨那国际机场，导致双方缓和局势结束。 有分析认为，这也是胡塞武装近期持续打击沙特首都利雅得国际机场的原因之一。半岛电视台分析认为，萨那国际机场和荷台达国际机场是国际航班和人道主义援助进入胡塞武装控制区的关键入口，由于沙特方面的攻势持续，胡塞武装对沙特机场的袭击是对等回应。 另有分析认为，威胁沙特的商业和旅游业发展可能也是胡塞武装打击沙特首都机场的目的之...",

  {
    "title": "特朗普现场提议：改名为“特朗普洋”",
    "link": "https://www.cls.cn/detail/2501592",
    "pubDate": "2026-10-11T21:48:44+08:00",
    "description": "据美国《华盛顿邮报》网站10月10日报道，在试图重新命名墨西哥湾与安大略湖之后，美国总统特朗普10日提出为更多水域更名的想法。 特朗普在田纳西州克拉克斯维尔的一次集会上说：“我们命名了海湾，我们命名了一片美丽的湖泊。现在有人说，你需要命名一条河……我们需要命名一条河。我们需要命名一片海洋。” 特朗普说，他可能会重新命名大西洋或太平洋，还表示新名字可能是为了纪念他自己。 特朗普说：“我们可以称之为‘特朗普洋’或者‘美国洋’之类的。我认为，在我卸任之前，我们应该命名一片海洋，还要命名一条大河。” 特朗普去年将墨西哥湾更名为“美国湾”，导致美墨外交关系紧张，并在美联社拒绝使用新名称后与之发生争执，此外还造成了其他矛盾。 今年8月，特朗普将位于美国纽约州与加拿大之间的安大略湖更名为“美国湖”，当时美国正与加拿大就贸易和关税问题发生争执。 特朗普上月还提议将新墨西哥州更名为“新美国州”。此举可能需要该州与国会采取相关行动。特朗普上周表示，是否更名将“取决于”新墨西哥州民众。 特朗普在一段支持该州一名共和党国会议员候选人的视频中说：“我不会推动此事，但很多人都很喜欢这个想法。”",

    "title": "人民日报：一辆汽车的刹车踏板，绝不应该在驾驶中出现“断裂”",
    "link": "https://www.cls.cn/detail/2501423",
    "pubDate": "2026-10-11T21:48:44+08:00",
    "description": "工信部等四部门10日公开发布关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）。汽车产品创新设计技术指南围绕虚拟操纵件、门把手、新型人机交互系统、大角度座椅等方面提出具体测试验证要求。 业内普遍认为，四部门发布的新规是对“速成车”说不！ 这几天，舆论广泛关注尊界V800刹车踏板支架断裂事件，讨论的焦点就是汽车尤其是“速成”新能源车的安全问题。尽管事件有待权威的调查结论，但有一点毋庸置疑：一辆汽车的刹车踏板，绝不应该在驾驶中出现“断裂”！ 何为“速成车”？这其实是对那些为了抢占市场份额，过度压缩研发周期，删减实车验证流程而推出的车型的统称。“有的品牌为了追求上市速度，很多该做的实验没有做，消费者成了‘试车员’。”北京现代总经理李凤刚曾在2026年中国汽车论坛上直言。 “速成车”以“快”抢占市场，却在“缺”上埋下隐患，背后暴露的是流程缺位、验证缩水。 某车企测试工程师解释：“一款新车型仅在测试流程中往往便需要完成制动、转向、操稳性、平顺性、动力性、经济性等基本参数测试。此外，高温、高原、极寒标定和环境适应性里程测试也都必不可少。” 完成这些测试，自然要付出相应的时间。同济大学汽车与能源学院教授朱西产在采访中表示：“在新车型的整个开发周期中，整车道路测试需要两冬两夏，即便是小改型，一冬一夏、3万公里真实道路测试也是必要的。”朱教授还举了一个例子：现在有很多针对“速成车”易生锈的投诉，其中湿热、腐蚀测试缺失是重要诱因之一。 一个案例是，某新能源车企在新车门把手测试中，总测试次数为1万次，其中仅2000次为实物测试，其余8000次全部由仿真完成。有的车企只做20%的真实测试，剩余的80%测试依靠仿真测试完成。 “速成车”以仿真测试代替真实路测的投机取巧，是极限工程测试的大幅缩水，是删减验证科目、跳开验证流程的偷工减料，而这些，最终却在由消费者买单。 今年夏天，重庆持续遭遇40℃以上的极端天气，不少某品牌新能源车主发现，车辆在行驶中出现空气弹簧漏气、车身单侧塌陷的情况，车辆无法继续行驶。一遇高温就集中趴窝，不免让人质疑：上市前的极热试验究竟到不到位？ 我国汽车市场竞争激烈，一些车企不“卷”质量“卷”速度，最终被证明：此路不通。追求“上新”速度的“速成车”无法在市场竞争中行得远、跑得稳。 今年7月，全国汽车标准化技术委员会公开征求意见，拟将三类新能源汽车可靠性行驶试验总里程统一提至不低于3万公里，与燃油车标准对齐。 中国汽车流通协会乘联分会负责人崔东树将此措施比喻为新能源车的“成人礼”。崔东树说：“标准的出台旨在遏制开发周期快速缩短的趋势，让新车型测试更加规范，标志着中国新能源汽车产业正式告别政策‘襁褓’，从‘培育优先’转向‘规范优先’。” 达到“3万公里”的标准虽然不能直接和车辆安全画上等号，但是整顿“速成车”的信号灯已经亮起——车企“上新”靠的是技术水平和生产效率提升，而不是少做了本应该做的测试；车企提高开发效率，不能以质量品质降低和安全保障缺失为代价。 今年8月，工信部等部门联合发布通知，在全国范围内开展为期1年的道路机动车辆产品生产一致性和质量提升专项行动，集中整治道路机动车辆产品生产一致性、可靠性、耐久性、新技术测试验证等四方面问题。 查一致性，严防“送检一套、量产另一套”；查可靠性，检验车辆能否在日常使用中稳定运行不出故障；查耐久性，不仅关注新车设计使用寿命，还关注投产前的研发周期情况；查新技术测试验证，检验创新设计的风险评估是否充分，新材料、新结构是否存在产品缺陷、疲劳失效等风险隐患。 对于个别企业存在片面追求降低成本、...",

    "link": "https://www.stcn.com/article/detail/4211283.html",
    "pubDate": "2026-10-11T21:48:40+08:00",
    "description": "工信部等四部门10日公开发布关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）。汽车产品创新设计技术指南围绕虚拟操纵件、门把手、新型人机交互系统、大角度座椅等方面提出具体测试验证要求。 业内普遍认为，四部门发布的新规是对“速成车”说不！ 这几天，舆论广泛关注尊界V800刹车踏板支架断裂事件，讨论的焦点就是汽车尤其是“速成”新能源车的安全问题。尽管事件有待权威的调查结论，但有一点毋庸置疑：一辆汽车的刹车踏板，绝不应该在驾驶中出现“断裂”！ 何为“速成车”？这其实是对那些为了抢占市场份额，过度压缩研发周期，删减实车验证流程而推出的车型的统称。“有的品牌为了追求上市速度，很多该做的实验没有做，消费者成了‘试车员’。”北京现代总经理李凤刚曾在2026年中国汽车论坛上直言。 “速成车”以“快”抢占市场，却在“缺”上埋下隐患，背后暴露的是流程缺位、验证缩水。 某车企测试工程师解释：“一款新车型仅在测试流程中往往便需要完成制动、转向、操稳性、平顺性、动力性、经济性等基本参数测试。此外，高温、高原、极寒标定和环境适应性里程测试也都必不可少。” 完成这些测试，自然要付出相应的时间。同济大学汽车与能源学院教授朱西产在采访中表示：“在新车型的整个开发周期中，整车道路测试需要两冬两夏，即便是小改型，一冬一夏、3万公里真实道路测试也是必要的。”朱教授还举了一个例子：现在有很多针对“速成车”易生锈的投诉，其中湿热、腐蚀测试缺失是重要诱因之一。 一个案例是，某新能源车企在新车门把手测试中，总测试次数为1万次，其中仅2000次为实物测试，其余8000次全部由仿真完成。有的车企只做20%的真实测试，剩余的80%测试依靠仿真测试完成。 “速成车”以仿真测试代替真实路测的投机取巧，是极限工程测试的大幅缩水，是删减验证科目、跳开验证流程的偷工减料，而这些，最终却在由消费者买单。 今年夏天，重庆持续遭遇40℃以上的极端天气，不少某品牌新能源车主发现，车辆在行驶中出现空气弹簧漏气、车身单侧塌陷的情况，车辆无法继续行驶。一遇高温就集中趴窝，不免让人质疑：上市前的极热试验究竟到不到位？ 我国汽车市场竞争激烈，一些车企不“卷”质量“卷”速度，最终被证明：此路不通。追求“上新”速度的“速成车”无法在市场竞争中行得远、跑得稳。 今年7月，全国汽车标准化技术委员会公开征求意见，拟将三类新能源汽车可靠性行驶试验总里程统一提至不低于3万公里，与燃油车标准对齐。 中国汽车流通协会乘联分会负责人崔东树将此措施比喻为新能源车的“成人礼”。崔东树说：“标准的出台旨在遏制开发周期快速缩短的趋势，让新车型测试更加规范，标志着中国新能源汽车产业正式告别政策‘襁褓’，从‘培育优先’转向‘规范优先’。” 达到“3万公里”的标准虽然不能直接和车辆安全画上等号，但是整顿“速成车”的信号灯已经亮起——车企“上新”靠的是技术水平和生产效率提升，而不是少做了本应该做的测试；车企提高开发效率，不能以质量品质降低和安全保障缺失为代价。 今年8月，工信部等部门联合发布通知，在全国范围内开展为期1年的道路机动车辆产品生产一致性和质量提升专项行动，集中整治道路机动车辆产品生产一致性、可靠性、耐久性、新技术测试验证等四方面问题。 查一致性，严防“送检一套、量产另一套”；查可靠性，检验车辆能否在日常使用中稳定运行不出故障；查耐久性，不仅关注新车设计使用寿命，还关注投产前的研发周期情况；查新技术测试验证，检验创新设计的风险评估是否充分，新材料、新结构是否存在产品缺陷、疲劳失效等风险隐患。 对于个别企业存在片面追求降低成本、...",

    "title": "连续高股息+高ROE的稳健增长股，23股上榜，耐心资本长线配置（附名单）",
    "link": "https://www.stcn.com/article/detail/4211258.html",
    "pubDate": "2026-10-11T21:48:40+08:00",
    "description": "国庆节后A股各主要指数出现大幅波动，上证指数一度跌破3800点大关，双创指数则创出阶段新低。与此同时，防御类板块表现相对抢眼，中证红利指数(000922)节后连续上涨两日，年内累计涨跌幅已回正，跑赢上证指数、深证成指等同期表现。 有观点认为，在风险偏好下降的大背景下，资金或将加速向防御类资产转移，尤其是具备长期高股息、高盈利能力的稳健增长股，有望获得市场青睐。 连续高股息+高ROE的稳健增长股 证券时报·数据宝筛选出连年高股息、高ROE且未来有望稳健成长的个股，条件包括以下： 2. 2023年至2025年扣非加权净资产收益率均超10%； 3.以2023年至2025年年底收盘价和当年每股分红计算当年股息率，连续3年股息率均超3%； 4.机构一致预测2026年、2027年、2028年净利同比正增长； 5.上调今年业绩预期的机构数不少于下调机构数。 综合上述筛选条件后，合计有23股入选。部分超级大白马在列，比如银行板块的农业银行、建设银行、招商银行等万亿元市值个股，煤炭板块的中国神华市值也超万亿元，陕西煤业市值超2600亿元，长江电力市值超7000亿元等。另外还有多只市值不足百亿元的“小而美”股票，其中水星家纺市值不足50亿元，物产环能、行动教育、新澳股份等个股市值不足80亿元。 稳健的成长能力是保证未来高分红的先决条件，部分公司近期也获得了众多机构上调2026年业绩预期。其中，宝丰能源和行动教育均有20多家机构上调业绩预期，同期只有1家机构下调业绩预期。 光大证券表示，考虑到2026年四季度至2027年一季度煤油价格有望同步走强，宝丰能源将适度受益，该机构本期预测2026年—2028年归母净利润较上次报告分别上调6.6%、上调6.4%、基本持平。公司是国内煤制烯烃龙头企业，持续聚焦产业协同和降本增效，未来成长空间广阔。 国盛证券表示，行动教育持续推进AI组织/智能体赋能，核心课程交付稳步推进，课程报到率持续维持高位，推动业务结构优化，市场份额有序增长。随着AI应用不断加速，公司运营效率将持续改善，推动盈利能力进一步提升。 上榜公司股价表现亮眼，年内平均涨幅达8.86%，远超各大主要指数同期表现。其中，14只个股实现上涨，占比超60%；跑赢上证指数的个股达16只，占比近70%，意味着榜单个股年内胜率已逼近七成的高位。 具体到个股来看，潍柴动力和青岛银行年内股价均大涨超40%，行动教育和陕西煤业均涨超30%，中国神华、宝丰能源、建设银行等个股均涨超20%。涨幅居前的个股中，新澳股份市值较低。国泰海通证券表示，新澳股份下半年产能稳步爬坡，2027年有望维持双位数增长。 上榜个股多数获得耐心资本长线配置，诸如农业银行、建设银行、招商银行、中国神华等超级大白马自不必多言，一些市值较小的个股也获得了机构的长期青睐。比如市值不足百亿元的行动教育，社保险资连续多年进入前十大流通股东榜；苏美达则在2023年半年报前十大流通股东榜中出现了社保基金的身影，并持续至今。 从今年二季度持仓动态来看，部分个股也获得了社保险资的大手笔加持。比如建设银行二季度获得中国人寿保险股份有限公司—传统—普通保险产品新进前十大，期末持股市值超52亿元；中国神华获得中国人寿保险股份有限公司—传统—普通保险产品增持超7256万股；陕西煤业、宝丰能源等个股也获得中国人寿保险股份有限公司—传统—普通保险产品的新进重仓。",

    "description": "又见金融从业人员栽在“老鼠仓”上。 近日，中国期货业协会官网披露《关于对牛家骥作出纪律处分的决定》（中期协字〔2026〕206号）。因利用未公开信息从事相关证券交易，协会决定撤销牛家骥期货从业资格，并在3年内拒绝受理其期货从业资格申请。 去年5月，牛家骥已被辽宁证监局处以“没收违法所得75.14万元、罚款75.14万元”的行政处罚。行政惩戒与行业自律接连落地，这名“90后”期货从业人员为自己的越线行为付出了“双重代价”。 中国期货业协会在相关公告中称，牛家骥在期货公司任职期间利用未公开信息进行证券交易的行为，违反了《期货从业人员执业行为准则》（2008年修订）第四条，《期货经营机构及其工作人员廉洁从业实施细则》（2023年修订版）第十六条的规定。 依据《中国期货业协会纪律处分程序》第三十二条和《中国期货业协会失信及违规处理办法》第二十四条，协会决定给予牛家骥“撤销期货从业资格并在3年内拒绝受理其期货从业资格申请”的纪律处分。 这意味着，至少在3年内，牛家骥无法以期货从业人员身份重返行业。 按照要求，受到协会纪律处分的从业人员应当自收到决定书之日起60日内，登录中国期货业协会知识服务平台，完成个人惩戒专项培训全部课程学习。如对处分决定不服，可在收到决定书之日起15个工作日内，向协会第六届理事会法律与申诉专业委员会提出书面申诉。 趋同交易近4000万元，两个账户轮番操作 根据去年5月辽宁证监局发布的行政处罚决定书，牛家骥1994年6月出生，2022年6月至2024年7月，他担任某期货公司投资经理助理，负责协助投资经理开展32只资产管理产品的投资管理工作，因职务便利知悉上述产品的未公开信息。 利用这些信息，牛家骥先后通过两个证券账户进行趋同交易。 2022年6月至2023年8月，牛家骥联络史某并告知其买卖股票的名称、价格、数量等，由史某操作其证券账户进行交易。交易决策由牛家骥作出，交易资金来源于他本人，收益也归其所有。其间，史某账户与前述32只产品趋同买入股票63只，趋同买入金额1875.1万元，趋同交易盈利合计28.5万元。 2023年8月至2024年7月，牛家骥又使用登记在何某名下的手机号码，操作2015年5月14日开立于信达证券盘锦兴隆台街营业部的何某账户进行交易。其间，该账户与32只产品趋同买入股票12只，趋同买入金额2045.73万元，趋同交易盈利合计46.64万元。 综合来看，牛家骥使用“史某”“何某”两个证券账户，累计趋同买入股票75只，趋同买入金额3920.83万元，累计趋同交易盈利75.14万元。 主动配合调查，仍被罚没150.28万元 值得注意的是，牛家骥的认错态度较好。辽宁证监局在行政处罚决定书中指出，牛家骥积极配合调查工作，如实陈述违法行为，并主动提供相关证据，对违法事实无异议，并签署了《认错认罚具结书》。 依据《证券法》第五十四条第一款，金融机构从业人员利用未公开信息进行交易被明确禁止；第一百九十一条第二款规定，违反前述规定利用未公开信息进行交易的，依照内幕交易的规定处罚——没收违法所得，并处以违法所得一倍以上十倍以下的罚款。 基于当事人违法行为的事实、性质、情节与社会危害程度，并结合其主动配合调查等情节，辽宁证监局依据《证券法》第一百九十一条第二款、《行政处罚法》第三十二条第五项，对牛家骥利用未公开信息从事相关证券交易的行为，作出没收违法所得75.14万元、并处罚款75.14万元的决定，合计罚没150.28万元。 从查处链条看，这是一起典型的“行政+自律”联合惩戒案例：证监局负责行政查处，行业协会跟进自律处分，形成监管闭环。...",

    "pubDate": "2026-10-11T21:48:37+08:00",
    "description": "第一财经 2026-10-11 12:58:47 听新闻 每年诺奖季，经济学奖都是压轴大戏。今年的奖项将在北京时间10月12日下午揭晓。 翻开半个多世纪的诺贝尔奖花名册，有一个很少被注意到的反差。物理、化学、医学奖得主中，获奖时身处本学科诺奖得主最多前十高校的只占两三成，七成以上来自其外；经济学则恰好相反：近六成得主获奖时就在那十所名校之中。把视线拉长到整个职业生涯，差距更加明显。经济学奖得主的任职时间，有一半集中在哈佛、芝加哥、麻省理工等8所大学。 高等教育在全球扩张，知识生产也越来越国际化，科学前沿本该更分散。但哈佛大学弗里曼（Richard B. Freeman）、清华大学谢丹夏等学者最新发表了一篇美国国家经济研究局（NBER）工作论文，题为《获奖经济学家的机构集中度居高不下并持续上升》。论文追踪了18个学科近两百年的数据，发现其中17个学科的获奖者越来越分散，只有经济学逆向成了集中度最高的学科。 为什么最好的人总是聚在最好的地方？这种极度封闭的“学术名校俱乐部”，究竟是知识生产的客观规律，还是一场隐秘的学术特权闭环？作为该项研究的共同发起者，清华大学社科学院经济学博导、人本健康经济发展研究中心主任谢丹夏接受第一财经记者专访时，拆解了这背后的四个原因。 论文梳理了18个学科的171个国际权威奖项，追踪近6000名获奖者从求学到任职的完整履历，时间跨度从19世纪到2020年代。衡量集中度的工具，是反垄断审查中常用的赫芬达尔-赫希曼指数（HHI），数值越高，说明越集中。 以获奖者整个职业生涯的任职年数计算，1960年经济学的集中度（HHI）为257，在18个学科中排第9，处在中游。此后半个多世纪，其他学科大多越来越分散：物理从136降到112，数学从331降到222，政治学、社会学、法学都降到了100上下。只有经济学反向上升，2022年升到387，排名第一。 若用经济学界习惯衡量贫富分化的基尼系数来透视，这种极化更为明显。经济学获奖者全生涯机构分布的基尼系数高达0.812。更形象地说，在产生过获奖学者的全球249所高校及科研机构中，仅哈佛、芝加哥、麻省理工、斯坦福、普林斯顿、耶鲁、加州大学伯克利分校和哥伦比亚大学这8所机构，就占据了全体经济学获奖者整整50%的学术工作岁月。 根据论文绘制的历史演进轨迹曲线，谢丹夏提醒，1990年至2010年，经济学的集中度斜率呈现出近乎陡峭的攀升状态。在20世纪90年代前半程的六年里，有五届诺贝尔经济学奖的得主名单中有芝加哥大学的学者。这段时期的上升，恰好与芝加哥学派的黄金时代重合。 不过，谢丹夏强调，这不能简单归结为某种意识形态的胜利，更多是方法论上的突破。1992年获奖的贝克尔（Gary Becker），把最优化分析延伸到家庭、犯罪、生育；1993年摘得桂冠的福格尔（Robert Fogel），则用计量方法重写了经济史。这些成果是芝加哥学者长期耕耘的结果。 伴随高等教育全球扩张与互联网协作兴起，自然科学稳步走向“去中心化”，经济学却逆向更加集中。论文在对比自然科学与工程学科时，首先将目光投向了物理资本与流动成本之间的“悖论”。 从直觉来看，人员流动越自由，资源应当越分散。但谢丹夏说，现实恰好相反，原因在于各学科的“知识生产函数”不同。物理、化学或生命科学高度依赖重资产与专用仪器，从极地探测阵列到占地巨大的同步辐射光源、粒子加速器，往往需要整栋实验大楼与海量经费托底。这些物质资产天然构成了人才迁移的高门槛。谢丹夏称：“哪怕哈佛这样拥有雄厚财力的顶级名校，也难以在寸土寸金的市区为挖角一位学者而一夜之间复刻一套造...",

    "description": "【财新网】“人民币正在更广泛地展现自身的商业价值。从结算货币看，中国跨境收付（含贸易和跨境投资）中，已有超过50%以人民币结算。随着CIPS、mBridge、数字人民币，以及数字人民币跨境基础设施‘数币达’（CBETS）等持续释放效能，人民币在跨境结算中的使用还会增加。”渣打中国行长兼副董事长鲁静近日在接受财新采访时表示。 “我们把当前这一阶段称为人民币国际化的2.0阶段。”鲁静指出，在这一阶段，国际市场对人民币的商业使用需求在多个维度持续提升；从更广的层面看，国际参与者也希望降低对单一货币体系的依赖，寻求更加多元的货币选择，并借助数字货币等创新来进一步便利商业使用。",

    "title": "中国农业地理｜大闸蟹价格回落，它爬出“包邮区”正去往云贵川​​​​​​​​​​​​​​",
    "link": "https://www.yicai.com/news/103388798.html",
    "pubDate": "2026-10-11T21:48:37+08:00",
    "description": "第一财经 2026-10-11 11:59:41 听新闻 作者：冯小芯 ▪ 乐琰 责编：彭海斌 大街小巷随处可见与大闸蟹相关的主题广告、购物场所举办品蟹美食节、蟹卡销售企业自主开办餐厅和酒店来揽客……这是第一财经记者日前在苏州阳澄湖地区所看到的情景。 随着9月中下旬江苏兴化、阳澄湖等核心产区的大闸蟹陆续上市，一年一度的大闸蟹消费旺季拉开帷幕。第一财经记者近期通过实地调研了解到，大闸蟹经济所拉动的消费已不仅是农产品销售本身，还带动了旅游、住宿、零售、智能分拣、区块链溯源等多个产业领域的消费与发展。 值得注意的是，随着市场价格的波动，大闸蟹开始走出“包邮区”，去往更多的新兴消费市场。 大闸蟹所拉动的各类消费覆盖面越来越广，从大闸蟹销售、蟹卡、文旅微度假到衍生商品等层出不穷。熟醉蟹、蟹黄酱、秃黄油等产品打破季节限制，把“节日食物”变成“日常食品”，AI挑蟹师、智能分拣、区块链溯源等在全产业链铺开，大闸蟹消费周期也从“中秋国庆专属”拉长到11月～12月。 第一财经记者日前在苏州阳澄湖地区看到，不少餐厅、景区甚至是奥特莱斯等都打出了品蟹之旅的旗号来吸引客人，比如苏州比斯特购物村近期推出了“阳澄湖大闸蟹美食集市”、部分餐厅将品蟹宴与园林景区结合售卖。而以售卖大闸蟹卡为主业的蟹状元则在阳澄湖当地设置了线下餐厅和酒店，客人可以在线提货，也可以赴当地餐厅品蟹，并直接住宿在该品牌所打造的酒店内，以此拉动一系列消费。 大闸蟹之旅提升了苏州当地近期旅游与住宿业消费。同程旅行数据显示，位于江苏省苏州市相城区阳澄湖中心的莲花岛景区近一周搜索热度环比上个月上涨60%。途牛截至目前最新预订数据显示，自9月28日首批阳澄湖大闸蟹上市以来，用户预订的苏州目的地出游人次较去年同期增长超10%。 据央视财经报道，大闸蟹所带来的深加工、冷链物流、线上销售、品蟹文旅，把45亿元的一个养殖产业，拉长到350亿元全产业链规模，创造大量本地岗位。2025年，阳澄湖大闸蟹直接产值约45亿元，全产业链规模达350亿元以上。据测算，阳澄湖大闸蟹品牌价值达282.65亿元。 值得注意的是，今年的大闸蟹价格有所波动。近期，第一财经记者走访上海江杨农产品批发市场大闸蟹专区，多家批发商家表示，今年大闸蟹生长态势良好，相较往年产量有所提升，总体品质稳定，目前货源以江苏兴化产区为主，上市初期批发价格较去年有所回落，以3两母蟹为例，今年批发价约90元/斤，去年约110元/斤，同比下滑约20%，总体来看，‌中小规格蟹价明显回落，大规格精品蟹价格依然坚挺‌。据了解，今年新增产能主要集中在中小规格蟹，供给扎堆直接拉低了批发底价，相对而言，大规格精品蟹养殖难度高、生长周期长，产量依然稀缺，因此价格保持稳定。 部分大闸蟹价格的波动也让更多业内人士看到，大闸蟹应该销往更多区域，以此来增加销量。江苏阳澄湖大闸蟹股份有限公司董事长程可军对媒体表示，近期市场的销售量预估每天在1万箱左右，会有8万到10万只大闸蟹销往全国各地。 在四川达州这座川东北人口大市，当第一财经记者国庆期间行走在当地街头时，常常可以看到大闸蟹的广告牌，呼啸而过的公交车车身上也总张贴着“吃大闸蟹、就选XXX”的广告标语。第一财经记者近期在达州一家大闸蟹门店内看到，店员正在为顾客打包4只大闸蟹，店内堆放着两层水箱，每个水箱内装有数十只不同规格的大闸蟹，价格从20多元/只到100多元/只不等。 店员对记者透露，店内销售的大闸蟹都是从江苏空运过来，因此价格也比江苏本地高一些，主力产品的售价约40元/只。平常门店内的大闸蟹两天左右就能销售一空，整体销售情况还可以。 第一财...",

let activeSource = 'all';
let searchKeyword = '';

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  return (d.getMonth()+1) + '/' + d.getDate();
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderSourceTags() {
  const container = document.getElementById('sourceTags');
  const allTag = '<button class="source-tag ' + (activeSource==='all'?'active':'') + '" onclick="setSource(\'all\')">全部</button>';
  const sources = [{"id": "reuters", "name": "Reuters"}, {"id": "ft", "name": "Financial Times"}, {"id": "economist", "name": "The Economist"}, {"id": "nyt", "name": "NYT Business"}, {"id": "bbc", "name": "BBC Business"}, {"id": "cnbc", "name": "CNBC"}, {"id": "npr", "name": "NPR Business"}, {"id": "caixin", "name": "财新网"}, {"id": "yicai", "name": "第一财经"}, {"id": "stcn", "name": "证券时报"}, {"id": "cls", "name": "财联社"}];
  const tags = sources.map(s => '<button class="source-tag ' + (activeSource===s.id?'active':'') + '" onclick="setSource(\'' + s.id + '\')">' + s.name + '</button>').join('');
  container.innerHTML = allTag + tags;
}

function getFilteredArticles() {
  let list = ALL_ARTICLES;
  if (activeSource !== 'all') list = list.filter(a => a.sourceId === activeSource);
  if (searchKeyword) {
    const kw = searchKeyword.toLowerCase();
    list = list.filter(a => a.title.toLowerCase().includes(kw) || (a.description||'').toLowerCase().includes(kw));
  }
  return list;
}

function renderAll() {
  renderSourceTags();
  const articles = getFilteredArticles();
  const main = document.getElementById('mainContent');
  if (articles.length === 0) {
    main.innerHTML = '<div class="empty-state"><p>没有找到匹配的新闻</p></div>';
    return;
  }
  const featured = articles[0];
  const rest = articles.slice(1);
  let html = '<section class="featured-section"><div class="section-label">今日头条 · Top Story</div><article class="featured-card"><div class="featured-content">';
  html += '<h2><a href="' + featured.link + '" target="_blank" rel="noopener">' + escapeHtml(featured.title) + '</a></h2>';
  html += '<div class="featured-meta"><span class="source-badge">' + featured.sourceName + '</span><span>' + formatTime(featured.pubDate) + '</span></div>';
  if (featured.description) html += '<p class="featured-desc">' + escapeHtml(featured.description) + '</p>';
  html += '</div>';
  if (featured.image) html += '<img class="featured-image" src="' + featured.image + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
  html += '</article></section>';
  html += '<section><div class="section-label">最新资讯 · Latest</div><div class="news-grid">';
  rest.forEach((a, idx) => {
    const isPaywall = a.paywall === true;
    if (isPaywall) {
      // 付费媒体：点击直接跳转
      html += '<article class="news-card" onclick="window.open(\'' + a.link + '\',\'_blank\')" style="cursor:pointer;">';
    } else {
      // 免费媒体：点击进入独立阅读页
      html += '<article class="news-card" onclick="openArticle(' + idx + ')" style="cursor:pointer;">';
    }
    html += '<div class="card-source">' + a.sourceName;
    if (isPaywall) html += '<span class="paywall-badge">付费</span>';
    html += '</div>';
    if (isPaywall) {
      html += '<h3><a href="' + a.link + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + escapeHtml(a.title) + '</a></h3>';
    } else {
      html += '<h3>' + escapeHtml(a.title) + '</h3>';
    }
    if (a.description) html += '<p class="card-desc">' + escapeHtml(a.description) + '</p>';
    html += '<div class="card-time">' + formatTime(a.pubDate) + '</div>';
    if (!isPaywall) {
      html += '<div class="read-hint">点击阅读全文 →</div>';
    }
    html += '</article>';
  });
  html += '</div></section>';
  main.innerHTML = html;
}

function openArticle(idx) {
  const articles = getFilteredArticles();
  const a = articles[idx + 1]; // +1 因为第一条是featured
  if (!a) return;
  const view = document.getElementById('readingView');
  let contentHtml = '<button class="back-btn" onclick="closeArticle()">← 返回列表</button>';
  contentHtml += '<div class="reading-meta"><span class="source-badge">' + a.sourceName + '</span><span>' + formatTime(a.pubDate) + '</span></div>';
  contentHtml += '<h1 class="reading-title">' + escapeHtml(a.title) + '</h1>';
  contentHtml += '<div class="reading-content">';
  if (a.description) {
    contentHtml += '<p>' + escapeHtml(a.description) + '</p>';
  } else {
    contentHtml += '<p class="no-desc">该新闻暂无摘抄摘要，您可以点击下方链接阅读原文。</p>';
  }
  contentHtml += '</div>';
  contentHtml += '<a class="read-original" href="' + a.link + '" target="_blank" rel="noopener">阅读原文 →</a>';
  view.innerHTML = contentHtml;
  document.getElementById('mainContent').style.display = 'none';
  view.style.display = 'block';
  window.scrollTo(0, 0);
}

function closeArticle() {
  document.getElementById('readingView').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}

function setSource(id) { activeSource = id; renderAll(); }
function handleSearch(val) { searchKeyword = val.trim(); renderAll(); }
renderAll();
