    "description": "财联社10月11日讯，周末影响市场的重要资讯有：①中共中央、国务院：全面实施“人工智能+”行动，强化算力、算法、数据等高效供给；②证监会召开资本市场和金融形势专家座谈会，听取意见建议；③沙特首都遭袭致12死309伤，美或将介入打击行动；④景旺电子：第三季度净利润同比预增205%-265%。 中共中央、国务院：全面实施“人工智能+”行动 强化算力、算法、数据等高效供给 中共中央、国务院印发《关于发展新质生产力的意见》。意见提出，全面实施“人工智能+”行动。推进人工智能对传统产业的改造，加快推进智能网联新能源汽车、人工智能手机和电脑、人形机器人等新一代智能终端场景应用。加快人工智能等数智技术创新，突破基础理论和核心技术，强化算力、算法、数据等高效供给。因地制宜、分业施策布局国家人工智能行业应用中试基地和高价值应用场景，大力推动人工智能在各行业应用。构建技术监测、风险预警、应急响应体系，确保人工智能安全、可靠、可控。 财政部：有力有效实施更加积极的财政政策 支持全方位扩大国内需求 财政部发布2026年上半年中国财政政策执行情况报告，面对更趋复杂的形势变化和交织叠加的风险挑战，财政部将根据宏观经济运行情况及时谋划出台务实管用的增量政策，加大逆周期调节力度，加力扩大内需、优化供给，切实保障和改善民生，推动经济持续向新向优向好发展，为实现“十五五”良好开局提供坚强保障。重点做好六方面工作： （一）有力有效实施更加积极的财政政策。 （二）支持全方位扩大国内需求。（三）推动科技创新和产业创新。 （四）持续保障和改善民生。（五）加强重点领域风险防范化解。（六）深化财政管理改革。 财政部安排使用5500亿元地方政府债务结存限额 财政部近日安排使用地方政府债务结存限额5500亿元，用于提高县区一般公共预算保障能力和支持地方扩大有效投资。下达地方的5500亿元地方政府债务结存限额中，一般债务结存限额3000亿元，全部分配县区使用，专门用于提高县区一般公共预算保障能力，支持地方更好发展；专项债务结存限额2500亿元，分配给今年第四季度有实际项目资金需求的地区，向经济大省倾斜，支持有关地区优先保障在建项目资金需求，新建项目聚焦“六张网”建设等重点领域，有效发挥政府投资带动作用。财政部将指导督促各地更好衔接项目储备和债券发行，加快发行节奏，畅通拨付链条，尽快形成实物工作量，促进政策早落地、早见效。 商务部欧洲司负责人解读中欧贸易投资磋商机制第二次例会成果 10月8-9日，中国商务部部长王文涛与欧盟委员会贸易和经济安全委员马罗什·谢夫乔维奇在北京共同主持召开中欧贸易投资磋商机制（以下简称机制）第二次例会。双方围绕贸易和投资平衡、出口管制、知识产权、世贸组织改革等议题开展对等、专业、建设性的会谈，全面盘点了机制首次会议以来的磋商情况及各项进展，并形成了成果共识。商务部欧洲司负责人就相关成果进行解读。 商务部：反对个别国家以所谓“产能过剩”为名 行贸易保护主义之实 商务部新闻发言人就美国召集部分经济体发布应对所谓“结构性产能和生产过剩”问题部长级联合声明答记者问。问：美东时间10月7日，美贸易代表办公室（USTR）发布公告称，近期美国召集14个经济体高级官员举行会议，共同签署发布应对所谓“结构性产能和生产过剩”问题的部长级联合声明。请问商务部对此有何评论？ 答：我们注意到有关情况。中方已在不同场合多次阐明关于所谓“产能过剩”问题的看法，并于今年7月专门发布了有关立场文件。 中方一贯认为，看待产能问题要秉持全面、客观、公正的态度，不能出于对自身产业竞争力和市场地位的担忧，将经贸问题政治化。中方反对个别国家以所谓“产能过剩”为名，行贸易保护主义之实，这只会扰乱全球经贸秩序和产供链稳定，给世界经济增长带来长期风险。如果未来有关经济体以此为借口，采取损害中方利益的措施，中方将作出必要回应。 中方坚持在开放合作中建设现代化产业体系，支持构建公正合理的国际经济秩序。中方呼吁有关各方坚持多边主义，倡导互利共赢，尊重市场规律，共同维护开放包容的全球产供链合作格局。 中欧贸易投资磋商机制第二次例会联合声明 2026年10月8-9日，中国商务部部长王文涛与欧盟委员会贸易和经济安全委员马罗什·谢夫乔维奇在北京举行中欧贸易投资磋商机制（以下简称机制）第二次例会。双方进行了务实、富有成效的讨论，并形成成果共识清单。双方重申，作为关键贸易伙伴，在世贸组织规则框架下，妥善处理双方分歧，致力于继续稳定双边经贸关系，并使其更加平衡。双方商定，将于2027年3月召开机制第三次例会，在此之前双方将保持密切沟通，包括1月举行部长级视频会议。 国家发改委：推动“十五五”规划、“六张网”建设实施方案等明确的重大工程项目尽早开工建设，激发释放内需潜力 国家发展改革委主任郑栅洁10日主持召开民营企业座谈会，围绕准确把握三季度经济形势、积极应对国际供需情况变化，与来自石油化工、天然气供应、农业机械、人工智能应用等领域的盛虹控股、东明石化、新奥集团、吉峰三农、晶泰科技等企业负责人深入交流，听取意见建议。郑栅洁表示，四季度是全年收官之季，也是巩固经济回升向好的关键窗口期，国家发展改革委将认真贯彻落实党中央和国务院决策部署，加大逆周期调节力度，加强宏观政策取向一致性评估，强化存量政策和增量政策协同发力；推动“十五五”规划、“六张网”建设实施方案等明确的重大工程项目尽早开工建设，激发释放内需潜力；推动科技创新与产业创新深度融合，进一步提升产业链供应链韧性，提高能源资源安全保障水平，夯实国家粮食安全根基；及时谋划更多带动性强的政策工具、工作抓手，推动经济持续向新向优向好发展，努力完成全年目标任务。 证监会召开资本市场和金融形势专家座谈会 听取意见建议 10月10日，中国证监会党委书记、主席吴清在北京召开座谈会，与部分上市公司负责人、证券基金机构专家深入交流，就当前资本市场和金融形势充分听取意见建议。座谈会上，大家一致认为，我国宏观经济稳中向好，产业结构转型持续深化，资本市场运行总体稳健，多层次市场功能有效发挥，虽然面临一些风险挑战，但高质量发展的态势不会改变，对经济运行和资本市场充满信心。同时，与会专家对更好推动资本市场平稳健康发展提出了具体建议，主要包括：持续加强稳市机制建设，进一步拓宽中长期资金来源、渠道和入市方式，发展壮大耐心资本；推动有条件的上市公司加大分红回购力度，完善投资者回报和权益保护机制；优化发行上市制度，支持不同类型、不同行业、多元化的优质企业发展壮大；强化交易监管，加强跨境风险监测应对；研究储备更多增量政策工具；等等。 吴清表示，上市公司和行业机构是市场的重要主体，希望大家积极建言献策，共同把资本市场建设好，更好回报广大投资者，为中国式现代化建设积极贡献力量。 中国证监会有关司局负责同志参加座谈。 今年1至9月我国城镇新增就业1052万人 国务院新闻办公室10月10日上午举行“开局起步‘十五五’”系列主题新闻发布会，人力资源社会保障部相关负责人介绍推进就业和社会保障高质量发展有关情况。今年1至9月，城镇新增就业1052万人、完成全年目标任务的87.7%，前8个月城镇调查失业率均值为5.2%，就业形势总体稳定。接下来，我国还将实施高校毕业生等青年就业支持计划、灵活就业和新就业形态劳动者就业质量提升计划，开展适应人工智能发展促就业行动、“技能照亮前程”培训行动、农民工就业促进行动、高品质就业公共服务供给行动以及“人力资源服务+”融合发展行动。实施就业优先战略，促进高质量充分就业。 多部门：汽车生产企业不得作虚假、夸大或引人误解的宣传 不得诱导驾驶人忽视安全驾驶责任 工业和信息化部等四部门联合发布了关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿），拟规范营销宣传活动。汽车生产企业应当真实客观开展营销宣传活动，如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任，确保消费者正确理解和使用汽车产品创新设计相关功能。 加强汽车产品创新设计等方面管理 四部门征求意见：禁止配备全隐藏式门把手，不得采用折叠显示屏、柔性显示屏等 工业和信息化部等四部门联合发布了关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿），这将进一步提升产品安全性能，推动汽车产业高质量发展。记者从工业和信息化部了解到，征求意见稿针对部分生产企业跟风推出新产品、测试验证不充分等问题，提出了多方面的要求。 在创新设计准入管理方面，通知明确，自2027年1月1日起，涉及创新设计的新申报产品，应增加填报创新设计技术参数，并按照《汽车产品创新设计技术指南》加强安全环保评估；未按要求测试验证、测试验证不充分或提供虚假材料的，不予公告。已取得公告的产品，应在2027年7月1日前补充报送有关技术参数及验证材料，逾期存在安全隐患的，应停止生产并实施召回。通知还明确提出，禁止配备全隐藏式门把手，不得采用折叠显示屏、柔性显示屏，相关创新设计须经充分测试验证，确保安全可靠。 在研发测试验证方面，通知要求，新申报产品应按照《汽车产品研发测试验证技术规范》，完成综合可靠性与耐久性、结构可靠性、软件功能可靠性、环境适应性、采暖与制冷、防护性能与密封性等方面测试验证。其中，环境适应性验证周期不少于1年，可靠性验证试验不低于30000公里。 财联社记者从业内获悉，监管部门近日发布机构监管通报，对新模式浮动费率产品注册安排作出优化，按照“分类监管、稳步推进”的原则，将参与机构范围拓展至主动权益类基金管理规模居前的中型基金管理人。调整后，按照基金管理人类型实施差异化申报安排：一是头部基金管理人发行的新模式浮动费率产品数量，原则上不低于其主动管理权益类基金发行数量的60%，延续此前试点要求；二是新纳入的中型基金管理人，原则上不低于30%；三是支持中小基金管理人结合自身实际，主动布局新模式浮动费率产品。 证监会：拟解除发起式基金“3年2亿”的强制清盘线 退出条件与普通基金拉平 证监会近日发布《公开募集证券投资基金运作管理办法（征求意见稿）》，并向社会公开征集意见。修订优化发起式基金退出要求，删除发起式基金成立满3年规模未达到2亿元即强制清盘的特殊规定，将发起式基金退出门槛与普通基金拉平。这对于养老FOF、偏股型产品等符合监管导向但需要长期培育的产品具有积极意义。 助力权益类基金逆势布局 股基、混合基、FOF成立门槛从2亿元降至5000万元 证监会近日发布《公开募集证券投资基金运作管理办法（征求意见稿）》并向市场征求意见，这距离现行的运作办法修订发布至今已逾12年。《运作办法》征求意见稿将股票基金、混合基金、基金中基金（FOF）等成立门槛，从规模2亿元、份额2亿份，分别降低至5000万元、5000万份；固收类基金成立门槛保持不变。在业内人士看来，一是有利于具备长期投资价值的产品在市场低位也能顺利成立和运作，增强逆周期布局能力；二是有利于减少“帮忙资金”保成立现象；三是有利于丰富产品供给，更好适配不同风险偏好投资者需求。 景旺电子：第三季度净利润同比预增205%-265% 高速通信与AI数据基础设施领域高性能PCB量产出货提速 景旺电子(603228.SH)公告称，预计2026年第三季度归属于上市公司股东的净利润为9.12亿元-10.89亿元，同比增长205.46%-264.74%。业绩变动主要系高速通信与AI数据基础设施领域高性能PCB量产出货提速，叠加订单结构优化、内部降本增效等多措并举，营业收入、净利润均实现较快增长。截至报告期末，公司在AI服务器与数据中心、高速光模块领域的在手订单饱满，产能利用率及良率较高，公司正全力保障交付目标的达成。小财注：公司Q3净利润预计9.12亿-10.89亿，Q2净利润3.69亿，据此计算，Q3净利润预计环比增长147%-195%。 中国巨石：前三季度净利润同比预增100%-110% 玻纤下游需求增加、产品量价齐升 中国巨石(600176.SH)公告称，预计2026年前三季度归属于上市公司股东的净利润为51.36亿元-53.93亿元，同比增长100%-110%。业绩变动主要系玻纤主要下游应用领域需求增加，产品量价齐升，公司通过加快产品结构优化、加大技术创新力度、加强市场开拓等措施提升盈利能力。小财注：公司Q3净利润预计22.03亿-24.6亿，Q2净利润16.66亿，据此计算，Q3净利润预计环比增长32%-47%。 鸿富瀚：前三季度净利润同比预增108%-145% 液冷板整柜模组业务量产交付、产能逐步释放 鸿富瀚(301086.SZ)公告称，预计2026年前三季度归属于上市公司股东的净利润为1.70亿元-2.00亿元，同比增长108.19%-144.93%。第三季度公司利润实现增长，主要来自两方面：一是重点布局的液冷板整柜模组业务完成量产交付，液冷板模组产能逐步释放，成为本期利润增长的核心增量；二是消费电子精密功能性组件、自动化设备等传统存量业务销售规模稳步扩大，原有业务保持稳健经营，为利润提供坚实支撑。小财注：公司Q3净利润预计0.97亿-1.27亿，Q2净利润0.34亿，据此计算，Q3净利润预计环比增长182%-270%。 立讯精密：公司及立讯技术涉337调查 尚处立案初期 立讯精密(002475.SZ)公告称，公司及控股子公司东莞立讯技术股份有限公司被列为美国国际贸易委员会337调查被调查方，涉及美国专利US 10,903,734。ITC于当地时间2026年10月9日正式启动调查，调查编号337-TA-1526，目前尚处于立案初期，尚未就相关侵权主张作出实质认定；涉案产品处于客户验证阶段，尚未进入量产状态。基于相关产品目前的业务进展，预计本次调查不会对公司现阶段生产经营及当期经营业绩产生重大不利影响。 美光科技12月将股票回购计划规模扩大至350亿美元 美光科技董事会批准扩大股票回购计划，将于12月起生效。美光在10-K文件中表示，董事会“批准将自2026年12月9日起可酌情回购的普通股最高金额上调至351.6亿美元”。美光此前批准了一项100亿美元的股票回购计划，其中约22亿美元额度尚未使用。美光股价周五下跌1%，今年以来累计上涨约260%。 天孚通信回应海外进出口政策限制传闻：目前相关政策未对光器件产品进行约束 不涉及对公司业务产生影响 天孚通信(300394.SZ)发布投资者关     "description": "发展新质生产力是推动高质量发展的内在要求和重要着力点。为加快发展新质生产力，中共中央、国务院印发《关于发展新质生产力的意见》。 意见部署19项重点举措，涉及大力推进科技创新、推动科技创新和产业创新深度融合、着力推进发展方式创新、扎实推进体制机制创新、深化人才工作机制创新5个方面。 意见明确，坚持创新主导、改革为要、因地制宜、先立后破，坚持高技术、高效能、高质量，统筹处理好政府和市场、质态和业态、改革和发展、自主和开放的关系，统筹发展和安全，以科技创新为引领，以全要素生产率大幅提升为核心标志，推动技术革命性突破、生产要素创新性配置、产业深度转型升级，推动劳动者、劳动资料、劳动对象优化组合和更新跃升，全方位推进科技创新、产业创新、发展方式创新、体制机制创新、人才工作机制创新，加快形成同新质生产力更相适应的生产关系，营造有利于科技创新和产业创新深度融合的良好发展生态，更好支撑高质量发展。 10月10日，中国证监会党委书记、主席吴清在北京召开座谈会，与部分上市公司负责人、证券基金机构专家深入交流，就当前资本市场和金融形势充分听取意见建议。 座谈会上，大家一致认为，我国宏观经济稳中向好，产业结构转型持续深化，资本市场运行总体稳健，多层次市场功能有效发挥，虽然面临一些风险挑战，但高质量发展的态势不会改变，对经济运行和资本市场充满信心。同时，与会专家对更好推动资本市场平稳健康发展提出了具体建议，主要包括：持续加强稳市机制建设，进一步拓宽中长期资金来源、渠道和入市方式，发展壮大耐心资本；推动有条件的上市公司加大分红回购力度，完善投资者回报和权益保护机制；优化发行上市制度，支持不同类型、不同行业、多元化的优质企业发展壮大；强化交易监管，加强跨境风险监测应对；研究储备更多增量政策工具；等等。 吴清表示，上市公司和行业机构是市场的重要主体，希望大家积极建言献策，共同把资本市场建设好，更好回报广大投资者，为中国式现代化建设积极贡献力量。 3 四部门，周末发文！剑指汽车创新设计和研发测试验证 10月10日，工业和信息化部等四部门联合发布了《关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）》，这将进一步提升产品安全性能，推动汽车产业高质量发展。《征求意见稿》针对部分生产企业跟风推出新产品、测试验证不充分等问题，提出了多方面的要求。 在创新设计准入管理方面，通知明确，自2027年1月1日起，涉及创新设计的新申报产品，应增加填报创新设计技术参数，并按照《汽车产品创新设计技术指南》加强安全环保评估；未按要求测试验证、测试验证不充分或提供虚假材料的，不予公告。已取得公告的产品，应在2027年7月1日前补充报送有关技术参数及验证材料，逾期存在安全隐患的，应停止生产并实施召回。通知还明确提出，禁止配备全隐藏式门把手，不得采用折叠显示屏、柔性显示屏，相关创新设计须经充分测试验证，确保安全可靠。 在研发测试验证方面，通知要求，新申报产品应按照《汽车产品研发测试验证技术规范》，完成综合可靠性与耐久性、结构可靠性、软件功能可靠性、环境适应性、采暖与制冷、防护性能与密封性等方面测试验证。其中，环境适应性验证周期不少于1年，可靠性验证试验不低于30000公里。 此外，通知提出规范营销宣传活动。汽车生产企业应当真实客观开展营销宣传活动，如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任，确保消费者正确理解和使用汽车产品创新设计相关功能。 4 财政部：有力有效实施更加积极的财政政策 10月9日，财政部发布《2026年上半年中国财政政策执行情况报告》。财政部表示，有力有效实施更加积极的财政政策。合理加快资金拨付和使用进度，持续优化财政支出结构，保障好重点领域支出，加强资金监管，切实提高资金使用效益和政策实施效果。合理加快政府债券发行使用，更好衔接项目实施和债券发行，支持做实做细重点项目前期谋划，紧抓项目实施，尽快形成更多实物工作量。发行特别国债向8家中央金融企业增资，提升其稳健经营、抵御风险和服务实体经济能力。 财政部表示，支持全方位扩大国内需求。支持推进“两重”建设和“两新”工作，完善实施机制。优化实施财政金融协同促内需一揽子政策，健全部门协同、央地联动工作机制，更好鼓励居民消费、撬动民间投资。统筹用好超长期特别国债、地方政府专项债券、中央预算内投资等资金，更多聚焦新质生产力、新型城镇化等重点领域，更多投向具有战略意义、有利于提高全要素生产率的方面，大力支持“十五五”规划纲要确定的重大工程项目建设。 财政部表示，推动科技创新和产业创新。突出科技创新供给和产业需求牵引，综合运用专项资金、政府投资基金等政策工具，促进优化提升传统产业，培育壮大新兴产业和未来产业。落实财政支持政策，推动生产性服务业和生活性服务业扩能提质、更好发展。提高科技创新投入效能，加大对关键性、战略性领域的支持力度。 5 国家发改委：推动“十五五”规划、“六张网”建设实施方案等明确的重大工程项目尽早开工建设 10月10日，国家发展改革委主任郑栅洁主持召开民营企业座谈会。郑栅洁表示，四季度是全年收官之季，也是巩固经济回升向好的关键窗口期，国家发展改革委将认真贯彻落实党中央和国务院决策部署，加大逆周期调节力度，加强宏观政策取向一致性评估，强化存量政策和增量政策协同发力；推动“十五五”规划、“六张网”建设实施方案等明确的重大工程项目尽早开工建设，激发释放内需潜力；推动科技创新与产业创新深度融合，进一步提升产业链供应链韧性，提高能源资源安全保障水平，夯实国家粮食安全根基；及时谋划更多带动性强的政策工具、工作抓手，推动经济持续向新向优向好发展，努力完成全年目标任务。同时，不断深化政企沟通交流和问题解决机制，常态化向民间资本推介项目，支持民营企业参与场景建设，全力促进民营经济高质量发展。 10月10日，北京市人民政府印发《北京市“十五五”时期深化国际消费中心城市建设规划》。其中提到，加大新能源汽车推广力度，加快推进汽车流通消费改革试点，培育汽车消费新增长点。深入推进“人工智能+消费”，推动人工智能、虚拟现实、超高清等技术与商业、教育、医疗、文化、旅游、体育等领域融合应用。 同一天，据商务部网站消息，商务部等7部门近日发布《关于实施品质电商“五优”行动的通知》。其中提到，加强品质电商主体培育，推动平台规则向优转型。开展“电商+产业带”培育行动，鼓励各地规划布局电商选品中心。 7 预告：9月中美CPI数据将公布；美联储主席沃什将发声 10月14日，中国9月CPI、PPI数据将公布。此外，9月金融数据或将在本周公布。 10月14日，美国9月CPI将出炉，彭博预计显示整体通胀上升、部分受能源价格上涨推动。此外，IMF与世界银行年会横跨整周，美联储主席沃什在会议尾声发表讲话。 8 美股三大指数集体收涨，纳斯达克中国金龙指数涨超2% 10月9日，美股三大指数全线上涨。截至收盘，道指上涨0.83%；标普500上涨0.59%；纳指上涨0.64%。热门科技股多数上涨，亚马逊涨超3%，微软、特斯拉涨超2%；苹果跌超1%，AMD、英特尔跌超2%。有色金属、加密货币概念股涨幅居前，南方铜业涨超5%，Coinbase涨超4%，必和必拓涨超2%。电信服务、农产品、油气板块跌幅居前，美国先锋跌超6%，沃达丰跌超5%，邦吉跌超4%，美洲移动跌超3%。 热门中概股集体走强，纳斯达克中国金龙指数涨2.69%，新能源车企与电商股涨幅居前。个股方面，理想汽车涨5.87%，阿里巴巴涨5.36%，蔚来涨4.99%，富途控股涨4.55%，贝壳涨4.39%，哔哩哔哩涨4.31%，拼多多涨3.95%，网易涨3.88%，小鹏集团涨3.66%。 本周（10月12日—10月16日）有1只新股发行，周一：文峰光电。 10 本周超400亿元市值限售股解禁 数据显示，本周（10月12日—10月16日）共有49家公司限售股陆续解禁，合计解禁48.31亿股，按最新收盘价计算，解禁总市值为412.68亿元。 从解禁市值来看，居前三位的是：陕西能源（238.56亿元）、首药控股（30.08亿元）、大普微（26.73亿元）。 从解禁占比来看，居前三位的是：长江能科（73.25%）、陕西能源（64%）、云里物里（57.62%）。",

    "title": "人民币汇率被低估了吗？央行最新政策立场给出答案",
    "link": "https://www.yicai.com/news/103388325.html",

    "description": "第一财经 2026-10-09 22:09:33 听新闻 中国人民银行日前重磅发布关于人民币汇率的政策立场，一时间引发市场广泛关注。 2025年以来，人民币对美元汇率累计升值约9%。在此背景下，央行这一表态令市场困惑：汇率明明在走强，为何此时高调回应“低估”质疑？ 答案在外围。一段时间以来，部分西方经济体将中国外贸强势归因于人民币汇率被低估，并认为人民币应大幅升值。在市场看来，央行选择在此时发布政策立场，既是对外部施压的正面回应，也为市场构建出一个准确、完整的人民币汇率叙事与立场。 综合多位市场权威专家观点来看，这一官方文本传递了旗帜鲜明的信号：人民币汇率由市场供求决定，中国不预设汇率目标、不干预长期趋势，也无意通过汇率贬值获取竞争优势。 专家同时认为，当前人民币汇率难言低估，贸易顺差与汇率并无因果关系，全球失衡的根源在于逆差国自身与国际货币体系固有矛盾，需各国共同推进结构性改革。 人民币汇率被低估了吗？市场供求决定 人民币汇率被低估、被干预了吗？一段时间以来，西方存在质疑人民币汇率市场化程度不高、不够透明的声音，并将贬值及升值过慢归因于央行干预。 人民币汇率到底是怎么形成的？央行给出明确回应：中国实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。坚持让市场在汇率形成中发挥决定性作用。央行不预设汇率目标、不干预汇率长期趋势，2017年后已退出常态化外汇干预。 央行的底线，是防范汇率短期急剧贬值影响金融稳定。在疫情突发、2025年4月关税战等重大外部冲击时，运用宏观审慎工具调节预期，乃至在极端情景下直接干预，校正 “羊群效应”和非理性贬值预期的自我强化。 这样的做法符合国际规则和实践，并非中国独有。2026年7月，日元对美元一度贬至近40年低位，同样引发相关国家联合干预。 那么，人民币汇率被低估了吗？“难言明显失调。”华福证券首席经济学家管涛认为，汇率高估还是低估，是指市场汇率相对于均衡汇率的偏离，而均衡汇率是经济对内对外同时达到均衡状态时对应的汇率水平。现在人民币面临内外均衡的冲突：从对外部门贸易顺差、外汇供过于求的角度看，利多人民币，但从对内部门供强需弱、境内外负利差的角度看，又利空人民币。 2026年7月，国际货币基金组织（IMF）发布《2026年外部部门报告》，评定2025年中国外部平衡“偏强”，报告称人民币实际有效汇率缺口中值为-21.3%。个别观点将IMF的外部平衡评估结果错误援引到人民币名义汇率上，用作汇率指责的“官方依据”。 实际上，IMF用三种方法评估了人民币实际有效汇率水平，结果差异巨大甚至方向相反。 “故IMF的评估结果要审慎使用。”管涛表示，IMF对中国的政策建议主要是积极扩大内需等结构调整政策，而非推动人民币汇率升值。 民生银行首席经济学家温彬认为，经过多年发展，中国逐渐形成了功能完善的多层次外汇市场体系，市场供求在人民币汇率形成中发挥决定性作用。2026年以来，美元指数和美债收益率较快上行，非美货币普遍贬值，人民币对美元汇率总体仍延续升值走势。人民币汇率的稳健表现，本身就是对中国汇率制度有效性的有力证明。 贸易顺差是汇率的功劳吗？并无显著因果关系 一段时间以来，外界对中国顺差的讨论日渐升温。这在部分西方经济体眼中，被解读为人民币汇率低估的“功劳”。对于这一说法，市场专家给出的答案却截然相反：贸易顺差与汇率之间并无显著因果关系，二者都受到经济转型的共同影响。 “不应该将这几年中国贸易顺差的上升归因为人民币汇率变化的结果。”中金公司研究部首席宏观分析师张文朗认为。 通常来说，金融周期上行会压低经常项目但推升本币汇率，而金融周期下行则推升经常项目并抑制本币汇率。 张文朗表示，过去几年，中国经济转型的一个体现正是金融周期见顶转向：楼市调整、私人部门去杠杆、储蓄上升，进口放缓；社会资源从房地产流向效率更高的领域（比如制造业），提升生产效率，支撑出口，导致国货加速崛起（进口放缓）；楼市调整导致以房价为代表的非贸易品价格下降，即内部实际汇率（非贸易品相对于贸易品价格）下行，降低贸易品的中间投入成本，促进出口。 而在金融周期下行过程中，房价下行并带动有关板块股市下行，导致资金配置境内资产的动机阶段性减弱，从而导致名义汇率偏弱。 张文朗认为，这种情况下，前几年虽然中国贸易顺差上升，但出口企业换汇动机一度较弱，未对本币汇率带来相应的支撑。同时，楼市调整，内需和物价偏弱，也导致实际汇率偏弱。 可见，顺差与汇率并非互为因果。实际上，自2005年汇改以来，人民币汇率双向浮动，升贬值周期交替，双向浮动特征明显。但过去人民币多轮升值并未影响中国贸易发展，贬值时期中国出口份额也没有更快提升。 汇率升贬值与出口份额的变化并不对应。2005年至2008年人民币对美元升值21%、2010年至2014年升值10%、2020年至2021年升值9%，同期中国出口在全球份额分别上升2.4个、2.8个和1.7个百分点。而2016年人民币对美元贬值7%、2022年人民币贬值超8%，同期中国出口在全球份额均下降0.7个百分点。 温彬认为，中国贸易增长主要得益于超大规模的市场，完备的产业链和基础设施体系，丰富、高素质、勤奋工作的劳动力资源，以及持续研发创新能力。中国从未通过推动人民币贬值来促进出口，甚至在有关国家发起贸易战、美联储大幅陡峭加息时，中国人民银行还适时采取宏观审慎政策措施，防范人民币汇率向贬值方向超调。 2025年以来，人民币汇率双向浮动、有序升值，人民币对美元汇率累计升值约9%，迄今升至6.70:1左右。 在管涛看来，此轮人民币反弹恰恰是中国出口强劲、贸易顺差对外汇供求基本面，以及经济向新向优发展对市场信心情绪面共同提振的结果，是坚持市场在汇率形成中的决定性作用的具体体现。 “今年前8个月，中国出口价格指数平均为105.32，也就是说出口价格平均同比上涨了5%。”管涛认为，这反映出口增长的价格贡献率上升或者说非价格竞争力增强，进一步印证了中国贸易发展根源于产业国际竞争力的提升。中国没有必要，也无意通过汇率贬值获取贸易竞争优势。 全球失衡谁的责任？解法在各国共同改革 当全球失衡的讨论升温，一些人也习惯性地把目光投向中国顺差与人民币汇率。然而这一简单归因“汇率\"”并不成立。 全球失衡到底如何解决？央行态度鲜明：不是顺差国或逆差国单方面的责任，需要各方共同应对。 管涛直言，将复杂的国际货币体系和经济结构性问题简单归因于人民币汇率，是诿过于人，无助于解决问题。实证研究表明，中国外贸进出口对汇率不敏感，货物贸易或经常账户顺差与人民币汇率也不是线性的关系。可取之道是，各国围绕结构性改革制定中长期政策方案并坚定执行。 温彬也表示，将本国产业竞争力下降、财经约束弱化和复杂结构性问题简单归因于他国汇率，是对自身调整责任的推诿和回避。 失衡根源何在？一方面在逆差国自身。“不能把逆差国国内的政策问题全部转化为其他国家的汇率调整责任。例如，这几年，美国对中国的贸易逆差下降了，但其总体贸易逆差并没有出现逆转，说明美国贸易逆差和美国内部有较大关系。”张文朗认为。 另一方面则与国际货币体系的固有矛盾有关。近几十年来，全球主要顺差国不断轮换，主要逆差国却始终不变。上世纪70、80年代以来，国际分工经历多次调整，经常账户顺差集中地由日本、德国向韩国、中国台湾、中国香港、新加坡，再向中国、东盟等动态调整；德国、韩国制造业占比高于全球平均水平，经常账户也长期保持顺差。 央行认为，在单一主权货币主导的国际货币体系中，主要储备货币发行国能够较长时期实施债务和财政扩张，支持高消费和低储蓄，并由此形成长期贸易逆差。这也会在一定程度上削弱该国的财经约束和制造业竞争力，增大债务和国际收支风险。 张文朗提出，全球再平衡必须正视美国自身的低储蓄和高财政赤字。目前，其失业率处在历史低位，但财政赤字高企。在经济保持一定增长的情况下还持续维持高财政赤字，若私人部门没有充分增加储蓄或减少投资，必然会导致贸易逆差扩大。如果不改善这一储蓄投资关系，仅依靠关税或要求其他国家货币升值，难以从根本上消除美国总体对外逆差。 对于解决之道，在近期二十国集团财长和央行行长会议上，中国人民银行行长潘功胜就已提出，解决全球失衡，需要各国推动自身结构性改革。逆差国削减财政赤字，提高本国储蓄率，顺差国适度推动消费和投资增长。同时，要坚持多边主义，加强国际合作。解决全球失衡应着眼于中期承诺。各国都应制定中长期政策方案，作出明确承诺并坚定执行，避免来回“翻烧饼”。 管涛认为，中国正在坚定落实“十五五”规划，坚持推进经济增长方式转型，加快构建新发展格局，为新一轮全球经济动态平衡贡献力量。 温彬表示，作为负责任大国，未来中国将坚定落实“十五五”规划确定的战略方向和重点举措，坚持推进经济增长方式转型，扩大内需和高水平对外开放，以促进全球经济向更加开放、包容、平衡的方向发展；与此同时，中国将继续深化人民币汇率市场化改革，增强汇率弹性，加强预期管理，防范跨境资金流动风险，保持人民币汇率在合理均衡水平上的基本稳定。 近年来，中国贸易的一个重要结构性变化是对汇率变化的敏感度明显下降。 全球经济失衡是产业分工格局演进等因素共同作用的结果，不是顺差国或逆差国单方面的责任。 构建出一个准确、完整的人民币汇率叙事与立场。 中美债市反向“狂飙”，市场在交易什么？ 货币政策出现一些边际变化，释放出更重逆周期调节、政策集成、结构引导和预期管理的信号。",

    "description": "财联社10月11日讯，本周十大券商最新策略观点新鲜出炉，具体如下： 中信证券：用景气和供给出清来应对高利率，密切跟踪AI投资周期拐点 中信证券研报表示，油价回稳、非农数据低于预期、美联储加息预期下修，均未改变全球长债利率走高。背后的原因是持续强劲的私人部门投融资需求，在万亿美元投资带动下，北美率先走出了金融危机后低增长和低利率的“非常态”，全球高利率环境，在AI投资周期拐点前，是我们必须应对的常态。对海外高利率不敏感的需求只有北美AI以及与中国中央财政扩张相关的领域，而过去几年持股体验极佳的出海、资源板块都存在压力。在弱需求环境下，凸显出供给出清品种的稀缺性，反内卷进程明年依然值得重视。配置策略上，短期只能用景气品种和供给出清品种来应对高利率环境，建议密切跟踪AI投资周期拐点。 中信建投发布研报指出，节后A股行情低于预期，科技板块成为调整重心。短期看直接受FCC光模块限制与OpenAI收入不及预期冲击；根本原因是A股处于第二波杠杆结构调整期，叠加海外流动性紧缩与中东地缘扰动，风险偏好持续承压。但积极信号已开始累积：海外地缘缓和，国内稳市机制就位，同时科技板块业绩保持景气，后续若宏观扰动减轻叠加三季报业绩验证，市场预期有望扭转。配置上防御优先，红利资产为底仓；景气方向围绕三季报布局AI算力、化工资源品等盈利改善环节，以及欧洲能源安全逻辑下的新能源板块。 中金公司：业绩韧性与积极的稳增长信号有望支撑市场逐步回稳 中金公司发布研报称，展望10月，经历调整后，业绩韧性与积极的稳增长信号有望支撑市场逐步回稳。流动性紧缩预期是前期拖累市场情绪的重要因素。 中金公司认为，部分有色金属、受益于AI高景气与海外需求的科技硬件、创新药、CXO、水电核电、工程机械、液冷、集运油运、白酒、免税、旅游、游戏等领域三季报盈利增速有望较中报继续改善。面对偏弱的国内需求，近期稳增长信号已经陆续释放，有助维护投资者信心。 申万宏源：市场短期性价比已明显改善，小级别反弹可期 申万宏源研报指出，短期AI链仍偏逆风，但中期机会增加阶段，有效的AI链审美不变：1. 少数基本面预期能够超过6月底的方向。2. 27年景气相对26年继续改善的，可能是业绩消化估值后，分化走强的方向。3. 重视科技和非科技的主题投资。 非科技方向跑赢的时间拉长，高股息绝对收益时间拉长。非科技赛道方向，重点方向不变：CXO、创新药、煤炭、航运、贵金属、工业金属和基础化工。房地产销售新规后，进入历史遗留问题化解，增量政策布局期阶段；叠加短期地产销售有亮点，房地产中短期内可能反复有脉冲机会。高股息和科技赛道是“跷跷板效应”，据此关注银行和公用事业。在市场重回强势线索显现前，仍可以基于防御持有高股息。 东吴证券：政策延续“存量托底”主基调，AI产业趋势进展积极 东吴证券研报表示，政策延续“存量托底”主基调，AI产业趋势进展积极。节前政策端密集出台：央行下调PSL利率并扩围至“六张网”等新基建领域，科技创新及技改再贷款进一步加码支持重点项目；居民房贷贴息自10月1日起正式实施等。政策组合拳覆盖货币、财政与结构性工具等多个维度，既释放出稳增长、稳预期的明确信号，也凸显出本轮调控更加注重精准滴灌与存量优化。AI方面，产业层面虽无重磅的新共识形成但积极进展充足：模型发布加速，AI的新应用场景个人Agent出现渗透的早期信号。科技硬件作为即期和下期EPS能见度更高的品种在高息环境下具有分子端优势。 节后A股修复基础具备，外部风险犹存，短期均衡配置。节后A股存在修复基础，但短期行情空间受制于外部约束。制约因素方面，美债长端利率维持高位仍是短期最直接的外部约束，中东地缘局势仍具不确定性，能源通胀风险尚未消退。支撑因素方面：其一，假期海外市场整体偏暖，无重大“黑天鹅”事件冲击，纳斯达克指数连创历史新高为全球科技板块提供情绪支撑。其二，美联储10月加息预期大幅降温，短期缓解了成长股估值压力。其三，国内9月PMI重回扩张区间，基本面边际改善为市场提供底部支撑。其四，结合十一假期前后上证指数表现的历史规律，上证指数在假期前后呈明显反向特征，即：节前两周若录得正收益，节后两周往往承压回落；节前若持续调整，节后则大概率迎来修复性反弹。本轮假期行情节前指数走势偏弱，节后或有修复。最后，10月9日多只宽基ETF迎来成交大幅放量行情，凸显资金在市场调整阶段的低位布局意愿。结合历史经验，宽基ETF集体放量多为下跌/震荡中的承接信号—当日市场偏弱，随后1周企稳、1个月维度大概率上涨，且相对随机基准有超额。10月进入三季报集中披露窗口期，业绩兑现将成为市场定价的核心锚点，资金将进一步向业绩确定性方向倾斜。建议均衡配置，兼顾进攻弹性与防御韧性，同时对全球金融压力的演变保持警惕。 财信证券：证监会座谈会释放积极信号，市场底部支撑有力 财信证券首席经济学家、研究发展中心总经理袁闯认为，证监会座谈会释放积极信号，A股中长期向好趋势没有改变。 中期看，袁闯认为，经过数月低位震荡整理，A股对AI产业趋势放缓担忧、国际油价高企、美债收益率攀升、美联储重启加息周期等利空因素已反映较为充分，万得全A指数仍表现出一定韧性。在基准情形下，预计10月至11月A股有望逐步企稳，国内增量政策集中出台或将成为市场走出震荡区间的关键。 方正证券：积极布局把握好四季度做多窗口期，关注三方面配置机会 方正证券研报指出，积极布局把握好四季度做多窗口期，关注三方面配置机会，一是科技的超跌反弹，进入10月份之后科技催化增多，AI的产业趋势和景气度仍较为坚实，近期大幅回调之后配置价值显著提高，关注10月公布的公募基金持仓变化，科技股内部向能涨价、能扩量、有新技术突破的细分方向倾斜；二是关注HALO资产逢低布局机会，油价回落之后，聚焦核心资源相关的有色金属+化工；三是对于货币政策变化反应最为直接，业绩估值匹配度较好，能够稳指数的非银金融。 银河证券：顶层文件对A股市场形成制度性重塑 银河证券策略研究解读《关于发展新质生产力的意见》称，本次顶层文件对A股市场的影响兼具短期风险偏好修复效应与中长期估值体系重构价值。长期来看，本次顶层文件从产业主线定位、投融资机制完善、估值逻辑重塑等维度，对A股市场形成制度性重塑：一是巩固新质生产力作为资本市场长期主线的地位，引导资金向创新产业倾斜，科技硬资产的长期定价权重抬升；二是重构估值体系，强化创新溢价，引导市场估值体系向具备核心技术壁垒、持续研发投入、真实产业化能力的创新龙头集中；三是扩容耐心资本，增厚优质科创资产供给，优化资本市场投融资生态。板块层面，关注“卡脖子”硬科技、AI场景应用、能源绿色低碳、传统产业优化升级等配置线索。 国金证券：9月旺季经济边际企稳，内需修复尚在初期 9月旺季制造业PMI回升，经济似乎出现企稳信号，但拆分结构来看，生产与需求分化仍明显，生产端的改善主要来自于季节惯性、政策和外需，内需修复尚在初期。当前的生产韧性需要需求接棒才能持续，而四季度政策能否有效托举内需，将决定供需缺口是走向收敛还是进一步扩大，也决定了经济是走向共振企稳，还是更深调整。",

    "title": "优先股票配置！券商资管四季度最新策略",
    "link": "https://www.stcn.com/article/detail/4211291.html",
    "pubDate": "2026-10-11T22:08:19+08:00",
    "description": "今年以来，债券市场经历多次预期反转，权益市场波动也有所加大。进入四季度，大类资产该如何配置？“固收+”产品又将如何调整策略？ 券商中国记者近日采访了多家券商资管机构投研负责人。综合来看，股票整体优于商品及债券成为不少机构共识；债市方面，多家机构认为四季度大概率维持偏强震荡，利率中枢有望稳定。 股票配置优先级整体优于商品、债券 进入四季度，资管机构对于大类资产的排序如何？整体来看，多数受访机构将股票的配置优先级排在第一位，而债券与商品的排序则有分歧。 “从相对性价比看，股、债整体可能优于商品。”财通资管首席资产配置官李美岑告诉记者，股票方面，多数宽基指数估值处于历史60%左右分位，创业板指约25%分位，可在成长景气细分、传统低估分红可持续方向挑选三季度有业绩支撑或2027年具备估值切换机会的方向。商品方面，三季度石油链条、农产品涨幅较大，其他方向调整较多，四季度可围绕低位品种布局。 光证资管相关负责人认为，四季度大类资产相对性价比为“股票>债券>商品”。政策发力节奏后移，7—8月内需压力增大，下半年经济大概率“先抑后扬”，有利于四季度股市表现，行情有望从AI向传统行业扩散。债券虽利率处于历史低位，但考虑到央行维持适度宽松，“资产荒”大概率持续，债券在获取稳定收益方面仍有优势。商品四季度压力主要来自美联储，发达国家通胀仍高，油价涨幅可观，美联储抑制通胀决心坚定，原油和黄金短期都或有压力。 德邦资管的排序为“权益优于商品，商品优于债券；黄金作为货币信用对冲维持基准配置，同时保留一定现金缓冲”。权益排最前，因股债性价比处于57%分位、赔率改善，且“杀估值不杀盈利”意味着后续修复弹性更多在估值端。商品居中，原油是当前唯一达到“拐点级”变化的商品，三季度上涨约49.5%、全年约59.2%，直接对应输入型通胀风险；叠加AI建设对实物需求拉动，全球性通胀韧性较强。债券最后，因国内经济具备结构性韧性，债券赔率较弱、降息空间兑现较慢。 中泰资管基金经理唐军告诉券商中国记者，当前我国处于货币宽松、信用扩张偏弱状态，宏观流动性充裕。A股回调后的配置价值较高。大宗商品可能分化，铜、铝、锡等有色金属受AI算力、数据中心、电力投资需求拉动，同时受产能和全球资源民族主义供给制约，配置价值较高；能源、化工、农产品等受中东局势和超强厄尔尼诺预期影响，波动可能较大。债券表现较强，但隐含收益率已到较低位置，四季度若财政力度加大或房地产企稳，债市可能面临回调压力。 国联资管则认为，四季度所有大类资产面临全球流动性不确定性的共同约束。AI资产基本面仍强，但增速的增长速率已开始下行，流动性预期冲击对风险资产敏感性或大幅上行。长期维度相对看好商品中的黄金和有色金属；国内债券中性偏多，注重票息策略和曲线形状交易；对于权益资产则应保持更谨慎均衡的配置结构。 债市方面，多家机构认为四季度大概率维持偏强震荡，利率中枢有望保持稳定。 国金资管固定收益投资部认为，四季度债市偏强逻辑将延续，内需偏弱导致融资需求或继续磨底，基本面对债市支撑牢固。节奏上预计“先震荡后走强”：9月至10月上旬，政府债供给放量、季末信贷冲量、理财回表压力形成扰动；随着供给高峰过去、保险等配置盘跨年配置需求启动，叠加明年置换债退出后供给退坡预期，债市有望迎来走强窗口。 国联资管表示，今年以来债市经历多次预期反转，当前内需发力仍是重要发展点，保持合理宽松的必要性仍在，为债市创造了一定的稳定“温床”。外部压力虽有，但基调不变，冲击或有限。整体债券市场波动可能仍处于较低区间，四季度有望在可控区间内“震荡”，但需关注不可控变量对基本面和政策发力重心的影响。 光证资管认为，四季度债市整体环境或延续“稳中偏暖、区间运行”。节奏上，四季度政府债供给或阶段性放量，但随着银行补充资本债发行，负债端压力有望边际缓解；化债接近尾声，明年专项债发行量有望继续下降，银行、保险等机构增配债券意愿增强。综合看，债市大概率震荡偏强，利率中枢稳定，阶段性存在小幅下行空间，供给放量期可能带来扰动，年末配置力量增强后更趋平稳。 “固收+”重回撤控制，多元分散成共同选择 券商中国记者获悉，在权益市场波动加大的背景下，多家机构对“固收+”产品的权益仓位与策略进行了调整，回撤控制与多元分散成为共同选择。 “‘固收+’产品中的泛权益仓位更加追求收益的稳健性，因此对回撤控制相对严格。针对近期权益市场波动加大的情况，我们在仓位上有一定收缩，并将底层资产和风格进行分散配置来力争控制回撤。”国金资管方面告诉券商中国记者。 国金资管称，四季度预计继续维持多元配置的思路，不将仓位集中于单一方向。具体而言，组合会在微盘、红利、科技、化工等多个风格和行业方向上均衡布局，通过不同风格之间的低相关性，力争实现风险对冲和收益来源多元化。四季度增强收益主要从三方面发力：一是转债条款博弈与个券挖掘；二是多元配置捕捉板块轮动超额收益；三是纯债部分夯实票息基础，灵活运用久期和骑乘策略。 光证资管也表示，公司权益仓位管理秉持中性偏谨慎原则，不进行单边风格押注。当前整体权益仓位保持弹性，结构上从前期极致集中的成长方向逐步向均衡再平衡，低波价值与优质成长兼顾。策略上坚持风格均衡与Alpha挖掘并重，权益部分以估值合理、业绩确定性高的个股为核心持仓，同时保留对AI等长期产业趋势的适度参与，但严格控制暴露，规避拥挤交易和纯动量博弈。四季度增强收益关注低估值价值方向的绝对收益机会，包括红利、金融等；挖掘GARP型选股；并灵活运用可转债、打新等低风险策略。 国联资管则表示，“固收+”的客户多数追求绝对收益，回撤和风险控制的重要性甚至高于收益弹性。在优质资产拥挤、波动放大的环境下，更注重资产横向分散，通过大类资产类别分散，利用资产间负相关性平抑波动。",

    "link": "https://www.yicai.com/news/103388982.html",
    "pubDate": "2026-10-11T22:08:14+08:00",
    "description": "第一财经 2026-10-11 21:36:49 听新闻 “最严汽车创新管控”新规距离正式落地又进一步。 10月10日，工信部、公安部、生态环境部、市场监管总局联合发布《关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）》（下称“征求意见稿”），为汽车产品创新划定验证规范红线。 征求意见稿核心监管方向有两方面：一是约束激进式创新，包括禁止全隐藏式门把手、行车时不可使用“零重力”座椅、规范使用异形方向盘、不得采用折叠显示屏等，强化创新设计的准入管理；二是加强汽车研发测试验证技术规范，明确车辆需完成综合可靠性与耐久性、结构可靠性、软件功能可靠性、环境适用性等多项测试验证，要求开展不低于3万公里可靠性验证试验、落实“两冬一夏”验证周期等，遏制“速成车”现象。 与此同时，维修经济性、规范营销宣传两项内容首次纳入汽车准入管理，进一步压实车企主体责任。 中国汽车流通协会专家委员会委员李颜伟在接受第一财经采访时表示，征求意见稿将监管重心从“产品是否达标”前移至“研发环节是否充分验证”。文件串联起全链条管控：在研发阶段识别潜在风险，申报机动车产品公告时提交完整验证材料，车辆量产之后持续核查生产一致性。这比只看一张最终合格报告，更接近汽车安全问题的实际成因。 今年8月，工信部副部长辛国斌在一场新闻发布会上表示，在汽车产业获得一定成绩的同时，产业发展也存在一系列的问题和挑战，包括一些激进式创新设计、未经充分实验验证就装车应用，还出现了个别引发社会关注的汽车产品质量等事件，这些问题都不容忽视、不可回避。 李颜伟解读征求意见稿时表示：“对行业而言，汽车‘先上市，后续通过OTA（远程升级技术）修补问题’的操作空间被压缩，软件升级同样需要充分验证，并留存内部审批记录；整车快速迭代节奏或将放缓。‘两冬一夏’、实车实测、供应链入厂检验、资料归档留存等要求，将抬升车企前置研发投入。拥有自建试验场、实验室以及成熟流程体系的大型车企，面临的边际压力相对更小。而对消费者来说，车辆功能边界将更加清晰，紧急工况下的处置方式不再模糊。” 征求意见稿此次对制动系统、全隐藏式门把手、“零重力”座椅、电吸门、语音交互、异形方向盘、辅助驾驶等创新功能的验证要求逐一明确。例如门把手创新设计，需验证极端环境下功能稳定性与紧急场景可操作性，具备机械冗余设计和手部操作空间，禁止配备全隐藏式门把手。 此外，电吸门、座椅放倒、中控屏、虚拟操纵件等新车常见卖点功能，除满足强制性国标外，还需要完成充分安全评估验证。其中，电吸门需具备防夹功能；“零重力”座椅要兼顾防夹与碰撞安全，车辆行驶时不可启用；中控娱乐屏需开展碰撞安全评估，不得使用折叠、柔性显示屏。 涉及除霜除雾、车灯、雨刮、车门、前机盖等关键驾驶安全功能，行驶过程中，不允许非驾驶人通过语音、手势交互直接操控；灯光、雨刮等安全功能如采用虚拟操纵件，需评估各类场景下的操作可靠性，同时保留实体操纵件。应急逃生、应急制动、电源切断等安全装置，应具备实体操纵件和醒目标识，便于应急操作。 征求意见稿提出，自2027年1月1日起，新申报《道路机动车辆生产企业及产品公告》、带有创新设计的车型，车企需填报创新设计技术参数，并提交配套验证材料。未按照相关要求进行测试验证、测试验证不充分或提供虚假验证材料的产品，工信部将不予公告。 本次准入申报新增51项车辆技术参数，其中41项对应创新设计、10项针对研发测试验证，覆盖“零重力”座椅、组合驾驶辅助信号灯等项目。车企需按产品实际情况填报，并提交承诺书，承诺完整、准确填报有关技术参数，确保一致性。 征求意见稿还首次在汽车准入管理中明确营销宣传规范，明确车企应当真实客观开展营销宣传活动，如实宣传产品创新设计的使用边界、限制条件和研发测试验证等情况，不得作虚假、夸大或引人误解的宣传，不得使用违反道路交通法规的场景来宣传产品功能，不得诱导驾驶人忽视安全驾驶责任。 研发测试验证技术规范是另一重点，直指近期汽车软硬件安全质量暴露的诸多问题。 结构可靠性验证覆盖车身、车架、悬架、转向、制动等关键结构件的疲劳寿命、极限工况力学性能，同时包含线束、后处理装置等部件的安全、环保与整车可靠性测试。配套标准GB/T 47315《汽车结构耐久性道路模拟台架试验方法》已于今年10月1日实施。 李颜伟认为政策方向值得肯定，但征求意见稿尚未界定极限工况、载荷标准与失效判定规则。GB/T 47315是道路模拟台架的试验方法，不能替代对每个部件的风险识别和合格判定。他建议要求企业说明载荷来源、设计边界、安全冗余、失效后果，以及实测数据和仿真结果如何对应等，以便准入审查和事后调查有据可查。 业内长期担忧的“速成车”问题，也是本次监管重点。麦肯锡报告显示，当前国内新车开发周期约24个月，远短于传统燃油车时代约60个月的周期。第一财经了解到，有车企为加快研发周期，研发测试80%靠仿真，仅20%靠真实测试。 征求意见稿要求，整车综合可靠性与耐久性验证，需覆盖强化坏路、一般公路、高速公路、山路等典型路况，车企要开展不少于3万公里可靠性验证试验。 配套国标也在同步修订。今年7月，全国汽车标准化技术委员会电动车辆分会发布三项推荐性国标修改单征求意见稿，拟将纯电动、燃料电池汽车定型可靠性行驶试验里程，由现行1.5万公里提升至3万公里，和燃油车标准持平。 征求意见稿还要求，车辆环境适应性验证周期不少于1年，且必须完成“两冬一夏”测试；需使用多辆测试车辆，完整覆盖全部关键配置。企业可采用反季节试验、室内环境舱模拟试验等替代方式，须确保其验证效能不低于实际道路测试，但针对多因素耦合的综合环境难以等效替代的，应进行实际道路测试。 软件功能可靠性验证贯穿研发全流程，覆盖系统测试与整车验证；涉及OTA升级，必须完成充分测试，并在备案材料中附带企业内部审批记录。 李颜伟表示，3万公里可靠性试验、一年环境适应性测试，可以有效遏制车企刻意压缩研发周期的行为。但测试路况、载荷、气候覆盖范围、验证强度等细则仍待明确，避免试验执行尺度存在差异。他建议将两项指标定为最低门槛，配套明确必须覆盖的场景与通过标准；企业采用模拟试验替代实路测试时，要提供等效性证明材料。 中国汽车工业协会（下称“中汽协”）10月11日发文表态支持本次政策，并向全行业发出倡议。中汽协称，汽车电动化、智能化转型加速，新技术新功能广泛落地，但部分企业片面追逐创新噱头、忽视安全底线，设计不合理、验证不充分等问题，给产品安全与产业高质量发展埋下隐患。本次政策意在引导行业树立安全优先、理性创新理念，把安全评估、可靠性验证贯穿研发全流程，从源头化解安全风险，统筹创新发展与安全治理。 中汽协倡议，车企落实主体责任：严守安全底线，规范创新设计，摒弃重形式、轻安全的非理性创新，将安全评估前置；完善研发验证体系，强化整车可靠性、复杂环境适应性全场景试验，补齐验证短板；坚守质量底线，依靠充分测试保障车辆安全可靠，实现技术创新和安全管控协同发展。 刹车踏板工程设计原则是，任何情况下都不应该能被正常人踩断。 市场目前定价显示，美联储、欧央行、英国央行三大央行未来一年将至少加息三次。",

    "pubDate": "2026-10-11T22:08:24+08:00",
    "description": "近期，也门冲突各方展开了激烈的“机场互袭战”，位于沙特利雅得的国际机场、位于也门政府军控制区的亚丁国际机场、以及位于也门胡塞武装控制区的萨那国际机场和荷台达国际机场频遭袭击。 在10日，沙特首都利雅得国际机场遭受了一次严重袭击。根据沙特民航部门11日凌晨公布的最新统计，此次袭击已造成12人死亡、309人受伤。 美国总统特朗普也在10日的沙特首都机场遭袭事件发生后作了声明，但仅表示美国有可能加入沙特对胡塞武装的打击行动，并未明确承诺。 沙特首都机场近期数度遭袭 已致数百人伤亡 沙特阿拉伯民航部门11日发表声明说，位于利雅得的哈立德国王国际机场10日下午再次遭到袭击，造成12人死亡、309人受伤，袭击造成机场设施不同程度的损坏，机场已暂停运营。 在10日的这次遭袭之前，沙特民航总局曾在9日发表过声明，确认哈立德国王国际机场在8日时遭到两次袭击，造成3名沙特公民死亡、多人受伤。在10月7日，沙特民航部门也曾发声，确认沙特西南部的艾卜哈国际机场和位于首都利雅得的哈立德国王国际机场6日至7日遭到袭击，共造成3人死亡、36人受伤。 沙特首都机场10日再遭袭 已无航班起降 在10日的这次最新的袭击事件发生后不久，有目击者称，哈立德国王国际机场3号航站楼当天下午传出爆炸声，机场内人员被疏散撤离。 爆炸发生后，航班追踪网站信息显示，该机场已无航班起降，部分飞往利雅得的航班已备降或返航。哈立德国王国际机场发布旅客提醒说，建议旅客在前往该机场前联系航空公司并确认航班状态。 受安全局势影响，科威特航空公司10日表示取消往返利雅得的航班。此前在8日和9日阿联酋阿提哈德航空公司和卡塔尔航空公司已分别宣布取消前往利雅得的多趟航班，在10日的爆炸发生后，阿提哈德航空公司宣布将取消航班的时间延长至10月12日。 美总统称美可能参与沙特对胡塞的军事打击 在10日的沙特首都机场遭袭事件发生后，美国总统特朗普也作了表态。特朗普称，美国“可能”加入沙特针对胡塞武装的打击行动，“我们将仔细考虑”。 此前在9月上旬胡塞武装持续攻占红海沿岸战略要地之际，沙特阿拉伯王储穆罕默德就曾被曝致电特朗普，要求美方打击胡塞武装，但美总统表示拒绝。据知情美官员透露，美国政府暂时没有直接打击胡塞武装的计划。 有分析认为，美国之所以一直对直接打击胡塞武装态度冷淡，出于多方面限制因素。在当前与伊朗战事还未结束且因伊朗战事大量消耗的弹药库未能得到补充的当下，保护沙特并非美国当前战略优先事项，因此美国不愿开辟也门新战线。 也门胡塞武装：愿与沙特避免互袭民用设施 胡塞武装方面，在10日当天，该武装控制的马西拉电视台也报道称，沙特领导的联军10日袭击了胡塞武装控制的也门萨那国际机场，目前尚无伤亡和损失的报告。当日稍晚时，胡塞武装方面则表达了愿与沙特停止互袭机场、海港等人道主义设施的意愿。 也门胡塞武装表示，愿意与沙特阿拉伯采取相互对等的措施，避免将机场、海港及其他具有人道主义功能的设施卷入不断升级的军事对抗。该组织还表示愿意推动各方避免袭击此类设施，并将机场和海港列为优先保护对象。 半岛电视台：胡塞武装袭击沙特机场系对等回应 胡塞武装此前一直指责沙特于7月13日袭击也门首都萨那国际机场，导致双方缓和局势结束。 有分析认为，这也是胡塞武装近期持续打击沙特首都利雅得国际机场的原因之一。半岛电视台分析认为，萨那国际机场和荷台达国际机场是国际航班和人道主义援助进入胡塞武装控制区的关键入口，由于沙特方面的攻势持续，胡塞武装对沙特机场的袭击是对等回应。 另有分析认为，威胁沙特的商业和旅游业发展可能也是胡塞武装打击沙特首都机场的目的之一。",

    "description": "【财新网】全球金融监管机构对银行危机处置能力的一项最新评估显示，中国内地现有制度在应对系统重要性银行倒闭时，仍存在资金保障不足、应急安排不够成熟等问题，与国际金融稳定标准存在较大差距。 当地时间10月9日，金融稳定理事会（Financial Stability Board，FSB）发布的《公共部门后备融资机制专题评估报告》，将中国内地的总体评级定为“重大不合规”，在资金安排的可信度及防范道德风险两项核心指标上，同样给予“重大不合规”评级。不过，在确保公共资金损失得到追偿方面，中国内地获得“基本合规”评级。",

    "pubDate": "2026-10-11T22:08:19+08:00",
    "description": "10月11日，天风证券公告称，拟联合控股股东湖北宏泰集团及其下设主体宏泰资本，对湖北宏泰启航企业管理合伙企业（有限合伙）实施增资，注册资本由5000万元增至50亿元，重点投向科技创新与战略性新兴产业。 据悉，在湖北加快建设武汉区域科技创新中心、券商股权投资业绩加速兑现的背景下，这既是天风证券深化“三投联动”、培育新利润增长点的关键落子，也为观察券商另类投资子公司的业绩弹性提供了最新样本。 公告显示，天风证券拟通过全资子公司天风创新认缴出资不超过24.5亿元，宏泰集团拟认缴不超过25亿元，宏泰资本作为执行事务合伙人拟认缴0.5亿元。增资完成后，宏泰启航注册资本将增至50亿元。投资方式以股权投资为主，可通过首次公开发行、增资扩股、股权受让、上市公司定向增发、大宗交易及协议转让等方式开展。 天风证券称，此次增资旨在贯彻落实湖北省建设武汉区域科技创新中心战略部署，践行“三投联动”发展战略，依托各方资源布局科技创新和战略性新兴产业赛道，挖掘湖北省内优质科创企业股权投资机会。增资有利于丰富另类投资资产组合，拓展股权投资业务布局，赋能湖北省内实体经济与科创产业发展，并借助项目投资退出实现投资收益。 湖北省委相关全会提出，要以加快建成支点为总目标，以武汉光谷为先导，以武汉区域科技创新中心为核心引擎，以武汉都市圈为重要载体，统筹推进科技创新、产业创新、金融创新、区域创新、开放创新和治理创新。同时，湖北省科教资源富集，多层次科研平台、高端人才储备厚实，已形成发展势头强劲的科创产业生态。当前，光电子、新能源、半导体、生物医药等硬科技赛道活力持续迸发，武汉光谷科创企业集聚效应凸显，省级“金种子”“银种子”上市后备企业库持续扩容。 业内人士分析，硬科技企业攻关突破，既需要自身持续技术攻坚，更离不开长期耐心资本赋能。湖北省良好的创新资源禀赋与产业生态，为宏泰集团与天风证券落实“科技金融+”、推进科技、产业、金融良性循环创造了有利条件。此次联手控股股东加码硬科技，是天风证券加速打造“六新”天风建设的重要举措，亦是在培育新的利润增长点。 此前，天风证券已依托“投研、投行、投资”三投联动业务模式，在湖北省内落地宜昌兴福电子项目。兴福电子于2025年1月登陆科创板，上市后市值一度较发行时增长超过10倍。 不过，天风证券也提示，目前相关协议尚未完成正式签署，增资事项以最终签署的正式协议为准，能否顺利实施、最终达成及实施时间均存在不确定性。宏泰启航未来经营中可能面临宏观经济环境、行业政策调整、市场需求变化等不确定因素影响，可能存在一定经营风险、无法实现投资预期等风险。 在加码硬科技的同时，天风证券上半年业绩明显回暖。 2026年半年报显示，该公司实现营业收入15.88亿元，同比增长29.94%；归属于母公司股东净利润2.04亿元，同比增长549.03%。这一成绩与一季度仅22.36万元的归母净利润形成鲜明对比——二季度单季净利润环比增长超过910倍，上演业绩大逆转。 今年一季度，天风证券归母净利润仅22.36万元，同比暴跌99.07%，核心拖累来自自营投资板块。当季投资收益仅7125.87万元，较上年同期的4.42亿元减少超3.7亿元，降幅超八成。进入二季度，情况发生根本性扭转。半年报显示，该公司上半年投资收益为4.52亿元，公允价值变动收益达3.15亿元，同比大增171.76%，自营业务成为本轮业绩修复的核心驱动。 经纪业务同样受益于市场回暖。上半年，天风证券经纪业务手续费净收入达6.82亿元，同比增长60.6%；公司托管资产规模达2583亿元，同比增长31%；总客户数达195万户，较上年末增长2.2%。同期，资管业务手续费净收入1.52亿元，同比增长8.6%；投行业务手续费净收入2.92亿元，同比下降31.61%。 今年5月首次以天风证券党委副书记身份亮相时，天风证券新任总裁罗国华便清晰擘画了公司未来发展路线：建设国家产业智库、深化“三投联动”打造产业投行、建设买方投顾体系拥抱财富管理大时代。 另类子业绩爆发，科创投资成“蓄水池” 科创东风劲吹，“投早、投小、投科技”的券商股权投资迎来业绩兑现期。 据券商中国记者统计，有数据可查的41家上市券商中，另类投资子公司上半年合计净利润达202.75亿元，约是上年同期的6倍；私募投资基金子公司合计净利润达37.5亿元，同比增长逾4倍。其中，六成券商两类子公司合计净利对母公司的贡献在5%及以上，一家券商另类子净利甚至超过母公司归母净利润。 从格局看，头部券商贡献绝对增量，部分中小券商也跻身“前十阵营”。2026年上半年，股权投资市场景气上行，叠加科创企业资本化提速，半导体、具身智能等硬科技头部IPO项目密集发行，深度参与其中的券商迎来“双丰收”。 从净利润规模看，长江证券、东方证券、华安证券的另类子位居前列。其中，长江创新以9.01亿元净利润排在中信建投之后，位列第五；东证创新和华富瑞兴上半年净利润分别达5.52亿元和5.34亿元，对母公司净利润的贡献分别达12%和25%。 天风证券、东吴证券、国元证券和财通证券的另类子上半年净利润均过亿元。其中，天风创新净利润达2.85亿元，超过母公司同期净利规模（2.04亿元）。半年报显示，天风创新紧扣“强内控、促协同、优存量、拓增量”主线，全力加速已投项目资金回笼。 在中金公司非银分析师团队看来，科创投资的业绩贡献并非市场行情的简单放大器，而是充当券商业绩的“蓄水池”。该团队预计，科创投资仍将是影响上市券商第三季度业绩的关键变量，尤其是是否布局长鑫科技项目。",

    "pubDate": "2026-10-11T22:08:24+08:00",
    "description": "据美国《华盛顿邮报》网站10月10日报道，在试图重新命名墨西哥湾与安大略湖之后，美国总统特朗普10日提出为更多水域更名的想法。 特朗普在田纳西州克拉克斯维尔的一次集会上说：“我们命名了海湾，我们命名了一片美丽的湖泊。现在有人说，你需要命名一条河……我们需要命名一条河。我们需要命名一片海洋。” 特朗普说，他可能会重新命名大西洋或太平洋，还表示新名字可能是为了纪念他自己。 特朗普说：“我们可以称之为‘特朗普洋’或者‘美国洋’之类的。我认为，在我卸任之前，我们应该命名一片海洋，还要命名一条大河。” 特朗普去年将墨西哥湾更名为“美国湾”，导致美墨外交关系紧张，并在美联社拒绝使用新名称后与之发生争执，此外还造成了其他矛盾。 今年8月，特朗普将位于美国纽约州与加拿大之间的安大略湖更名为“美国湖”，当时美国正与加拿大就贸易和关税问题发生争执。 特朗普上月还提议将新墨西哥州更名为“新美国州”。此举可能需要该州与国会采取相关行动。特朗普上周表示，是否更名将“取决于”新墨西哥州民众。 特朗普在一段支持该州一名共和党国会议员候选人的视频中说：“我不会推动此事，但很多人都很喜欢这个想法。”",

    "title": "人民日报：一辆汽车的刹车踏板，绝不应该在驾驶中出现“断裂”",
    "link": "https://www.cls.cn/detail/2501423",
    "pubDate": "2026-10-11T22:08:24+08:00",
    "description": "工信部等四部门10日公开发布关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）。汽车产品创新设计技术指南围绕虚拟操纵件、门把手、新型人机交互系统、大角度座椅等方面提出具体测试验证要求。 业内普遍认为，四部门发布的新规是对“速成车”说不！ 这几天，舆论广泛关注尊界V800刹车踏板支架断裂事件，讨论的焦点就是汽车尤其是“速成”新能源车的安全问题。尽管事件有待权威的调查结论，但有一点毋庸置疑：一辆汽车的刹车踏板，绝不应该在驾驶中出现“断裂”！ 何为“速成车”？这其实是对那些为了抢占市场份额，过度压缩研发周期，删减实车验证流程而推出的车型的统称。“有的品牌为了追求上市速度，很多该做的实验没有做，消费者成了‘试车员’。”北京现代总经理李凤刚曾在2026年中国汽车论坛上直言。 “速成车”以“快”抢占市场，却在“缺”上埋下隐患，背后暴露的是流程缺位、验证缩水。 某车企测试工程师解释：“一款新车型仅在测试流程中往往便需要完成制动、转向、操稳性、平顺性、动力性、经济性等基本参数测试。此外，高温、高原、极寒标定和环境适应性里程测试也都必不可少。” 完成这些测试，自然要付出相应的时间。同济大学汽车与能源学院教授朱西产在采访中表示：“在新车型的整个开发周期中，整车道路测试需要两冬两夏，即便是小改型，一冬一夏、3万公里真实道路测试也是必要的。”朱教授还举了一个例子：现在有很多针对“速成车”易生锈的投诉，其中湿热、腐蚀测试缺失是重要诱因之一。 一个案例是，某新能源车企在新车门把手测试中，总测试次数为1万次，其中仅2000次为实物测试，其余8000次全部由仿真完成。有的车企只做20%的真实测试，剩余的80%测试依靠仿真测试完成。 “速成车”以仿真测试代替真实路测的投机取巧，是极限工程测试的大幅缩水，是删减验证科目、跳开验证流程的偷工减料，而这些，最终却在由消费者买单。 今年夏天，重庆持续遭遇40℃以上的极端天气，不少某品牌新能源车主发现，车辆在行驶中出现空气弹簧漏气、车身单侧塌陷的情况，车辆无法继续行驶。一遇高温就集中趴窝，不免让人质疑：上市前的极热试验究竟到不到位？ 我国汽车市场竞争激烈，一些车企不“卷”质量“卷”速度，最终被证明：此路不通。追求“上新”速度的“速成车”无法在市场竞争中行得远、跑得稳。 今年7月，全国汽车标准化技术委员会公开征求意见，拟将三类新能源汽车可靠性行驶试验总里程统一提至不低于3万公里，与燃油车标准对齐。 中国汽车流通协会乘联分会负责人崔东树将此措施比喻为新能源车的“成人礼”。崔东树说：“标准的出台旨在遏制开发周期快速缩短的趋势，让新车型测试更加规范，标志着中国新能源汽车产业正式告别政策‘襁褓’，从‘培育优先’转向‘规范优先’。” 达到“3万公里”的标准虽然不能直接和车辆安全画上等号，但是整顿“速成车”的信号灯已经亮起——车企“上新”靠的是技术水平和生产效率提升，而不是少做了本应该做的测试；车企提高开发效率，不能以质量品质降低和安全保障缺失为代价。 今年8月，工信部等部门联合发布通知，在全国范围内开展为期1年的道路机动车辆产品生产一致性和质量提升专项行动，集中整治道路机动车辆产品生产一致性、可靠性、耐久性、新技术测试验证等四方面问题。 查一致性，严防“送检一套、量产另一套”；查可靠性，检验车辆能否在日常使用中稳定运行不出故障；查耐久性，不仅关注新车设计使用寿命，还关注投产前的研发周期情况；查新技术测试验证，检验创新设计的风险评估是否充分，新材料、新结构是否存在产品缺陷、疲劳失效等风险隐患。 对于个别企业存在片面追求降低成本、忽视产品质量要求的问题，对于将未经充分测试验证的技术或设计上车应用，带来产品质量安全隐患的问题，10月10日监管部门祭出重拳，就是从汽车产品创新设计验证测试源头予以纠偏。 安全是汽车工业不可逾越的红线，保障安全是中国汽车最重要的功能。对于消费者而言，车辆可以不具备顶尖的加速性能或智能配置，但绝不能在关键时刻，在最基础的安全问题上“掉链子”。 “稳”是一种更持久的“快”。近年来，我国汽车产业尤其是新能源汽车产业实现了跨越式发展，来之不易的产业生态、社会信任、消费者口碑，需要产业各方共同维护。创新的脚步不会因为精益求精而变慢，安全才是中国汽车越跑越稳的底气所在。 （原标题：《超话车｜四部门联手，对“速成车”说不！》）",

    "title": "超话车｜四部门联手，对“速成车”说不！",
    "link": "https://www.stcn.com/article/detail/4211283.html",
    "pubDate": "2026-10-11T22:08:19+08:00",
    "description": "工信部等四部门10日公开发布关于进一步加强汽车产品创新设计和研发测试验证有关管理工作的通知（征求意见稿）。汽车产品创新设计技术指南围绕虚拟操纵件、门把手、新型人机交互系统、大角度座椅等方面提出具体测试验证要求。 业内普遍认为，四部门发布的新规是对“速成车”说不！ 这几天，舆论广泛关注尊界V800刹车踏板支架断裂事件，讨论的焦点就是汽车尤其是“速成”新能源车的安全问题。尽管事件有待权威的调查结论，但有一点毋庸置疑：一辆汽车的刹车踏板，绝不应该在驾驶中出现“断裂”！ 何为“速成车”？这其实是对那些为了抢占市场份额，过度压缩研发周期，删减实车验证流程而推出的车型的统称。“有的品牌为了追求上市速度，很多该做的实验没有做，消费者成了‘试车员’。”北京现代总经理李凤刚曾在2026年中国汽车论坛上直言。 “速成车”以“快”抢占市场，却在“缺”上埋下隐患，背后暴露的是流程缺位、验证缩水。 某车企测试工程师解释：“一款新车型仅在测试流程中往往便需要完成制动、转向、操稳性、平顺性、动力性、经济性等基本参数测试。此外，高温、高原、极寒标定和环境适应性里程测试也都必不可少。” 完成这些测试，自然要付出相应的时间。同济大学汽车与能源学院教授朱西产在采访中表示：“在新车型的整个开发周期中，整车道路测试需要两冬两夏，即便是小改型，一冬一夏、3万公里真实道路测试也是必要的。”朱教授还举了一个例子：现在有很多针对“速成车”易生锈的投诉，其中湿热、腐蚀测试缺失是重要诱因之一。 一个案例是，某新能源车企在新车门把手测试中，总测试次数为1万次，其中仅2000次为实物测试，其余8000次全部由仿真完成。有的车企只做20%的真实测试，剩余的80%测试依靠仿真测试完成。 “速成车”以仿真测试代替真实路测的投机取巧，是极限工程测试的大幅缩水，是删减验证科目、跳开验证流程的偷工减料，而这些，最终却在由消费者买单。 今年夏天，重庆持续遭遇40℃以上的极端天气，不少某品牌新能源车主发现，车辆在行驶中出现空气弹簧漏气、车身单侧塌陷的情况，车辆无法继续行驶。一遇高温就集中趴窝，不免让人质疑：上市前的极热试验究竟到不到位？ 我国汽车市场竞争激烈，一些车企不“卷”质量“卷”速度，最终被证明：此路不通。追求“上新”速度的“速成车”无法在市场竞争中行得远、跑得稳。 今年7月，全国汽车标准化技术委员会公开征求意见，拟将三类新能源汽车可靠性行驶试验总里程统一提至不低于3万公里，与燃油车标准对齐。 中国汽车流通协会乘联分会负责人崔东树将此措施比喻为新能源车的“成人礼”。崔东树说：“标准的出台旨在遏制开发周期快速缩短的趋势，让新车型测试更加规范，标志着中国新能源汽车产业正式告别政策‘襁褓’，从‘培育优先’转向‘规范优先’。” 达到“3万公里”的标准虽然不能直接和车辆安全画上等号，但是整顿“速成车”的信号灯已经亮起——车企“上新”靠的是技术水平和生产效率提升，而不是少做了本应该做的测试；车企提高开发效率，不能以质量品质降低和安全保障缺失为代价。 今年8月，工信部等部门联合发布通知，在全国范围内开展为期1年的道路机动车辆产品生产一致性和质量提升专项行动，集中整治道路机动车辆产品生产一致性、可靠性、耐久性、新技术测试验证等四方面问题。 查一致性，严防“送检一套、量产另一套”；查可靠性，检验车辆能否在日常使用中稳定运行不出故障；查耐久性，不仅关注新车设计使用寿命，还关注投产前的研发周期情况；查新技术测试验证，检验创新设计的风险评估是否充分，新材料、新结构是否存在产品缺陷、疲劳失效等风险隐患。 对于个别企业存在片面追求降低成本、忽视产品质量要求的问题，对于将未经充分测试验证的技术或设计上车应用，带来产品质量安全隐患的问题，10月10日监管部门祭出重拳，就是从汽车产品创新设计验证测试源头予以纠偏。 安全是汽车工业不可逾越的红线，保障安全是中国汽车最重要的功能。对于消费者而言，车辆可以不具备顶尖的加速性能或智能配置，但绝不能在关键时刻，在最基础的安全问题上“掉链子”。 “稳”是一种更持久的“快”。近年来，我国汽车产业尤其是新能源汽车产业实现了跨越式发展，来之不易的产业生态、社会信任、消费者口碑，需要产业各方共同维护。创新的脚步不会因为精益求精而变慢，安全才是中国汽车越跑越稳的底气所在。 （执笔：石惟嘉、张奕雯、葛孟超）",

    "description": "10月9日晚间，两只PCB股广合科技、景旺电子双双发布三季度相关业绩预告，盈利均实现大幅增长。 广合科技(001389)公告显示，预计前三季度实现归母净利润14.5亿元—15亿元，同比增长100.33%—107.23%。广合科技表示，公司把握算力硬件需求激增带来的市场机遇，坚定聚焦通用服务器、AI服务器、交换产品，以及加速卡等算力PCB市场，经营业绩稳步提升；公司海外工厂泰国广合按原计划完成了核心客户的审核认证，成为推动公司算力产品销售增长的第二引擎，前三季度实现盈利。 景旺电子(603228)公告显示，第三季度实现归母净利达9.12亿元—10.89亿元，同比激增205.46%—264.74%。公司表示，受益于高速通信与AI数据基础设施领域的高性能PCB量产出货提速，叠加通用产品领域的成本价格合理传导、订单结构优化、内部降本增效等多措并举，预计公司2026年第三季度营业收入、净利润均实现同比、环比较快增长。 随着算力需求持续爆发，高端PCB产能供不应求。天风证券研报认为，AI服务器和高速交换机升级，正把PCB需求从普涨推向结构增长。Prismark2026年6月将2025年全球PCB产值上修至858.36亿美元，同比增16.7%；2026年预计达1019.54亿美元，增速18.8%。2025—2030年复合增速由7.7%上调至11%。根据PCBworld信息，当前PCB高端需求走强，上游材料供应同步紧张。 本周（10月5日至10月9日）港股市场主要股指集体上涨，恒生指数累计涨1%，恒生科技指数涨0.96%，恒生中国企业指数涨1.46%。 据证券时报·数据宝统计，本周南向资金合计两个交易日成交净买入67.68亿港元，连续七周为净买入。 从本周上榜成交活跃股名单来看，本周共有15只个股上榜，腾讯控股本周港股通合计买卖总额最高，达到100.38亿港元；中芯国际紧随其后，为56.3亿港元；其他还有建滔积层板、长飞光纤光缆本周港股通买卖总额超过50亿港元。 近期腾讯控股发布公告，10月9日回购23.9万股港股，每股加权平均回购价格为420.94港元，总支出1.01亿港元，全部拟注销。统计显示，腾讯控股今年以来已累计回购6732.77万股，回购金额达到320.43亿港元。 从成交净买入金额来看，本周南向资金对互联网巨头以买入为主，腾讯控股净买入21.93亿港元，阿里巴巴-W净买入4.66亿港元；小米集团-W遭净卖出4.89亿港元，长飞光纤光缆、中芯国际分别净卖出9.86亿港元、6.67亿港元。 行情上来看，成交活跃股本周以下跌为主，小米集团-W涨幅居首，一周累计上涨7.1%，友邦保险累计上涨2.96%，阿里巴巴-W上涨2.49%。英矽智能一周下跌14.93%跌幅最高，MINIMAX-W、华虹宏力分别下跌12.27%、10.38%。从股价表现来看，本周多只光通信股显著下跌。 从持股量变化来看，10月以来7股获得南向资金持股量较9月末增长超5%（剔除9月以来新纳入港股通的个股），西普尼居首，环比增长54.57%，挚达科技、先导智能、文远知行-W持股量环比增幅居前，持股量环比增幅分别为25.86%、15.11%、11.43%。 西普尼中期报告显示，上半年实现总营业收入3.33亿元，同比增长15.91%；税前利润为1.17亿元，同比增长68.96%；实现净利润0.99亿元，同比增长75.54%。个股具有“AI+黄金”概念，公司日前发布公告，公司推出全球首款足金智能戒指，并获北京国首珠宝首饰检测有限公司颁发行业首张足金智能戒指专项证书，实现“足金+智能”产品模式从概念到可检测、可验证、可商业落地的关键突破。 从港股通持股占港股总股数比例来看，本周港股通环比增幅超过5%的个股中，亿华通、挚达科技、健康160最新持股比例居前，分别达到37.46%、15.55%、14.94%。 亿华通今年以来股价持续回调，年内累计跌幅达到53.25%，南向资金持续加仓，最新持股量1676.85万股，为开通以来最高。",

    "title": "诺贝尔经济学奖明日揭晓，为什么获奖者总出自那几所学校？",
    "link": "https://www.yicai.com/news/103388802.html",
    "pubDate": "2026-10-11T22:08:14+08:00",
    "description": "第一财经 2026-10-11 12:58:47 听新闻 每年诺奖季，经济学奖都是压轴大戏。今年的奖项将在北京时间10月12日下午揭晓。 翻开半个多世纪的诺贝尔奖花名册，有一个很少被注意到的反差。物理、化学、医学奖得主中，获奖时身处本学科诺奖得主最多前十高校的只占两三成，七成以上来自其外；经济学则恰好相反：近六成得主获奖时就在那十所名校之中。把视线拉长到整个职业生涯，差距更加明显。经济学奖得主的任职时间，有一半集中在哈佛、芝加哥、麻省理工等8所大学。 高等教育在全球扩张，知识生产也越来越国际化，科学前沿本该更分散。但哈佛大学弗里曼（Richard B. Freeman）、清华大学谢丹夏等学者最新发表了一篇美国国家经济研究局（NBER）工作论文，题为《获奖经济学家的机构集中度居高不下并持续上升》。论文追踪了18个学科近两百年的数据，发现其中17个学科的获奖者越来越分散，只有经济学逆向成了集中度最高的学科。 为什么最好的人总是聚在最好的地方？这种极度封闭的“学术名校俱乐部”，究竟是知识生产的客观规律，还是一场隐秘的学术特权闭环？作为该项研究的共同发起者，清华大学社科学院经济学博导、人本健康经济发展研究中心主任谢丹夏接受第一财经记者专访时，拆解了这背后的四个原因。 论文梳理了18个学科的171个国际权威奖项，追踪近6000名获奖者从求学到任职的完整履历，时间跨度从19世纪到2020年代。衡量集中度的工具，是反垄断审查中常用的赫芬达尔-赫希曼指数（HHI），数值越高，说明越集中。 以获奖者整个职业生涯的任职年数计算，1960年经济学的集中度（HHI）为257，在18个学科中排第9，处在中游。此后半个多世纪，其他学科大多越来越分散：物理从136降到112，数学从331降到222，政治学、社会学、法学都降到了100上下。只有经济学反向上升，2022年升到387，排名第一。 若用经济学界习惯衡量贫富分化的基尼系数来透视，这种极化更为明显。经济学获奖者全生涯机构分布的基尼系数高达0.812。更形象地说，在产生过获奖学者的全球249所高校及科研机构中，仅哈佛、芝加哥、麻省理工、斯坦福、普林斯顿、耶鲁、加州大学伯克利分校和哥伦比亚大学这8所机构，就占据了全体经济学获奖者整整50%的学术工作岁月。 根据论文绘制的历史演进轨迹曲线，谢丹夏提醒，1990年至2010年，经济学的集中度斜率呈现出近乎陡峭的攀升状态。在20世纪90年代前半程的六年里，有五届诺贝尔经济学奖的得主名单中有芝加哥大学的学者。这段时期的上升，恰好与芝加哥学派的黄金时代重合。 不过，谢丹夏强调，这不能简单归结为某种意识形态的胜利，更多是方法论上的突破。1992年获奖的贝克尔（Gary Becker），把最优化分析延伸到家庭、犯罪、生育；1993年摘得桂冠的福格尔（Robert Fogel），则用计量方法重写了经济史。这些成果是芝加哥学者长期耕耘的结果。 伴随高等教育全球扩张与互联网协作兴起，自然科学稳步走向“去中心化”，经济学却逆向更加集中。论文在对比自然科学与工程学科时，首先将目光投向了物理资本与流动成本之间的“悖论”。 从直觉来看，人员流动越自由，资源应当越分散。但谢丹夏说，现实恰好相反，原因在于各学科的“知识生产函数”不同。物理、化学或生命科学高度依赖重资产与专用仪器，从极地探测阵列到占地巨大的同步辐射光源、粒子加速器，往往需要整栋实验大楼与海量经费托底。这些物质资产天然构成了人才迁移的高门槛。谢丹夏称：“哪怕哈佛这样拥有雄厚财力的顶级名校，也难以在寸土寸金的市区为挖角一位学者而一夜之间复刻一套造价昂贵的实验室。” 相比之下，经济学家的知识生产则完全不同，它对实体物质资本的依赖极低，核心资产高度凝结于学者的大脑，一张书桌、一台电脑便能开工。论文的实证追踪证实，经济学在全体科研门类中拥有最高的学者流动率，在获得重大奖项前的跳槽频率显著压倒依赖实验的学科。谢丹夏表示，正因为知识生产不被土地与重型仪器绑定，顶尖名校“掐尖”掠夺人才的成本反倒微乎其微。 另一个深层分水岭在于成果的验证模式。在硬科学和数学领域，突破性贡献往往体现为“单一且可验证的孤立发现”（single testable finding）。谢丹夏举例称，数学家张益唐在做出孪生素数猜想的重大突破之前，曾长期在学术体制边缘漂泊，在快餐店打过工。澳大利亚医生马歇尔（Barry Marshall）当年默默无闻，为了证明细菌会导致胃溃疡，亲自喝下了含细菌的培养液。但只要推导成立、实验可重复，成果最终都得到了承认，并拿到了大奖。 但经济学研究的对象是极端复杂的人类社会网络，很难存在“一锤定音”的判定性实验。论文在借助大语言模型对诺贝尔奖官方授奖评语进行系统文本归类后发现，在经济学诺奖得主中，高达55%的获奖依据是依托多篇论文在漫长岁月里构筑的“广谱体系工作”，“单一可检验发现”占比不到一半，且更多授予了理论、计量、方法类工作。 “自然科学可以有杨振宁、李政道先生三十岁出头凭借对称性推翻实验而光速摘得诺奖的传奇，但经济学绝无可能，”谢丹夏感慨，“宏观经济变量一年往往才产出一个数据点，一套增长理论是否扎实，往往需要数十年真实历史数据的反复沉淀。”当一项假说无法被客观实验在短期内彻底证实或证伪时，对它的肯定，高度依赖“经济学家群体的学科共识”。因此，机构的名望、师承的网络以及学术权威的背书，便不可避免地被当作了关键的质量替代信号。 然而，同为社会科学，社会学、政治学与法学的知识生产函数同样不需重资产，同样依赖长周期的证据推导，这些学科的获奖集中度却未增反降。 对此，谢丹夏提及了论文剖析的第三重机制，即经济学在整个社会科学谱系中，拥有绝无仅有的“高度统一范式”与极其严密的发表审查垄断。 在社会学或政治学中，学术生态允许多个流派并存，甚至在人性假定上针锋相对。学者即便不发核心期刊，也能靠深耕田野、出版一本具有洞见的专著立足，各大图书奖项同样认可这种贡献。 但现代经济学极度追求普遍规律，所有问题都被收敛到最优化、价格与均衡等标准框架下。谢丹夏说：“经济学界不存在所谓‘印度经济学’或‘毛里求斯经济学’，学术界只承认放之四海而皆准的经济学。”学者必须从一些现象中提炼出放之四海而皆准的经济学机制，才能获得主流认可。 统一的范式，也让成果的“出口”变得很窄。经济学高度依赖五大顶刊，比如《美国经济评论》（AER）、《经济学季刊》（QJE）。这些期刊与名校关系密切，甚至出现“主场现象”：论文引用的研究显示，2000至2016年间，QJE约四分之一的文章出自哈佛作者，约14%出自麻省理工作者；《政治经济学期刊》约14%的文章来自芝加哥大学作者。 这一格局在教职市场上也看得到。研究团队使用美国高校教师招聘网络数据发现，经济学是向上流动最难的学科之一，只有约6%的教师任职于排名高于其博士母校的院校，平级流动的比例高达91%，“向下安置”的比例仅有3%。作为对比，其他社会学科的向下流动比例在60%以上。 谢丹夏进一步提醒，这种闭环从学者的学术生涯起点便已铸就。论文对获奖者的统计显示，博士毕业院校的集中度甚至显著高于获奖时工作单位的集中度。同时，全美排名前十的顶尖经济系对其师资的博士出身的挑剔与集中程度同样高居各学科之首，其师资来源的集中度HHI指数接近780。 在谢丹夏看来，缺少实验这类“硬约束”，而“师承脉络”与母校背书就成了学者终身的信用资产。 谢丹夏长期研究反垄断与法律经济学，曾半开玩笑地想把这项研究命名为《经济学要不要反垄断？》。但他也说，这种集中是否损害了学科的配置效率，学术界目前“尚无定论”。他的担忧是，当整个学科过度拥抱同一种主流理论，颠覆性的非主流探索要挤进顶刊，难度会异常巨大。 不过，谢丹夏对未来相对乐观，认为眼下的集中并非不可逾越。他说，过去一个世纪以美欧名校为主导的话语权，本质上是建立在美国经济体量之上的。19世纪末至20世纪初，英国掌握着世界经济霸权，全球经济学的顶级阵地是英国皇家经济学会的《经济学杂志》。 他认为，经济学追求普遍规律，当一个国家成为世界经济的中心，其运行逻辑就会被学界锚定为“全球标准经济样本”。他预测，随着中国未来确立全球最大经济体的地位，“全球学者如果试图探寻现代经济的一般性规律，中国经验都将成为绕不开的必读样本与核心基准”，全球经济学的学术重心“必然发生深刻的‘东移’”。 随着新一届诺贝尔经济学奖揭晓在即，谢丹夏也给出了自己对前沿风向的独到研判。他分析，诺奖评选在长周期中有“领域轮动”的规律，现代经济学可分为微观、宏观和计量方法三大支柱，2025年的大奖已经授予了宏观领域，新一届奖项向微观经济学或计量实证方法倾斜的概率相对更高。 在这一逻辑下，诸如早期深耕微观机制设计、近年来在机器学习与因果推断交叉融合上做出开拓性贡献的苏珊·阿西（Susan Athey），或是极早系统量化自动化、人工智能对劳动力市场技能偏向型冲击的麻省理工学院教授大卫·奥特（David Autor），都是极具竞争力的人选。 全球PC第三季度出货量同比大跌两成。 继托马斯·特朗斯特罗姆、鲍勃·迪伦、露易丝·格丽克之后，安妮·卡森成为21世纪第四位主要以诗歌作品获奖的诺贝尔文学奖得主。 奖项授予亨利·卡根（Henri Kagan）和硤合宪三（Kenso Soai），以表彰他们在不对称有机合成中的非线性效应和自催化方面的发现。 是自1992年以来，时隔34年再次出现物理奖由一人独得的情况。",

    "description": "国庆节后A股各主要指数出现大幅波动，上证指数一度跌破3800点大关，双创指数则创出阶段新低。与此同时，防御类板块表现相对抢眼，中证红利指数(000922)节后连续上涨两日，年内累计涨跌幅已回正，跑赢上证指数、深证成指等同期表现。 有观点认为，在风险偏好下降的大背景下，资金或将加速向防御类资产转移，尤其是具备长期高股息、高盈利能力的稳健增长股，有望获得市场青睐。 连续高股息+高ROE的稳健增长股 证券时报·数据宝筛选出连年高股息、高ROE且未来有望稳健成长的个股，条件包括以下： 2. 2023年至2025年扣非加权净资产收益率均超10%； 3.以2023年至2025年年底收盘价和当年每股分红计算当年股息率，连续3年股息率均超3%； 4.机构一致预测2026年、2027年、2028年净利同比正增长； 5.上调今年业绩预期的机构数不少于下调机构数。 综合上述筛选条件后，合计有23股入选。部分超级大白马在列，比如银行板块的农业银行、建设银行、招商银行等万亿元市值个股，煤炭板块的中国神华市值也超万亿元，陕西煤业市值超2600亿元，长江电力市值超7000亿元等。另外还有多只市值不足百亿元的“小而美”股票，其中水星家纺市值不足50亿元，物产环能、行动教育、新澳股份等个股市值不足80亿元。 稳健的成长能力是保证未来高分红的先决条件，部分公司近期也获得了众多机构上调2026年业绩预期。其中，宝丰能源和行动教育均有20多家机构上调业绩预期，同期只有1家机构下调业绩预期。 光大证券表示，考虑到2026年四季度至2027年一季度煤油价格有望同步走强，宝丰能源将适度受益，该机构本期预测2026年—2028年归母净利润较上次报告分别上调6.6%、上调6.4%、基本持平。公司是国内煤制烯烃龙头企业，持续聚焦产业协同和降本增效，未来成长空间广阔。 国盛证券表示，行动教育持续推进AI组织/智能体赋能，核心课程交付稳步推进，课程报到率持续维持高位，推动业务结构优化，市场份额有序增长。随着AI应用不断加速，公司运营效率将持续改善，推动盈利能力进一步提升。 上榜公司股价表现亮眼，年内平均涨幅达8.86%，远超各大主要指数同期表现。其中，14只个股实现上涨，占比超60%；跑赢上证指数的个股达16只，占比近70%，意味着榜单个股年内胜率已逼近七成的高位。 具体到个股来看，潍柴动力和青岛银行年内股价均大涨超40%，行动教育和陕西煤业均涨超30%，中国神华、宝丰能源、建设银行等个股均涨超20%。涨幅居前的个股中，新澳股份市值较低。国泰海通证券表示，新澳股份下半年产能稳步爬坡，2027年有望维持双位数增长。 上榜个股多数获得耐心资本长线配置，诸如农业银行、建设银行、招商银行、中国神华等超级大白马自不必多言，一些市值较小的个股也获得了机构的长期青睐。比如市值不足百亿元的行动教育，社保险资连续多年进入前十大流通股东榜；苏美达则在2023年半年报前十大流通股东榜中出现了社保基金的身影，并持续至今。 从今年二季度持仓动态来看，部分个股也获得了社保险资的大手笔加持。比如建设银行二季度获得中国人寿保险股份有限公司—传统—普通保险产品新进前十大，期末持股市值超52亿元；中国神华获得中国人寿保险股份有限公司—传统—普通保险产品增持超7256万股；陕西煤业、宝丰能源等个股也获得中国人寿保险股份有限公司—传统—普通保险产品的新进重仓。",

    "title": "“老鼠仓”被抓！“90后”遭双重处罚！",
    "link": "https://www.stcn.com/article/detail/4211469.html",
    "pubDate": "2026-10-11T22:08:19+08:00",
    "description": "又见金融从业人员栽在“老鼠仓”上。 近日，中国期货业协会官网披露《关于对牛家骥作出纪律处分的决定》（中期协字〔2026〕206号）。因利用未公开信息从事相关证券交易，协会决定撤销牛家骥期货从业资格，并在3年内拒绝受理其期货从业资格申请。 去年5月，牛家骥已被辽宁证监局处以“没收违法所得75.14万元、罚款75.14万元”的行政处罚。行政惩戒与行业自律接连落地，这名“90后”期货从业人员为自己的越线行为付出了“双重代价”。 中国期货业协会在相关公告中称，牛家骥在期货公司任职期间利用未公开信息进行证券交易的行为，违反了《期货从业人员执业行为准则》（2008年修订）第四条，《期货经营机构及其工作人员廉洁从业实施细则》（2023年修订版）第十六条的规定。 依据《中国期货业协会纪律处分程序》第三十二条和《中国期货业协会失信及违规处理办法》第二十四条，协会决定给予牛家骥“撤销期货从业资格并在3年内拒绝受理其期货从业资格申请”的纪律处分。 这意味着，至少在3年内，牛家骥无法以期货从业人员身份重返行业。 按照要求，受到协会纪律处分的从业人员应当自收到决定书之日起60日内，登录中国期货业协会知识服务平台，完成个人惩戒专项培训全部课程学习。如对处分决定不服，可在收到决定书之日起15个工作日内，向协会第六届理事会法律与申诉专业委员会提出书面申诉。 趋同交易近4000万元，两个账户轮番操作 根据去年5月辽宁证监局发布的行政处罚决定书，牛家骥1994年6月出生，2022年6月至2024年7月，他担任某期货公司投资经理助理，负责协助投资经理开展32只资产管理产品的投资管理工作，因职务便利知悉上述产品的未公开信息。 利用这些信息，牛家骥先后通过两个证券账户进行趋同交易。 2022年6月至2023年8月，牛家骥联络史某并告知其买卖股票的名称、价格、数量等，由史某操作其证券账户进行交易。交易决策由牛家骥作出，交易资金来源于他本人，收益也归其所有。其间，史某账户与前述32只产品趋同买入股票63只，趋同买入金额1875.1万元，趋同交易盈利合计28.5万元。 2023年8月至2024年7月，牛家骥又使用登记在何某名下的手机号码，操作2015年5月14日开立于信达证券盘锦兴隆台街营业部的何某账户进行交易。其间，该账户与32只产品趋同买入股票12只，趋同买入金额2045.73万元，趋同交易盈利合计46.64万元。 综合来看，牛家骥使用“史某”“何某”两个证券账户，累计趋同买入股票75只，趋同买入金额3920.83万元，累计趋同交易盈利75.14万元。 主动配合调查，仍被罚没150.28万元 值得注意的是，牛家骥的认错态度较好。辽宁证监局在行政处罚决定书中指出，牛家骥积极配合调查工作，如实陈述违法行为，并主动提供相关证据，对违法事实无异议，并签署了《认错认罚具结书》。 依据《证券法》第五十四条第一款，金融机构从业人员利用未公开信息进行交易被明确禁止；第一百九十一条第二款规定，违反前述规定利用未公开信息进行交易的，依照内幕交易的规定处罚——没收违法所得，并处以违法所得一倍以上十倍以下的罚款。 基于当事人违法行为的事实、性质、情节与社会危害程度，并结合其主动配合调查等情节，辽宁证监局依据《证券法》第一百九十一条第二款、《行政处罚法》第三十二条第五项，对牛家骥利用未公开信息从事相关证券交易的行为，作出没收违法所得75.14万元、并处罚款75.14万元的决定，合计罚没150.28万元。 从查处链条看，这是一起典型的“行政+自律”联合惩戒案例：证监局负责行政查处，行业协会跟进自律处分，形成监管闭环。 近年来，监管部门对金融机构从业人员利用未公开信息交易行为持续保持高压态势，“老鼠仓”案件屡被曝光。对于身处行业一线的从业人员而言，这起案件也是一次提醒：职务便利带来的信息优势，绝不能成为牟利工具。合规，是金融机构从业者最基本的职业底线。",

    "title": "中国农业地理｜大闸蟹价格回落，它爬出“包邮区”正去往云贵川​​​​​​​​​​​​​​",
    "link": "https://www.yicai.com/news/103388798.html",
    "pubDate": "2026-10-11T22:08:14+08:00",
    "description": "第一财经 2026-10-11 11:59:41 听新闻 作者：冯小芯 ▪ 乐琰 责编：彭海斌 大街小巷随处可见与大闸蟹相关的主题广告、购物场所举办品蟹美食节、蟹卡销售企业自主开办餐厅和酒店来揽客……这是第一财经记者日前在苏州阳澄湖地区所看到的情景。 随着9月中下旬江苏兴化、阳澄湖等核心产区的大闸蟹陆续上市，一年一度的大闸蟹消费旺季拉开帷幕。第一财经记者近期通过实地调研了解到，大闸蟹经济所拉动的消费已不仅是农产品销售本身，还带动了旅游、住宿、零售、智能分拣、区块链溯源等多个产业领域的消费与发展。 值得注意的是，随着市场价格的波动，大闸蟹开始走出“包邮区”，去往更多的新兴消费市场。 大闸蟹所拉动的各类消费覆盖面越来越广，从大闸蟹销售、蟹卡、文旅微度假到衍生商品等层出不穷。熟醉蟹、蟹黄酱、秃黄油等产品打破季节限制，把“节日食物”变成“日常食品”，AI挑蟹师、智能分拣、区块链溯源等在全产业链铺开，大闸蟹消费周期也从“中秋国庆专属”拉长到11月～12月。 第一财经记者日前在苏州阳澄湖地区看到，不少餐厅、景区甚至是奥特莱斯等都打出了品蟹之旅的旗号来吸引客人，比如苏州比斯特购物村近期推出了“阳澄湖大闸蟹美食集市”、部分餐厅将品蟹宴与园林景区结合售卖。而以售卖大闸蟹卡为主业的蟹状元则在阳澄湖当地设置了线下餐厅和酒店，客人可以在线提货，也可以赴当地餐厅品蟹，并直接住宿在该品牌所打造的酒店内，以此拉动一系列消费。 大闸蟹之旅提升了苏州当地近期旅游与住宿业消费。同程旅行数据显示，位于江苏省苏州市相城区阳澄湖中心的莲花岛景区近一周搜索热度环比上个月上涨60%。途牛截至目前最新预订数据显示，自9月28日首批阳澄湖大闸蟹上市以来，用户预订的苏州目的地出游人次较去年同期增长超10%。 据央视财经报道，大闸蟹所带来的深加工、冷链物流、线上销售、品蟹文旅，把45亿元的一个养殖产业，拉长到350亿元全产业链规模，创造大量本地岗位。2025年，阳澄湖大闸蟹直接产值约45亿元，全产业链规模达350亿元以上。据测算，阳澄湖大闸蟹品牌价值达282.65亿元。 值得注意的是，今年的大闸蟹价格有所波动。近期，第一财经记者走访上海江杨农产品批发市场大闸蟹专区，多家批发商家表示，今年大闸蟹生长态势良好，相较往年产量有所提升，总体品质稳定，目前货源以江苏兴化产区为主，上市初期批发价格较去年有所回落，以3两母蟹为例，今年批发价约90元/斤，去年约110元/斤，同比下滑约20%，总体来看，‌中小规格蟹价明显回落，大规格精品蟹价格依然坚挺‌。据了解，今年新增产能主要集中在中小规格蟹，供给扎堆直接拉低了批发底价，相对而言，大规格精品蟹养殖难度高、生长周期长，产量依然稀缺，因此价格保持稳定。 部分大闸蟹价格的波动也让更多业内人士看到，大闸蟹应该销往更多区域，以此来增加销量。江苏阳澄湖大闸蟹股份有限公司董事长程可军对媒体表示，近期市场的销售量预估每天在1万箱左右，会有8万到10万只大闸蟹销往全国各地。 在四川达州这座川东北人口大市，当第一财经记者国庆期间行走在当地街头时，常常可以看到大闸蟹的广告牌，呼啸而过的公交车车身上也总张贴着“吃大闸蟹、就选XXX”的广告标语。第一财经记者近期在达州一家大闸蟹门店内看到，店员正在为顾客打包4只大闸蟹，店内堆放着两层水箱，每个水箱内装有数十只不同规格的大闸蟹，价格从20多元/只到100多元/只不等。 店员对记者透露，店内销售的大闸蟹都是从江苏空运过来，因此价格也比江苏本地高一些，主力产品的售价约40元/只。平常门店内的大闸蟹两天左右就能销售一空，整体销售情况还可以。 第一财经记者了解到，以吃辣为主的四川家庭，以前少有吃清蒸大闸蟹的习惯，但随着美食推文种草、电商直播等营销模式兴起，当地商超陆续销售大闸蟹，一到秋季购买大闸蟹的消费者也逐渐增多。 “起初是因为关注的一位美食博主推荐了熟醉蟹，就在网上下单尝鲜，后来逐渐喜欢上了吃清蒸大闸蟹，而且现在购买很便捷，不管是本地超市还是在网上都能很快买到大闸蟹。”一位达州的青年女性消费者对第一财经记者说。 “以往苏沪浙是阳澄湖大闸蟹的消费重镇，但近年来云贵川的消费增速明显加快，市场份额进一步上升。”一位苏州阳澄湖的大闸蟹养殖户也对第一财经记者表示。 大闸蟹又称中华绒螯蟹，主产区集中在江苏，辽宁盘锦也有规模化养殖，核心产区包括江苏苏州阳澄湖、江苏兴化等。记者从第三方电商数据平台蝉妈妈查询到，过去一年，购买大闸蟹的消费者主要集中在上海、北京、苏州、杭州等东部城市，但重庆、郑州这样的内陆城市也进入了前十行列。 苏州阳澄湖的大闸蟹养殖户王建光在当地约有200亩养殖水域，他告诉第一财经记者，尽管苏沪浙仍然占据了阳澄湖大闸蟹绝大部分的消费市场份额，但云贵川等内陆城市日渐成为市场重视的消费地区。以他家养殖的大闸蟹为例，销往内陆城市的比重逐渐上升，已经能够占到总体销量的5%左右。 王建光对第一财经记者表示，他从多家大闸蟹养殖户那里了解到，以西南、西北为代表的内陆市场份额明显上升已是养殖销售端较为普遍的现象。 大闸蟹能够远销全国各地，以冷链、空运为主的物流体系是重要支撑。王建光介绍，例如阳澄湖大闸蟹36小时左右可抵达贵州，如果是贵州省内有机场的城市，基本24小时就能送达。以往难以覆盖的新疆等地，如今也实现供货。 上述达州大闸蟹门店店员也对记者说，达州本地有机场，从江苏发货一晚便可抵达，这是当地能够稳定供应大闸蟹的关键原因。 那么一只阳澄湖大闸蟹从产地出发到送达全国消费者手中，会经历怎样的旅程？ 王建光对第一财经记者透露，大闸蟹出水后会先在船上初步筛选，剔除带有明显瑕疵的蟹只，再转运至仓库精细分拣，剔除不符合质量要求的蟹只，随后进入吐水环节，排出体内杂质和肠道残留物，经过一段时间的吐水后进入捆扎阶段，同时进一步筛选。在发货前，大闸蟹还会在5℃～8℃左右的保鲜箱中静置一段时间，排干水分后再进行包装。 王建光表示，排干水分既能够保持阳澄湖大闸蟹青背的品相，更能防止大闸蟹在密闭运输空间中窒息，保障大闸蟹的鲜活度。 除了远途运输前的一套标准化处理流程，产区灵活的物流体系也为大闸蟹远行提供了有力支撑。据王建光介绍，顺丰在阳澄湖当地每日设置5个运输班次，从上午9点半持续至晚间8点半，大闸蟹生产企业完成包装后，可第一时间依托冷链发往全国，整体配送时效较快。 在近期举行的阳澄湖大闸蟹开捕推介活动上，顺丰集团副总裁谭靖华介绍，顺丰依托杭州、鄂州两大航空枢纽作为双核心引擎，投入30余架货机，将大闸蟹旺季专项运营能力覆盖至2300余公里，承接大批量、高密度跨区域运输需求，实现全国270余座城市最快次日达。 据记者了解，不仅仅是顺丰，中国邮政、京东等物流企业也在加大大闸蟹的全国推广力度。中国邮政苏州分公司（下称“苏州邮政”）依托直播平台销售阳澄湖大闸蟹，同时凭借自身物流体系保障大闸蟹在途运输。 永辉超市方面表示，从9月28日大闸蟹开捕到全国门店上架，最快只需要一天。一位苏州邮政的工作人员告诉记者，除特别偏远地区外，销往全国的大闸蟹基本可在48小时内送达，还支持按照选定时间送上家门，解决老年群体自提不便的问题。 第一财经记者走访市场发现，在上市初期，同样规格的大闸蟹售价从二三十元到上百元不等，价格差异较大。业内人士表示，这与大闸蟹的不同产区、养殖方式、品牌都有关系。对于一些不太了解大闸蟹的消费者来说，很难直观辨别大闸蟹是否物有所值。 “一只大闸蟹卖四五十元，商家说是来自江苏，但实际会不会是其他地方的，或者存在以次充好的情况？”有四川的消费者向记者提出了这样的疑问。而一些江苏的大闸蟹商家则对记者表示，他们通常是靠长期经营积累起来的口碑留住客源。 在产地方面，核心产区阳澄湖水草丰茂，养殖历史悠久，大闸蟹风味突出，市场定价中高端。 苏州阳澄湖大闸蟹行业协会日前发布的数据显示，根据近期抽样测定，全年阳澄湖大闸蟹总产量预计约1.01万吨，其中围网养殖区域面积1.53万亩，产量1600吨左右；沿湖周边高标准池塘面积6.54万亩，产量8500吨左右，整体生产态势较为平稳，成色稳中有进。 产地端正在持续发力，破解大闸蟹产区真伪难题。 业内人士认为，随着内陆消费习惯持续养成与供应链体系不断完善，大闸蟹的跨区域消费热度还将持续提升。大闸蟹产业正告别小众特产标签，成为全国流通的时令消费品，而标准化、可溯源、价格透明的市场体系，仍待进一步搭建。 “六张网”对扩大内需的长期意义在于，通过投资形成供给、供给释放消费、消费牵引投资，将基础设施投资嵌入更具持续性的内需循环。 应增加优质商品和服务的供给，满足消费者“品质升级”的需要。 尽管 Babycare、好奇、碧芭宝贝三家涉事品牌相继公布未检出甲酰胺的检测结果，但该风波已使得相关纸尿裤市场销售受到明显影响。 激活银发消费活力，更要正视当下的现实约束与结构性短板。 “雪崩之下，没有一片雪花是无辜的。”在负面事件发生后，有网友这样评论道。面对滞销局面，多名福建当地果商对记者表示，目前经营持续亏损，市场信心的重建还需时日。",

    "title": "Kalshi taps former FBI agent to fight against money laundering",
    "link": "https://www.npr.org/2026/10/09/nx-s1-5996683/kalshi-fbi-sean-fern-money-laundering",
    "pubDate": "Fri, 09 Oct 2026 18:23:11 -0400",
    "description": "Sean Fern, a former FBI agent, is joining the prediction market platform Kalshi to lead the company's efforts in fighting money laundering. Provided by Kalshi hide caption Kalshi, a leading prediction market company, has hired a former FBI agent to run its first anti-money laundering team as prediction markets come under increasing legal scrutiny by state and federal regulators. Sean Fern will work closely with law enforcement, regulators and senior staff at Kalshi to keep an eye on suspicious and potentially criminal activity there. The platform has exploded in growth in the past year. According to the firm TickerTracker, Kalshi has crossed $260 billion in bets so far this year, already triple the amount traded in all of 2025. In an interview with NPR, Fern, who worked as a federal prosecutor in Brooklyn after his time at the FBI, said his aim is to build defenses against people trying to use the platform to commit financial crimes. \"I want to make sure it's a hard place to launder money or evade sanctions and commit fraud,\" Fern told NPR on Friday. \"On a day-to-day basis, that involves knowing who our customers are, knowing where their money comes from, and making sure we aren't doing business with sanctioned entities or parties,\" he said. \"And when something looks off or looks suspicious, we can catch it and make referrals to law enforcement.\" The announcement echoes what cryptocurrency companies did during that sector's boom times in the early 2020s. The cryptocurrency exchange Binance, for instance, hired former federal prosecutors and FBI agents to beef up its compliance and anti-money laundering divisions. Several years later, Binance's founder Changpeng Zhao pleaded guilty to money laundering charges. Avoiding its own money laundering scandal, Fern said, is the reason Kalshi tapped him. At the FBI, Fern was a special agent in the bureau's international corruption squad, where he helped lead the investigation into the multibillion-dollar bribery scheme tied to Malaysia's sovereign wealth fund, a scandal that became known as 1MDB. Kalshi hopes adding Fern will lend credibility to the surging platform as it faces mounting scrutiny over insider trading and market manipulation. Prediction market bettors can place wagers on everything from sports to what politicians say at public events to the outcome of elections. Experts have warned that introducing betting into domains like voting and policy decisions encourages people to monetize insider information. Federal regulators and law enforcement in Washington have launched criminal investigations into alleged abuse on prediction market platforms. Earlier this year, regulators settled with former U.S. Rep. George Santos over market manipulation. Federal prosecutors have also indicted a former U.S. Army soldier and a former Google employee for allegedly using non-public information to cash out on Polymarket, Kalshi's main rival. In August, President Trump's former teleprompter operator was fined by regulators for using advance notice of the president's speeches to profit on Kalshi's so-called \"mention markets.\" Elisabeth Diana, a Kalshi spokeswoman, said that as banks, hedge funds and other financial institutions use Kalshi, the need to shore up financial crime safeguards has become apparent. \"We are growing up,\" Diana said. The company, which PitchBook estimates to be worth around $40 billion, has 250 employees, and it plans to double its headcount over the next six months. During his time in federal law enforcement, Fern was one of the lead prosecutors in the trial of OneTaste, an \"orgasmic meditation\" wellness company whose founders were sentenced to prison following convictions for forced labor conspiracy. NPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.",

    "description": "Cooper Katz McKim You're reading a newsletter from The Indicator from Planet Money. Once a week, we curate our favorite stories and insights on business, finance, economics and why they matter. Subscribe here to get it in your inbox every Friday. Paul Anka performing back in 2014 John Shearer/Invision for American Friends of Magen David Adom/AP Images hide caption Have you ever wondered what Warren Buffett does in his free time? Turns out he's a YouTube guy, as prone to the rabbit hole as any of us. You might expect the recently retired Berkshire Hathaway CEO to consume nerdy financial content, but no. According to The Wall Street Journal, we learned he's prone to watching Paul Anka videos, clips of Bill Murray films, and my personal favorite … O'zbekiston Got Talent, the Uzbek knock-off of America's Got Talent. But who hasn't gone through that phase? Trivia: What do most countries with a sovereign wealth fund have in common? Email your answer to indicator@npr.org What to Know: American investors are seeing an opportunity in Europe. The continent saw a 14 percent rise in military spending to $864 billion last year, due to pressure from Russia and Trump's own unhappiness with low spending from NATO allies. The hike is prompting a spate of new defense start-ups keeping up with modern warfare. They're building tech like AI-powered battlefield management, drones, and spy satellites. These start-ups are already bidding and winning contracts… so the pay-off is coming fast. In fact, these startups have raised a RECORD amount of capital this year, with help from Americans. Why the U.S. is loving this: Just about half of the funding in Europe's defense tech industry is coming from American investors this year! What's up? A Ukrainian soldier stands ready to defend against a Russian drone attack. Efrem Lukatsky/AP Photo hide caption What to Know: Five coal-fired power plants and one running on oil and gas would no longer be online if not for the Trump administration. The Department of Energy used emergency authority to keep the plants going past their scheduled retirement, something that's never been done in the history of the DOE. It was also against the wishes of some of the plants. Secretary of Energy Chris Wright said it's about giving people access to more reliable power to help address periods of peak demand. What's odd: several of the plants are running at limited capacity or not at all. That said, utilities are still incurring millions of dollars just to maintain a power plant on standby. Wright told Reuters last year that he expects most of the nation's power plants to hold off on retirement in order to help power artificial intelligence aka data centers. Feds have ordered the Craig coal plant in Colorado to stay open another 3 months Rick Bowmer/AP Photo hide caption Why it matters: Electricity costs nationwide are already wildly high as demand increases from AI. Consumers Energy, the company that owns the Michigan J.H. Campbell coal plant, reported to the SEC that the plant has cost them $259 million to continue running since May of last year. The utility has gone to its customers to pay for $138 million of that cost. A recent court decision also found the 'emergency' order was an overstep and threatened the stability of the energy market. Emergency orders are keeping a generating unit at a coal-fired plant in Colorado going as well. The latest happened Sept. 27. The DOE has to keep issuing them within 90 days. Keeping that plant online would cost taxpayers $80 million annually, according to its Governor. That's without it producing basically any power. Our question on the team: What does this mean for other energy developers? Does the regulatory uncertainty affect new investment given the continued 90-day renewals? Update: President Trump looks to lower diesel costs - NPRLast week, we spoke in the newsletter about why diesel costs tend to be higher than regular gas. Diesel prices have hit a record high in the past month, and the Trump administration had considered an export ban to try and lower prices. Well now, the administration has made its move. No export ban! BUT… President Trump issued an executive order to defer the payment of a 24 cent excise tax on diesel for on-highway driving through the end of the year. If you HAVEN'T listened: If you've ever used 'Venmo' as a verb, you likely know the pain of someone not paying you back. You generously offered your credit card to pay for dinner, your co-diner promised to pay you back, you send a Venmo request and *deflating balloon sound*... they don't do it. A day goes by, TWO. Venmo tells us about 40% of people take a week or MORE to settle debts with friends. Transferring money may be easy, but getting that money back? Less so. In the full episode, we hear first-hand accounts from listeners on THEIR Venmo experiences. LISTEN TO THE FULL EPISODE If you HAVE listened: The reporter Ricky Mulvey tells us that we didn't have time to get into all the reasons why someone doesn't get paid back on Venmo. A few remaining: The most salient advice from the episode is that a Venmo is a personal loan. And if you give out a personal loan, the money may not come back to you. Rest of the WeekWhy Norway's sovereign wealth fund is facing its own Ed Sheeran moment Panic! At the data center How increased ICE raids impact hospitals Listener Mia Calle is messaging from Port St. Lucie, Fl. Question: My name is Mia, and I am a high school math teacher in Florida and mother of two young daughters. I keep hearing about how it is becoming increasingly difficult for students to be admitted to colleges in Florida from my colleagues. Can you help me reconcile the decline in college enrollment nationally with the increase in competition to enroll in public universities in Florida? Is the latter because the state has the Bright Futures program which is based on merit and may encourage a wider pool of applicants compared to other states? I grew up in Michigan after the M...",

    "title": "From BJ’s to Lululemon, retailers are trimming assortments to boost business",
    "link": "https://www.cnbc.com/2026/10/10/from-bjs-to-lululemon-retailers-are-trimming-assortments.html",
    "pubDate": "Sat, 10 Oct 2026 12:00:01 GMT",
    "description": "Retailers are trimming assortments in an effort to clean up their balance sheets. As shoppers cut spending in the face of high gas and food prices, businesses have pulled more levers to boost profitability and appease investors. During earnings calls this year, a range of retailers have highlighted efforts to reduce the number of items they sell, commonly tracked as stock keeping units, or SKUs. In March, Dollar General said it trimmed 1,500 SKUs. In August, Under Armour said it shrunk SKUs by 25% over the past few years and plans to cut another 25%, while BJ's Wholesale Club said it plans to reduce roughly 20% of SKUs. In September, Lululemon said it cut North America SKUs by 15%. Trimming inventory can help a business stabilize its sales or even get back to growth, and can reduce the chances a company gets stuck with unwanted inventory. But the move can also leave consumers with less choice — a trade-off many retailers have been willing to make. When a brand struggles to sell certain products, it can lead to discounting, which hurts profitability. Some markdowns are expected when businesses roll the dice on new products that don't end up selling well, but too many promotions can cause problems. \"If you have zero discounting, you're not taking enough fashion risk,\" said Guggenheim Securities senior retail analyst Simeon Siegel. \"But discounting needs to be fixing mistakes. It needs to be done quickly.\" Under Armour and Lululemon are both facing repercussions from what investors see as too many markdowns. Under Armour's operating income, which illustrates its underlying profitability, turned negative in fiscal 2025 and 2026. The company said its problems would not be solved by chasing unhealthy sales volume or short-term revenue. \"Today, we're managing for quality. Fewer products with greater purpose, tighter execution and a clear reason to buy,\" said Under Armour CEO Kevin Plank on the company's fiscal first-quarter earnings call in August. \"We will sell so much more of so many less products at a much higher full retail price.\" Siegel said that when a retailer acknowledges it wants to shrink revenue, the goal is to regain pricing power. Lululemon grew its sales by more than $500 million from fiscal 2024 to 2025. Yet its operating profit fell by about $300 million in the same time span. Shares are down around 65% over the past two years. \"Selling fewer options is not the same as selling fewer things,\" said Siegel. \"Lulu has a long way to go, and simply cutting SKUs, simply saying we need to have better product is not the answer.\" Siegel said too much of even the best product can dilute the value of a brand. Lululemon reported $6.3 billion in U.S. sales in fiscal 2025. Siegel said $3 billion to $4 billion in domestic revenue is where companies typically hit a healthy saturation level. \"It's a level where they can be large and still cool. Above that, they start cheapening what they stand for, literally cheapening the product, but also cheapening the perception,\" said Siegel. He noted that Nike is an exception to this rule, after posting $20 billion in North American sales in fiscal 2026. Still, the apparel and footwear giant, which has seen shares crater around 45% this year, said it is \"rebalancing\" its portfolio, having reduced revenue from classic footwear franchises by more than $2 billion in fiscal 2026, according to its fiscal 2026 fourth-quarter earnings call in June. For small-box stores such as Dollar General and big-box retailers like BJ's, cutting down the assortment doesn't necessarily give them the ability to raise prices. Rather, for those stores carrying thousands of brands, removing certain products can help them better manage inventory and refine their offerings to help stabilize the business. \"When you shrink a box ... and say, I'm going to focus more on curation, you're getting smaller, but you're trying to reestablish why someone's walking into your box in the first place. And so it does get better, but it doesn't necessarily help your bottom line as much,\" said Siegel. BJ's CEO Robert Eddy said reducing choice, such as cutting the number of scents of body wash, pushes sales into the remaining products on shelves and then makes room for more product categories that weren't previously offered. \"That is sourcing sales growth as well and sort of giving us the formula where we can cut SKUs, and see sales go up, and see margin dollars go up,\" Eddy said on the company's fiscal 2026 second-quarter earnings call in August. In June 2025, Dollar General said the elimination of 1,000 SKUs from the previous year opened up more shelf space for its best-selling products and added to its top line. By March 2026, the company said, it had reduced up to 1,500 SKUs, providing benefits to the overall supply chain. \"Being more productive there means getting product to the shelf faster and being there for the consumer with the right amount of items and products that she's looking for as quickly as we possibly can,\" Dollar General CEO Todd Vasos said in the company's fiscal 2026 second-quarter earnings call in August. \"As we go forward, the team is looking at continued SKU rationalization, albeit probably more surgical in nature.\" Successfully slashing products from shelves is difficult in practice. Box stores risk losing customers to competitors that offer the products they scrapped. BJ's, for instance, acknowledged that a previous attempt to cut SKUs was unsuccessful. \"We just cut SKUs which cut sales, and then we added some SKUs back and so really what we're doing now is removing unnecessary choice,\" Eddy said on the company's earnings call in August. \"Think about in traditional soda, we don't carry cans and one-liters and two-liters of the same product anymore.\" Meanwhile, publicly traded brands that acknowledge sales need to decline in order for the business to grow still have answers to investors in the near term. \"It's hard for a company ever to say we need to shrink anything, but it's...",

    "title": "Delta CEO: 'Safety is going to make the call' on launching Saudi Arabia flight",
    "link": "https://www.cnbc.com/2026/10/09/delta-riyadh-flight-safety-houthi-attacks.html",
    "pubDate": "Fri, 09 Oct 2026 11:57:05 GMT",
    "description": "Delta Air Lines CEO Ed Bastian said his carrier is weighing whether to go ahead with debuting a flight between Atlanta and Riyadh, Saudi Arabia, after attacks claimed by Iran-backed Houthi rebels in Yemen have escalated there. The flights between Riyadh and Delta's biggest hub are scheduled to begin on Oct. 23. Three people were killed in attacks at Riyadh's King Khalid International Airport as the Houthis stepped up strikes in the country, Saudi Arabia's civil aviation authority said. \"Obviously, we were disappointed to see the news this week,\" Bastian told CNBC in an interview. \"Safety is is going to make the call.\" He said that the airline will let customers know of its decision soon. German airline Lufthansa said it was pausing flights into Saudi Arabia through at least Oct. 16, a spokesman told CNBC. Delta is planning to operate the Atlanta-Riyadh flight daily from Oct. 23 to Oct. 30 before moving to three-times-a-week service. When it announced the route earlier this year, Delta said it would be the first nonstop service between the U.S. and Riyadh operated by a U.S. airline.",

    "title": "Delta Air Lines cuts 2026 forecast on fuel surge, but CEO says demand is still strong",
    "link": "https://www.cnbc.com/2026/10/09/delta-air-lines-dal-q3-2026-earnings.html",
    "pubDate": "Fri, 09 Oct 2026 15:07:46 GMT",
    "description": "Delta Air Lines slashed its 2026 profit outlook as high fuel prices persist, but CEO Ed Bastian said pricier fares aren't turning off travelers. Delta on Friday forecast full-year earnings per share of between $5.10 and $5.60 on an adjusted basis, compared with its outlook in July, when fuel prices were lower, of $6.50 to $7.50 a share. The company's fourth-quarter guidance was below analyst estimates, too. Delta cut its free cash flow outlook for the year to $2.5 billion, from as much as $4 billion it expected in July. Still, Bastian said in an interview that fares have continued to tick up as the airline passes along much of a $6 billion increase in fuel costs this year, and that travelers keep booking. Jet fuel prices in the U.S. Gulf of Mexico region have almost doubled to $4.34 on Thursday from $2.19 a year earlier, according to FactSet. \"The consumer response continues to be quite strong. We're seeing it across all channels, all cabins of service, all geographies, business, leisure,\" he said. Delta forecast a 20% increase in revenue for the fourth quarter over the same period last year, more than the 16% rise in the third quarter, when adjusting for the airline's benefit from its refinery in Trainer, Pennsylvania, where it processes crude oil into jet fuel and other products, giving it an advantage over other carriers. \"Obviously the fuel pricing, the volatility of fuel prices have something to do with that,\" Bastian said. Delta is the country's most profitable airline and the first to report results from the third quarter, which encompasses the busy summer season. Costs continued to weigh on the bottom line. The fuel price surge since the Iran war began in February has put a damper on airline profits even as carriers flex pricing power. The latest inflation read in September showed airfare up more than 23% from a year earlier. Here's what the company reported for the third quarter compared with what Wall Street was expecting, based on consensus estimates from LSEG: It was the first time in two years that Delta missed estimates. Delta reported net income of $756 million, or $1.15 a share, down 47% from $1.42 billion, or $2.17 per share, a year earlier. Adjusting for one-time items, Delta posted earnings of $1.72 per share. Adjusting for sales from its refinery, maintenance business and profit-sharing, revenue rose 16% from the previous year to $17.59 billion. Operating revenue jumped 21% in the third quarter to $20.19 billion. Delta's premium revenue, which has become a larger portion of its total sales, grew 18% in the third quarter to $6.82 billion, while main cabin sales rose only 12% to $6.8 billion. Delta, which announced free Wi-Fi across its fleet almost four years ago, recently said it would add Amazon Leo satellite internet to its airplanes as carriers race to improve service on board to living-room-quality speeds. SpaceX CEO Elon Musk criticized Bastian on X last week, saying the Delta CEO would \"lose his job over this\" after the \"View from the Wing\" travel blog said Bastian told staff at an internal event \"We do not want to be with Elon Musk. Trust me.\" SpaceX's Starlink Wi-Fi has become the main supplier of satellite internet, with airline partnerships that include United Airlines, American Airlines, Southwest Airlines and Alaska Airlines as well as others around the world. Delta's Bastian brushed off the idea of a personal spat with Musk on Friday and told CNBC's Phil LeBeau in an interview that \"everyone's entitled to their opinion.\" \"There's no tit for tat as far as I'm concerned,\" Bastian said. He said Delta had talks with SpaceX six years ago, but they \"weren't ready to scale.\" Correction: This story has been updated to reflect that Delta reported adjusted earnings per share of $1.76. An earlier version of this story misstated the EPS in one instance.",

    "title": "Why a Starbucks takeover of Chipotle would — and wouldn't — make sense for both companies",
    "link": "https://www.cnbc.com/2026/10/08/starbucks-chipotle-acquisition.html",
    "pubDate": "Thu, 08 Oct 2026 20:12:33 GMT",
    "description": "Starbucks has reportedly explored buying Chipotle Mexican Grill, but investors are split on whether the megadeal would make sense for both companies. The coffee giant has been working with advisers on a takeover proposal of the fast-casual chain in recent months, the Financial Times reported on Thursday, citing people familiar with the matter. If Starbucks bought Chipotle, it would combine two of the largest U.S. restaurant chains. With about $31 billion in annual domestic sales, Starbucks is the second-biggest U.S. chain by sales. Chipotle sits in the number seven spot, with more than $11 billion in annual system-wide sales in its home market. The report sent Chipotle stock up about 6% on Thursday, while shares of Starbucks fell slightly after dropping more sharply earlier in the day. It is not unusual for deal rumors to lower the potential acquirer's value and increase the target's share price, but investor reactions show that a prospective takeover comes with pros and cons for each side of the deal. To be sure, it is unclear if Starbucks will even pursue the takeover. D.A. Davidson analyst Matt Curtis wrote in a note to clients on Thursday that he views the odds of a deal being completed as \"relatively low\" — about 20%. A Starbucks spokesperson told CNBC that the company does not comment on rumors and speculation. Chipotle did not immediately respond to a request for comment from CNBC. Starbucks CEO Brian Niccol knows more than a thing or two about Chipotle. Before joining the coffee company in 2024, he was chief executive of Chipotle for more than six years. He led a turnaround of the burrito chain, helping it bounce back from a series of foodborne illness outbreaks that had turned into a full-blown crisis for the company. In the wake of Niccol's departure, traffic to Chipotle restaurants fell in 2025, as budget-conscious consumers visited its restaurants less often. These days, the chain looks like it is starting to get back on track, with signs of \"encouraging progress,\" Chipotle CEO Scott Boatwright said on the company's earnings conference call in late July. Still, its shaky 2025 means that the stock is trading at a 20% discount from a year ago, even with Thursday's big move. And since Niccol left, shares have lost about 40% of their value. Chipotle would be a splashy acquisition for Niccol. More than that, it could create a new restaurant conglomerate, following in the footsteps of Yum Brands, Restaurant Brands International and Roark Capital-backed Inspire Brands. Multi-brand restaurant companies are more diversified, which can be more attractive to investors. While Starbucks is still a much larger chain than Chipotle, the difference in their categories means that one's poor performance could be offset by growth at the other. Moreover, Starbucks could help Chipotle grow more quickly in international markets; the burrito chain only has about 100 locations outside of the U.S., while Starbucks has about 23,000. Other restaurant companies have set a blueprint for that strategy: Yum has leaned on its international experience from KFC and Pizza Hut to launch Taco Bell outside of the U.S. And Restaurant Brands has leaned on Burger King's international expertise to grow Popeyes' international footprint. With any strategic acquisition, investors hope for synergies that justify the price tag and explain why the deal makes sense. A coffee shop and a burrito restaurant do not have much overlap in ingredients, but there are other potential benefits for both companies and their investors. Combining Starbucks and Chipotle would open up potential cost cuts, like layoffs for some now-redundant corporate roles. The two chains also have significant overlap in their U.S. real estate footprints. Roughly 90% of Chipotle restaurants are within one mile of a Starbucks cafe, according to a research note from Stephens analyst Jim Salera published on Thursday. Both companies could benefit from shared real estate development and even operating efficiencies as a result. But real estate is not the only area where they overlap. Many Starbucks customers also frequent Chipotle restaurants. As one entity, they could leverage that overlap through a combined rewards program, Salera suggested. Unlike many big restaurant players, both Chipotle and Starbucks operate most of their U.S. locations, although Starbucks also has thousands of licensed cafes in its home market. That marks a difference from Chipotle's last strategic owner — McDonald's. The burger giant, which franchises the vast majority of its U.S. restaurants, made a majority investment in the upstart Mexican-inspired chain in 1998. But by 2006, McDonald's divested its ownership. Its restaurant investments, which also included Boston Market, were labeled a distraction by Wall Street as the Golden Arches struggled. Before it sold its stake, McDonald's tried to franchise some of Chipotle's restaurants to its own franchisees. But Chipotle's leadership, including founder Steve Ells, pushed back. It was one sign of the cultural misalignment between the two brands. Chipotle also resisted efforts to make it more similar to McDonald's, declining suggestions like adding drive-thru windows and a breakfast menu. Niccol joined Starbucks more than two years ago to lead a turnaround of the embattled coffee chain. Early signs show that his efforts have improved its U.S. business — but the company is not done yet. Starbucks is aiming to be \"the world's greatest customer service company,\" Niccol wrote in a memo to employees in September, part of a broader push to improve customer loyalty. Starbucks also has other deals that it is reportedly considering. In September, Reuters reported that the company was considering selling a majority stake in its Japan business. The country has been the chain's largest overseas company-operated market since it formed a joint venture to operate its cafes in China less than a year ago. Integrating a new chain into the company would be a big...",

  {
    "title": "Skydance's David Ellison tells CNBC combined company is 'positioned to win in every single vertical'",
    "link": "https://www.cnbc.com/2026/10/08/skydance-co-ceos-ellison-kreiz.html",
    "pubDate": "Thu, 08 Oct 2026 16:25:40 GMT",
    "description": "Skydance co-CEO David Ellison told CNBC on Thursday — days after Paramount's acquisition of Warner Bros. Discovery officially closed — that the combined company is \"positioned to win in every single vertical that we operate in.\" Skydance includes film studios Paramount and Warner Bros.; the CBS broadcast network; a sprawling pay TV portfolio that includes CNN, TNT, MTV and BET; and streaming services Paramount+ and HBO Max. \"By combining Paramount and Warner Bros, we have the greatest content engine,\" Ellison said, noting blockbuster intellectual property and a strong sports portfolio. \"You're immediately getting to scale in streaming between HBO Max and Paramount+, over 200 million global streaming subscribers. ... Not to mention the Olympics internationally and an incredibly profitable linear portfolio, anchored by CBS.\" Ellison and co-CEO Ynon Kreiz plan to split executive duties, with Ellison focusing on the company's creative vision, technological innovations and long-term strategy while Kreiz leads the integration of the two companies and handles day-to-day management and operations. \"We have a unique opportunity to build the next generation media and entertainment global company that is powered by creativity and technology,\" Kreiz said. \"We have the assets that David mentioned. We have the capability. We have the people. And all of this is happening at the point in time when the industry is at an inflection point, where it's getting harder and harder to reach the consumer and aggregate fans.\" Kreiz is a 30-year veteran of the media space with a reputation as a turnaround man. Ellison, who is also Skydance chairman, has spent more than 15 years as an on-set producer and has said he's looking to position Skydance as a creative hub for filmmakers. The executives will have a tall task at the helm of a media behemoth: As part of a settlement with a group of state attorneys general who sued to block the acquisition over antitrust concerns, Skydance has agreed to release at least 30 films into theaters annually in 2027 and 2028 and at least 32 films annually in 2029, 2030 and 2031. Currently, the combined entity has 35 films scheduled for release next year, according to data from Rentrak. Ellison has also said he plans to merge the Paramount+ and HBO Max streaming services. Skydance must manage roughly $80 billion in debt as a result of the merger and has previously said it's targeting $6 billion in cost savings over the next three years. \"There are absolutely operational efficiencies,\" Ellison said. \"We've looked at this deal for over a year. We know where every single dollar is.\" Kreiz said Thursday those savings \"will come from technology, marketing consolidation, real estate optimization, and some labor.\" The acquisition has spurred fears of layoffs from both inside the company and from industry onlookers. Ellison said Skydance has already unified ad sales across the platforms and is working to unify back-end tech stacks. \"This is not about a few days of share trading, or even managing synergies for three years. We're building a company for future generations,\" Kreiz said. \"But reducing the workforce is a part of that. We said that, we were public about it. But when it comes to making those decisions, of course, we're thinking of our people. We're going to do it in the right way, respectfully, transparently, and communicate our plans.\" The acquisition also brings together two high-profile news networks, CBS and CNN, under one roof. CNN has long faced criticism from President Donald Trump and has faced heightened scrutiny from his administration in recent weeks, as the network was barred from certain access to the president as part of the White House television press pool. David Ellison's father, Oracle co-founder Larry Ellison, is a longtime Trump ally, and fears of improper political influence over newsgathering operations have surrounded Skydance's pursuit of the CNN parent. Skydance's settlement with the state AGs included an agreement that the company would establish a new board to oversee CBS and CNN to ensure editorial independence. Skydance announced on Monday that Mark Thompson will remain in his current role as chairman and editor-in-chief of CNN Worldwide and that Bari Weiss would continue to serve as editor-in-chief of CBS News. Kreiz said Thursday the newsrooms would continue to run independently. \"We'll look to keep the businesses run in parallel with independent editorial operation,\" Kreiz said. \"We're so fortunate to have such successful, well-established, highly recognized brands in news.\" Ellison, meanwhile, said questions about the future of the news divisions were better left to Thompson and Weiss: \"Corporate stays out of editorial.\"",
    "image": "https://image.cnbcfm.com/api/v1/image/108376688-1791465947724-david2.jpg?v=1791465955&w=1920&h=1080",
    "sourceId": "cnbc",
    "sourceName": "CNBC",
    "sourceFull": "CNBC 财经",
