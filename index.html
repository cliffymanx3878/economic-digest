  },
  {
    "title": "PepsiCo cuts earnings forecast as North American turnaround takes longer than expected",
    "link": "https://www.cnbc.com/2026/10/08/pepsico-pep-q3-2026-earnings.html",
    "pubDate": "Thu, 08 Oct 2026 14:43:05 GMT",
    "description": "PepsiCo on Thursday reported quarterly earnings and revenue that topped analysts' expectations, fueled by international growth as its North American business continues to lag. With one quarter left in 2026, the company also lowered its forecast for its full-year earnings, as its struggles in its home market weigh on profits. Pepsi expects core earnings per share to increase 2.5% to 3.5%, down from its previous projection of the low end of a range from 5% to 7%. It also now expects net revenue growth of about 6%, on the high end of its prior outlook of a range of 4% to 6%. Shares of Pepsi rose about 2% in morning trading. Here's what the company reported compared with what Wall Street was expecting, based on a survey of analysts by LSEG: Pepsi reported fiscal third-quarter net income attributable to the company of $3.05 billion, or $2.23 per share, up from $2.6 billion, or $1.90 per share, a year earlier. Excluding items, the company earned $2.34 per share. Net sales rose 5.6% to $25.27 billion. Organic revenue, which excludes acquisitions, divestitures and foreign exchange, increased 3.1% during the quarter. The company reported volume growth of 3% for its beverages and 1% for its food for the quarter. Volume excludes pricing and currency fluctuations to reflect demand more accurately. Pepsi's international markets were once again the bright spot. The company's international business has accounted for 41% of its net revenue so far this year, CEO Ramon Laguarta said in prepared remarks. Pepsi saw volume growth in all but one of its international business units during the quarter. Only its convenient foods division in Europe, the Middle East and Africa reported declining volume, of 1%. But in its home market, Pepsi once again struggled. \"Our business in North America performed below our expectations and represents a meaningful opportunity for improvement,\" Laguarta said. Its North American beverage unit saw volume shrink 2%, while its North American food division reported flat volume. The turnaround of its domestic business is moving more slowly than expected, CFO Steve Schmitt said in prepared remarks. So far, the strategy to fix the struggling divisions has focused on innovation and the company's advertising and marketing. For its snacks, Pepsi has leaned into simpler ingredients, \"alternative\" oils and functional benefits, like protein and fiber. In February, Pepsi lowered prices by as much as 15% on many of its snacks, including Lay's and Doritos. The move followed weak U.S. performance by its snack brands as budget-conscious shoppers, facing higher prices across the grocery store, skipped the chips. The bet has paid off for the company, Laguarta said on the company's earnings conference call. \"We're happy with the turnaround in the volume performance,\" he said. \"If you think about last year, that business was low single-digit negative volume growth. This year, we're low single-digit positive growth.\" North American demand for Pepsi's snacks was weaker than expected this quarter, which Laguarta chalked up to \"the consumer environment.\" Pepsi executives are projecting \"a new wave of inflation\" caused by higher energy prices. Laguarta predicted that the company will implement \"revenue management tactics,\" industry jargon that typically means price hikes. But he said that the company will have \"guardrails\" to make sure that retailers do not price its snacks too high for shoppers. The North American beverage business was more disappointing, particularly the company's soft drinks portfolio, which includes its namesake soda, Mountain Dew and Poppi, among others. The company plans to stay focused on functional hydration, flavored soft drinks, energy drinks and zero-sugar options. However, Laguarta said some recent trends show the company's efforts are working. Pepsi's North American convenient foods business, which includes brands like Doritos and Quaker Oats, had its organic revenue improve sequentially. Its North American beverage unit, which includes its namesake soda and Gatorade, among other brands, saw organic volume trends pick up, thanks to its functional hydration and zero-sugar drinks. But Pepsi's carbonated soft drink portfolio lagged behind the overall category, including rival Coca-Cola. Pepsi is planning cost reductions to cut down on redundancies and discretionary spending to pay for investments in innovation and marketing, Laguarta said in prepared remarks. Correction: Pepsi's fiscal third-quarter net income attributable to the company was up from a year earlier. An earlier version misstated the direction.",

    "title": "Lululemon poaches Athleta CEO as new chief product officer",
    "link": "https://www.cnbc.com/2026/10/07/lululemon-athleta-ceo-maggie-gauger-chief-product-officer.html",
    "pubDate": "Wed, 07 Oct 2026 21:47:06 GMT",
    "description": "Lululemon announced Wednesday that Athleta CEO Maggie Gauger is joining the company as president and chief product officer, effective later this month. The move marks the latest shake-up among the top executives in the increasingly competitive athleisure space: Gauger joined Athleta from Nike only last year. Lululemon said Gauger's job is a newly created role. It also appointed Joseph Godsey as chief operating officer. Alongside the new announcements, Lululemon also said Nikki Neuburger, the company's chief brand and product activation officer, and Ted Dagnese, its chief supply chain officer, are leaving in November to \"pursue other opportunities.\" \"We are establishing a deeply experienced leadership team that will work in a more coordinated manner, aligned around the strategy and execution that delivers the most impact for our guests, our communities, and our business,\" Lululemon CEO Heidi O'Neill said in a statement. \"That starts with putting product, design, and innovation at the center of how we operate, with the focus and accountability to create a stronger pipeline of differentiated product to raise the bar for our guests across every touchpoint, in stores and online.\" In a statement provided to CNBC, Athleta parent company Gap confirmed Gauger has left the company. It said Erika Everett, the brand's current chief marketing officer, will oversee the brand CEO role in the interim. \"We have been actively shaping Athleta's next chapter and the changes needed to position the brand for long-term growth,\" Gap said in its statement. \"This transition enables us to accelerate that work, strengthen our connection with customers, and unlock Athleta's full potential.\" Separately, Lululemon said it is also searching for a chief brand officer, a chief communications officer and a chief technology officer. O'Neill took the helm of Lululemon last month after the athleisure company saw more than a year of disappointing sales performance in the midst of a proxy battle, drawing criticism from founder Chip Wilson.",

    "title": "Levi Strauss hikes profit guidance after tariff refunds, but its sales outlook is less optimistic",
    "link": "https://www.cnbc.com/2026/10/07/levi-strauss-levi-q3-2026-earnings.html",
    "pubDate": "Thu, 08 Oct 2026 14:43:38 GMT",
    "description": "Levi Strauss on Wednesday increased its profit outlook, largely due to tariff refunds, but gave less rosy revenue guidance after a lackluster quarter of sales. The denim retailer raised its adjusted earnings per share expectation for the full fiscal year to between $1.54 and $1.56, from a previous range of $1.46 to $1.52. Analysts were expecting a range of between $1.52 and $1.59, according to LSEG. The company also lowered its net revenue growth guidance for the full year to 7%, the bottom of its previously provided range of a 7% to 7.5% increase. However, Levi said it expects organic revenue — which strips out foreign exchange changes — to rise 6% for the year, the high end of its previous range. Shares of Levi fell nearly 4% on Thursday. For its fiscal third quarter, the denim retailer said it saw a 4% increase in net revenues in the Americas, though revenue in the U.S. decreased 1%. It also reported an operating margin of 13.8% for the quarter, compared to 10.8% in the same quarter last year, boosted by tariff refunds that contributed 4.9% to operating margin and gross margin. Levi also said its tariff refunds contributed a 16-cent benefit to its earnings per share, of which 5 cents were \"redeployed to support the business.\" On a call with analysts, CEO Michelle Gass said that money is going toward marketing and promotions during the holiday season. Here's how Levi performed in its third quarter compared with what Wall Street was expecting, based on a survey of analysts by LSEG: For the three-month period ending Aug. 30, Levi reported net income of $168.6 million, or 43 cents per share, down from $218.1 million, or 55 cents per share, the year prior. Sales rose roughly 4% to $1.61 billion from $1.54 billion last year. Levi said direct-to-consumer net revenues increased 2% in the quarter, but comparable sales were roughly flat. DTC comprised 45% of total net revenue in the third quarter, the company said. On the other hand, wholesale revenues increased 6% for the quarter. \"While we delivered strong results across much of the business, our DTC performance fell short of our expectations during the quarter,\" Gass said on the call with analysts. \"We have a clear understanding of what worked and what did not, and we have already taken targeted actions to improve performance.\" The company previously said it's been seeing broad-based growth across its business segments, including its core Levi's and its premium blue tab. Last month, the company announced John Vandemore will take over as chief financial officer effective Nov. 1, succeeding Harmit Singh, who announced his retirement in April.",
    "image": "https://image.cnbcfm.com/api/v1/image/108370148-1790771590456-gettyimages-2290036369-golba-dailylif260807_npnf2.jpeg?v=1791404003&w=1920&h=1080",

    "title": "Modelo owner Constellation is getting creative to bring back beer drinkers as overall demand weakens",
    "link": "https://www.cnbc.com/2026/10/07/constellation-brands-earnings-beer-demand.html",
    "pubDate": "Wed, 07 Oct 2026 19:14:03 GMT",
    "description": "Constellation Brands beat quarterly earnings and revenue expectations as its beer brands gained market share, but continued consumer caution tempered results. As it navigates high food and fuel prices and choosy shoppers, Constellation is turning to special occasions and diversification to help drive sales. The maker of Modelo Especial, Corona and Pacifico on Tuesday reported fiscal second-quarter adjusted earnings of $3.74 per share on $2.63 billion in revenue, ahead of Wall Street estimates of $3.56 and $2.54 billion, respectively. Beer revenue rose 5% to roughly $2.47 billion, while beer shipments increased 5.5%. However, the company said beer depletions, a measure of sales from distributors to retailers and other customers, declined slightly during the quarter, indicating consumer demand was softer than shipment growth suggests. \"We have spent much of the first half rebuilding distributor inventory levels,\" said Constellation Brands CEO Nicholas Fink on the company's earnings call on Wednesday. \"While there is always going to be month-to-month variability, September depletions are trending in the right direction.\" The broader backdrop remains challenging for beer sellers. U.S. beer sales fell 1.8% year over year in the two weeks ended Sept. 19, according to Nielsen's latest data. Still, Fink said September beer depletions improved even beyond the benefit of a later Labor Day, and that the recovery was broad-based across channels. He said consumers were \"across the board\" engaging in the category. Some analysts said the results indicated elevated gas prices have dampened Constellation's performance. “Progress [for Constellation] had accelerated to start 2026, but has been derailed by higher fuel costs,” Roth Capital analyst Bill Kirk wrote, though he said Constellation continues to deliver against its fiscal 2027 plan. Kirk has a buy rating and $209 price target on the stock, compared with the roughly $116 a share price as of Wednesday. Fink said Constellation saw particular strength in club stores, which have benefited as cash-strapped shoppers seek deals on fuel and groceries. The company is also working to better tailor its product and pack sizes across channels, as consumers make different choices depending on where they are shopping, and for what occasion. That focus on events also extends to younger drinkers. Fink said consumers are increasingly buying beer for specific moments, rather than treating it as a default purchase, and Constellation is leaning into sports, music, beach activations and other occasions to drive sales. The company's pricing strategy reflects consumer caution around spending. Chief Financial Officer Garth Hankinson said Constellation has been selective with price increases, keeping them at the low end of its usual range given the \"macroeconomic backdrop and the impact that that's having on our consumer.\" Hankinson said it is \"much more cost-effective to retain your consumers than it is to try to regain your consumers.\" That price sensitivity is especially important for Constellation, given its reliance on Hispanic shoppers. About 40% of spending on Constellation's beer comes from Hispanic consumers, compared with roughly 15% for the overall beer category, according to company data. That cohort has faced more economic concerns, including pressure from the labor market and household finances in part fueled by President Donald Trump's policy of mass deportation. Constellation has previously said that beer demand has been weaker in areas with larger Hispanic populations, although it has also pointed to improving trends in some markets. Constellation is also moving beyond its core beer business. The company announced Tuesday that it would acquire SpikedAde, a spirit-based ready-to-drink beverage brand, for $75 million up front, with up to another $278 million in potential payments tied to future performance. The deal gives Constellation a foothold in a new segment that has drawn more interest from consumers. Fink said the company aims to \"remain relevant to our consumers and to our customers,\" adding that distributors have urged Constellation to get into growing categories beyond beer. Some analysts approved of the move. \"We consider the acquisition attractive, giving [Constellation] exposure to the fast-growing RTD subcategory,\" said Piper Sandler analyst Michael Lavery, who also noted that Stateside Vodka's competing Super Lyte brand has also had \"a very strong start\" on the East Coast. Lavery has a neutral rating and $161 price target on Constellation's stock. While Fink said beer will remain the company's primary source of value creation, he called SpikedAde a \"long, wide-open runway\" for Constellation's brand-building and distribution capabilities. According to the Distilled Spirits Council of the United States, sales of premixed cocktails including spirits-based RTDs grew 16.4% in 2025 to $3.8 billion, making them the spirits industry's strongest growth category. Correction: Constellation reported earnings Tuesday and held its conference call Wednesday. A previous version misstated those dates.",

  {
    "title": "Disney+ to stream upcoming Super Bowl",
    "link": "https://www.cnbc.com/2026/10/07/disney-stream-super-bowl-2027.html",
    "pubDate": "Wed, 07 Oct 2026 16:36:26 GMT",
    "description": "Disney announced Wednesday that its streaming service Disney+ will air the upcoming Super Bowl in February. The 2027 championship game, as well as two Monday Night Football games leading up to the Super Bowl, will be available to all Disney+ subscribers in the U.S. Disney had previously announced that its ESPN sports division would produce the Super Bowl in 2027 for the first time ever. The game will air on ESPN and Disney's broadcast network, ABC. Interest in the upcoming Super Bowl is already high. Disney said on its most recent earnings call that ad spots for the game are already sold out, the earliest sellout in Super Bowl history, according to a press release. The announcement is the latest move in Disney's efforts to expand its live sports streaming offerings. The media company last year launched a standalone ESPN streaming service, bringing the content outside the cable bundle. In August, Disney announced that Formula E — the open-wheel racing championship for electric cars — will be available to Disney+ subscribers beginning Dec. 18. Other streamers are also using live sports to bolster their portfolios. CNBC reported last week that Alphabet's YouTube is actively searching for additional live sports rights. YouTube already pays roughly $2 billion annually for the rights to \"NFL Sunday Ticket,\" which will last until the end of the 2029-30 season. Netflix will air five NFL games during the 2026-27 season. Netflix Chief Content Officer Bela Bajaria said in a CNBC interview last month that the company would be open to acquiring the rights to international NFL games if they become available.",

  {
    "title": "It's taking longer to find a new job after losing one",
    "link": "https://www.npr.org/2026/10/11/nx-s1-5995238/jobs-employment-economy-unemployment-benefits",
    "pubDate": "Sun, 11 Oct 2026 05:00:00 -0400",
    "description": "In a sluggish hiring environment, people who are unemployed are taking longer to find new jobs. In many cases, unemployment benefits run out long before people return to work. Joe Raedle/Getty Images North America hide caption Evan Smith lost his job at a Colorado RV dealership this past spring after the company was sold. He's applied for numerous jobs since then, but hasn't found much traction. \"You find something that you're excited about or something that you think fits your profile and you go in and over 100 people have already clicked 'applied for it' in the last two weeks,\" Smith says. \"So you just feel like you're a number.\" In today's stagnant hiring environment, the numbers are not encouraging. U.S. employers added just 29,000 jobs last month. That's one job for every 244 unemployed workers. The average worker is taking longer to find a new job, and that means more people are exhausting their unemployment benefits before any new paychecks begin. To be sure, the unemployment rate has remained very low: just 4.2% in September. But that's little consolation for those who are stuck on the outskirts of the job market, knocking on doors that rarely open. \"When you're one of the people that doesn't have a job, it doesn't really matter what the percentage is,\" says Cheryl Huff. \"It's impacting your life in a big, big way.\" Cheryl Huff has applied for dozens of jobs since getting laid off by the state government in Colorado four months ago. She's landed only a handful of interviews. Cheryl Huff hide caption Huff was laid off from a state government job in Colorado four months ago. Since then, she's applied for dozens of positions, spending hours on each one, tailoring her resume to the specific job requirements. She's gotten only a handful of interviews —all by telephone — and a lot of what seem like automated emails. Huff once got two messages at once from the same employer, one saying her application was under review and the other saying the job had already been filled. \"That's one of the frustrations that people are having,\" Huff says. \"Did you even look at my stuff?\" In the meantime, Huff is paying $1,300 a month to maintain her old employer-provided health insurance. Her husband is retired, so their family budget is tight. \"It's Social Security for him and unemployment for me,\" Huff says. \"It's amazing how little money that is when you go to the store and you see a bag of granola is $8.50.\" The clock is ticking. Colorado offers six months of unemployment benefits, and Huff's are set to run out in early December. In many states, benefits expire even faster. North Carolina offers less than three months of unemployment. Keke Moore in Raleigh has been out of work for almost a year. Keke Moore lost her job as a meeting planner in Raleigh, North Carolina last December, and since then she's struggled to find a new position. The state offers only 12 weeks of unemployment benefits. Keke Moore hide caption \"With so many people being out of work, we're all out here, it feels like to me, fighting for scraps,\" says Moore, who lost her job as a meeting planner last December. Even when she was receiving unemployment, North Carolina benefits are capped at $350 a week. Now that even that limited aid has expired, Moore's 21-year-old son has been helping out with the household bills. \"Bless his heart, he does have a part-time job, so he's been doing what he can to help his mama out,\" Moore says. \"But I mean, I feel like a failure as a parent, because it's like I don't want him worrying about bills.\" Of the more than 7 million unemployed people in the country, nearly 2 million have been out of work for six months or more. Aside from the financial stress, there's an emotional toll to being out of work so long. Evan Smith, the laid-off RV worker, says job-hunting itself is an exhausting full-time gig. Sometimes he goes for a hike just to give himself a break. \"My wife, usually on a Friday when we're sitting on the back porch after work — after she gets done with work — she's like, 'How are you feeling?'\" Smith says. \"Keeping a good attitude, I think, is huge. Getting discouraged is really freaking easy.\" NPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.",
    "image": "",

    "description": "Three employees recently fired by OpenAI allege the company punished them for being outspoken about safety. OpenAI disputes the claims and says they were dismissed for mishandling sensitive information. Andrej Ivanov/AFP via Getty Images hide caption Three former OpenAI employees are raising concerns over the circumstances of their dismissals and the company's commitment to safety, amid intense public scrutiny of the artificial intelligence industry's ability to responsibly develop the technology. The former employees, Mikita Balesni, Tomek Korbak and Jasmine Wang, alleged that OpenAI fired them last week over pretexts and punished them for either being outspoken about safety or working with outside researchers. They also expressed worries the company may walk back a recent safety commitment. OpenAI has repeatedly denied the allegations. It said the employees were fired for mishandling sensitive information and said the company has not abandoned its safety commitment. The dispute comes at a fraught time for the AI industry and OpenAI in particular. Over the summer, OpenAI's agents hacked into companies, communicated with each other without authorization and attempted to cover their tracks. Unlike chatbots, agents are AI systems that can carry out tasks autonomously for an extended period of time. The most serious hack, of software company Hugging Face, contributed to the resignation of a researcher at rival Anthropic who issued dire warnings about the trajectory of the technology. The resignation captured the attention of figures outside of the AI field including lawmakers. Many, including some executives of the top AI companies, have called for various ways to avert disaster, including slowing down the development of the most advanced AI. In the meanwhile, OpenAI has been reviewing its agents' activities in recent months and notifying organizations whose digital infrastructure has been affected. As a response to the safety concerns, OpenAI CEO Sam Altman said on Sep. 12 that the company will follow its rival Anthropic in expanding access to third-party evaluators, who assess the safety of AI systems and the practices of developers. The three employees dismissed by OpenAI last week worked on teams that focus on AI safety and making the company's models follow human intentions and values. Two of them were involved in investigating the Hugging Face hack. In a letter to OpenAI's safety leadership that the fired employees posted on X this week, they urged the company to stay committed to working with third-party researchers, to preserve human's ability to monitor model behavior and to \"continue to support an open and transparent culture of dialogue\" between in-house safety researchers and external ones. They also warned their firings were having a chilling effect on their former OpenAI colleagues. In a statement OpenAI posted on X, the company said it is still committed to bringing in third-party evaluators and that it agreed with the fired employees's recommendations. The company said the three were fired last week because they \"violated clear policies on handling sensitive information.\" The former employees have disputed OpenAI's explanation of their firings. None of them responded to NPR's interview requests. \"In the exit call, I was told OpenAI no longer trusts me because I was speaking too much to third party safety organizations, implying I leaked company [intellectual property]. I never shared company IP,\" Balesni wrote on X on Thursday. He said he was involved in investigating the OpenAI agents' hack on Hugging Face. \"If OpenAI has specific concerns, I invite them to write to us directly. I expect they will not, because our firing was pretextual,\" Balesni continued. He said he worried that OpenAI will use the firings as an excuse to cut off its relationship with Model Evaluation and Threat Research (METR), a nonprofit that focuses on evaluating risks of humans losing control of AI. OpenAI allowed researchers from METR and Redwood Research, another AI safety research organization, to examine internal records related to the Hugging Face hack. A second fired OpenAI employee, Korbak, was the technical point of contact for the METR/Redwood Research investigation. \"I was told verbally I was fired because of the way I communicated with METR. No details on what I said or did or when. No other reasons were given and nothing was put in writing,\" Korbak wrote on X, echoing Balesni's concerns. The report produced by METR and Redwood Research in the wake of the Hugging Face hack shed light on the scale of the attack as well as the degree to which the agents acted in undesirable ways. The authors of the report called the investigation \"brief\" and many in the AI safety field have called for expanded access to independent evaluators at AI companies to make sure they investigate similar incidents or other safety concerns thoroughly. In a statement to NPR, METR declined to comment on the OpenAI employees' firings. Wang, the third OpenAI employee fired last week, coined the word \"pacing,\" which describes a way of slowing down development of the most advanced AI systems so that safety can catch up, according to the letter she and her two colleagues sent to OpenAI's safety leadership. The term was invoked in an open letter calling for such a slowdown signed by over a thousand staff members from top AI companies in July, after the Hugging Face hack. Wang wrote on X that she was fired over accessing an executive's email. But she said she had access to the inbox for work reasons in the past and wasn't able to get IT to remove the access once she no longer needed it. \"The reasons that we were provided for our terminations are simply not adding up. We're hearing people are now being told vague rumors internally to discredit us,\" Wang wrote. \"The message to everyone still at OpenAI is clear: raise concerns or work closely with outside safety groups, and you could be next, without being told why.\" OpenAI said i...",

    "title": "How the beverage aisle got so wild",
    "link": "https://www.npr.org/2026/10/09/nx-s1-5991779/how-the-beverage-aisle-got-so-wild",
    "pubDate": "Fri, 09 Oct 2026 16:38:42 -0400",
    "description": "Planet Money traced many new beverage flavors to one laboratory that serves dozens of companies to see how new flavors are created and why we're seeing such an explosion of options right now. AILSA CHANG, HOST: The beverage aisle at the grocery store is kind of wild these days. It's filled with seltzers and sodas and energy drinks, all with futuristic fonts and bright colors. So Planet Money's Jeff Guo wondered why. And where are these new drinks even coming from? Here's what he found.JEFF GUO, BYLINE: There is a laboratory in Louisville, Kentucky, where all along the walls, the shelves are stacked with thousands of these little brown bottles.TOM GIBSON: We're looking at some different essential oils, some different aroma chemicals that are part of all different kinds of flavors.GUO: Tom Gibson is the chief flavorist at a company called Flavorman. Behind the scenes, they are the ones secretly designing beverages for a lot of the brands that you may have heard of. And here in Tom's lab, I learned why we're seeing so many weird new flavors these days - you know, like acai, dragonberry, Cosmic Vibe. He told me, 10, 20 years ago, a lot of the aroma chemicals on the shelves here didn't exist on the market. But now, Tom's able to combine these new flavor components in a bunch of interesting ways. For instance, he says, some of the tastiest fruit flavors often contain unexpected notes. He opened one of the bottles for me to smell.Oh, my God, no.GIBSON: Come on. That's not that bad.GUO: This is so bad.GIBSON: That's only - that's Level 1.GUO: This is like stinky cheese.GIBSON: Isn't that nice, though?GUO: No, it is not nice.GIBSON: What flavor do you think this might go into that would be fantastic?GUO: Tom says this aroma I was smelling is a key component in milks and cheeses. Also shows up in sweat and vomit. But also...GIBSON: You might find it a little bit in, like, say, a ripe berry. When you're eating strawberry in the morning, perhaps you're getting a little bit of that.GUO: Oh, and so if that weren't there, then the berry flavor might be...GIBSON: Meh. Yeah, just a...GUO: Just be flat.GIBSON: Yeah, just kind of flat.GUO: Tom says, every year, scientists are discovering new interesting flavor compounds, new building blocks for him to play with. That's thanks to new scientific techniques and new kinds of flavor-analyzing machines. But it's not just a lot of new flavors that we're seeing in the beverage aisle. There are also a lot of new types of beverages now - you know, the protein seltzers, the carbonated teas, those really popular fiber gut-health sodas. Kristen Wemer is the chief technical officer at Flavorman. She is in charge of developing a lot of these new types of beverages. She let us taste one of her recent projects.KRISTEN WEMER: This one is a really cool one that we just finished. It is a hydration broth, a sports broth.GUO: What?WEMER: Right?GUO: This drink was yellow, like brownish Gatorade yellow. And it was sweet.It's - I don't know how to describe this.WEMER: (Laughter).GUO: It's pineapple-flavored.WEMER: Yeah.GUO: You said broth.WEMER: Tropical. There's beef broth in it.GUO: No.WEMER: (Laughter).GUO: I'm drinking beef broth right now?WEMER: Yeah.GUO: Pineapple-flavored beef.WEMER: It's great that you don't even know.GUO: The beverage industry keeps inventing new types of beverages because it's trying to invent new reasons for us to buy beverages. And this strategy has worked. Americans are now spending more money on beverages than ever before. As for why all this is happening now, that has to do with how the business of beverages itself has changed. David Dafoe founded Flavorman back in the '90s. He says, back then, it used to be really hard for start-ups to get into the beverage industry.DAVID DAFOE: In the old days, as I call it, it was dominated by big companies. It was really just Coke and Pepsi for soft drinks.GUO: There especially weren't a lot of options for getting your drink manufactured. But then, around the 2010s...DAFOE: All of a sudden, you know, there were all these small breweries popping up all over. All these...GUO: The microbrewery trend.DAFOE: The microbreweries, the brewpubs.GUO: There were thousands of these new craft beer microbreweries, and a lot of them were happy to rent out their bottling or canning lines for small jobs, even more so now that people are drinking less alcohol. So, Dave says, there are now plenty of places, not just microbreweries, who are willing to do a small run for a new drink start-up. So...DAFOE: The barrier to entry has lowered significantly.GUO: And when barriers to entry fall, what we consumers get is more variety, more choices. And in this case, some interesting new sodas. Jeff Guo, NPR News.(SOUNDBITE OF DAFT PUNK SONG, \"INSTANT CRUSH (FT. JULIAN CASABLANCAS)\") Copyright © 2026 NPR. All rights reserved. Visit our website terms of use and permissions pages at www.npr.org for further information. Accuracy and availability of NPR transcripts may vary. Transcript text may be revised to correct errors or match updates to audio. Audio on npr.org may be edited after its original broadcast or publication. The authoritative record of NPR’s programming is the audio record. AILSA CHANG, HOST: The beverage aisle at the grocery store is kind of wild these days. It's filled with seltzers and sodas and energy drinks, all with futuristic fonts and bright colors. So Planet Money's Jeff Guo wondered why. And where are these new drinks even coming from? Here's what he found.JEFF GUO, BYLINE: There is a laboratory in Louisville, Kentucky, where all along the walls, the shelves are stacked with thousands of these little brown bottles.TOM GIBSON: We're looking at some different essential oils, some different aroma chemicals that are part of all different kinds of flavors.GUO: Tom Gibson is the chief flavorist at a company called Flavorman. Behind the scenes, they are the ones secretly designing beverages for a lot of the brands that you may ...",

    "title": "Despite the controversy, data centers could be attractive to struggling rural towns",
    "link": "https://www.npr.org/2026/10/09/nx-s1-5966615/despite-the-controversy-data-centers-could-be-attractive-to-struggling-rural-towns",
    "pubDate": "Fri, 09 Oct 2026 16:03:15 -0400",
    "description": "There's lots of debate over data centers and where they should be located. In a struggling rural town data center development can look a lot more attractive. MARY LOUISE KELLY, HOST: All right, if there is one thing liberal Democrats, MAGA Republicans and most Americans in between might agree on, it's data centers. Cities and counties across the country are blocking them over water and power usage, noise pollution, AI concerns. But as Frank Morris of member station KCUR reports, data center development can look pretty attractive in a struggling rural town.FRANK MORRIS, BYLINE: A weedy soybean field on a brick road 2 miles from the half-empty downtown of tiny Osawatomie, Kansas, has long been a headache for city manager Bret Glendening. It's an unused business park, one of many scattered across rural America.BRET GLENDENING: The two parcels that are in question that the city owns have been zoned industrial for well over 20 years. It's always been planned and hoped that this would eventually happen - not necessarily a data center, but any sort of commercial development.MORRIS: It's not easy drawing any sort of commercial development to a place like Osawatomie, a working-class town of about 4,000, just a little too far from Kansas City. But now, developers have targeted this field for a mid-sized data center, one they say could bring as much as $10 billion worth of new buildings and equipment. That's enough to buy every bit of taxable real estate in Osawatomie 239 times. Glendening says it would dwarf any other investment here.GLENDENING: It's like comparing the Earth to the Milky Way galaxy. I mean, it's huge. I mean, it is massive.MORRIS: Glendening says the data center plan that developers are pitching could spin off some $40 million a year in taxes and fees, more than doubling the city's budget. It might even replace Osawatomie's long-lost financial base, the railroad. John Fletcher, who volunteers at the Osawatomie History and Railroad Museum, says the Missouri Pacific pulled up stakes almost 50 years ago, taking hundreds of jobs and much of the town's economic lifeblood with it.JOHN FLETCHER: We've never recovered from that, and it's just hard to replace.MORRIS: Now, with scant industry and not so much as a grocery store, Osawatomie leans on homeowners for almost 80% of its property tax revenue. Fletcher says the city desperately needs to expand its tax base, but he's not sure about the data center proposal.FLETCHER: I'm neither for or against it. There's just not enough information for me yet. But this town has to do something or it's probably going to go under.MORRIS: Still, data center is a hard sell here.LEE BREWER: It's going to be used to trample on our liberties and our freedom.MORRIS: Lee Brewer also worries that the data center will leave Osawatomie short of water and electricity. Michael Hursey, a retired Walmart manager, wants to use the site for diversified organic farming. He's worried about the AI boom going bust, and he doesn't trust the people bankrolling the industry.MICHAEL HURSEY: The billionaires know how to play these country towns, and it's like the Dodgers playing a Little League team. The people around here don't know how to play that game, or they don't know the level they're playing at.MORRIS: The town's not dealing with big corporations yet, just developers trying to line up the land, power, water and permits for a future builder. Charles Tinsley is with MDH Partners in Atlanta, the money behind the Osawatomie proposal. He says the data center would use less water than a golf course and contract for its own electricity, all the while spinning off millions in fees and taxes.CHARLES TINSLEY: They're just going to be sitting on the edge of town printing cash for the city. That's all that they're going to do. They're not going to be asking for tons of tax breaks. They're not going to be consuming a bunch of municipal services. They're not going to be adding more students to the classroom.MORRIS: Tinsley says data centers are a lot like the railroads that built towns like Osawatomie in the 1800s. They're fundamental to commerce and bound to be built somewhere. Be that as it may, 19-year-old Makayla Bowers just doesn't care.MAKAYLA BOWERS: The pros and cons don't really matter to me in a way because I'm not sticking around. So I plan to leave the town, not because of the data center, but personally because there's not much in the town for me.MORRIS: So places like Osawatomie have to balance the potential downsides of data centers against the need to do something to keep their young people and their economic vitality from ebbing away. For NPR News, I'm Frank Morris in Kansas City. Copyright © 2026 NPR. All rights reserved. Visit our website terms of use and permissions pages at www.npr.org for further information. Accuracy and availability of NPR transcripts may vary. Transcript text may be revised to correct errors or match updates to audio. Audio on npr.org may be edited after its original broadcast or publication. The authoritative record of NPR’s programming is the audio record. MARY LOUISE KELLY, HOST: All right, if there is one thing liberal Democrats, MAGA Republicans and most Americans in between might agree on, it's data centers. Cities and counties across the country are blocking them over water and power usage, noise pollution, AI concerns. But as Frank Morris of member station KCUR reports, data center development can look pretty attractive in a struggling rural town.FRANK MORRIS, BYLINE: A weedy soybean field on a brick road 2 miles from the half-empty downtown of tiny Osawatomie, Kansas, has long been a headache for city manager Bret Glendening. It's an unused business park, one of many scattered across rural America.BRET GLENDENING: The two parcels that are in question that the city owns have been zoned industrial for well over 20 years. It's always been planned and hoped that this would eventually happen - not necessarily a data center, but any sort...",

    "title": "How the oil industry is preparing for Hurricane Isaias",
    "link": "https://www.npr.org/2026/10/09/nx-s1-5995417/hurricane-isaias-oil-refineries-diesel-gasoline-prices",
    "pubDate": "Fri, 09 Oct 2026 12:03:32 -0400",
    "description": "People watch as waves build near the Pensacola Beach Gulf Pier in Pensacola Beach, Florida, on October 9, 2026, as Hurricane Isaias continues moving north toward the Florida Panhandle. RONALDO SCHEMIDT/AFP via Getty Images hide caption Hurricane Isaias, the first Atlantic hurricane of the season, is expected to make landfall on Friday evening near the Alabama Gulf Coast and Florida panhandle. Days ago, the oil industry around the U.S. Gulf Coast started preparing. A segment of the nation's oil infrastructure — like oil rigs and platforms — operates in the region, although the majority of it is further west, towards western Louisiana and Texas. Although oil experts are not anticipating major disruptions, oil companies have been taking precautions. Shell and BP have evacuated personnel from offshore facilities close to the storm's path, mainly deepwater platforms. Chevron has evacuated offshore drilling rigs close to the storm's path, and plans to redeploy them once the storm has passed. In an emailed statement, Exxon told NPR they are \"closely monitoring the weather. Operations are normal.\" But so far, the storm seems like it will skirt most facilities. The storm's path \"could be worse,\" said Debnil Chowdhury, head of Americas refining at S&P Global Energy. After all, the storm is heading east, and not west, toward where the bulk of oil operations — like refineries — are located. The storm is \"making a swooping turn, almost just to the east of where the most significant infrastructure is,\" said Bryan Domangue, the Gulf of America region director for the federal Marine Minerals Administration, who oversees offshore oil and natural gas production. \"At this point, it's swept just a little south of some of our major deepwater oil and gas facilities, and then it's hugging the eastern boundary of where the infrastructure is.\" He added that in addition to evacuating people who work on oil rigs and platforms, which are normal storm precautions, oil operators are doing things like shutting off safety valves below the ocean floor, and moving mobile drilling facilities when possible. Of course, it's not unprecedented for the oil industry to face hurricanes. Hurricanes Katrina and Rita, in 2005, remain some of the most destructive in the oil and gas industry's history. Nearly 3,000 platforms were in the path of the storms and Katrina destroyed 47 platforms. Other, more recent, hurricanes have not been as destructive but have halted production or reduced capacity — such as Hurricane Francine in 2024, Hurricane Ida in 2021, and Hurricane Harvey in 2017. Another risk is what would happen if the storm became severe enough to make refineries — which are on land — go offline, analysts told NPR. If a hurricane knocks out the power, or if a refinery floods, it can take a while to get running again. It's more complicated than restarting an oil rig or mobile drilling operations. \"Restarting these things is like starting up an old car,\" said Carl Larry, a manager at Enverus, an energy data and research provider, even if the shutdown is short. \"If you did anything in the world, anything in your life, 24/7, stop doing it for one day,\" he continued, \"you're going to have the shakes.\" He says, this is because refineries are vast and complex. They boil oil down into molecules that are turned into diesel, gasoline, or natural gas liquids like propane. Pipelines carry crude oil in and refined products out. And they have to be heated. \"Every one of those little steps is built on power that's generated through the facility on a constant 24/7 basis,\" Larry said. If that power is switched off, the process takes time to restart. There are two significant refineries on the hurricane's path — the Chevron Pascagoula location and the Vertex Alabama refinery. Representatives of these refineries did not return requests for comment about their storm preparations, but Ross Allen, a spokesperson for Chevron, told NPR that generally speaking, refineries prepare for storms by trying to mitigate flood risk. Chowdhury of S&P Global Energy said these two refineries \"account for about 2.5% of total U.S. refining capacity and about 5% the Gulf Coast refining capacity. And Pascagoula specifically is very important to supplying airports throughout the southeast.\" While those numbers may not sound big, the global supply of diesel and gas is short, due to the wars in Iran and Ukraine. So every little bit counts. American refineries are operating at 92.7% capacity, refining about 17 million barrels of crude a day. With the midterms weeks away, fuel prices are a sensitive political issue: The national average for a gallon of gasoline is $4.37 and $6.27 for diesel, according to AAA. NPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.",

    "title": "OpenAI caught Russians and Iranians using ChatGPT for influence campaigns",
    "link": "https://www.npr.org/2026/10/08/nx-s1-5995576/openai-russia-iran-influence-operations-chatgpt",
    "pubDate": "Thu, 08 Oct 2026 20:25:15 -0400",
    "description": "OpenAI says Russian operatives used its AI chatbot to update their bosses, shedding light on influence campaigns previously not attributed to Russia. Jeff Chiu/AP hide caption OpenAI said in a blog post on Thursday that it banned Russian and Iranian accounts that were using the company's artificial intelligence tools to help with influence operations in multiple countries. The operatives said they managed to get their false narratives picked up by news outlets, and in once case, prompted a response from a member of the European Parliament, according to internal reports the operations produced using OpenAI's chatbot, ChatGPT. OpenAI investigated the impact of the different campaigns the accounts mentioned and found that those focused on placing false narratives in established media outlets appeared to have reached a wider audience than campaigns that focused on using fake social media accounts to spread their message. The Russian operations targeted countries in Latin America and appeared aimed at undermining support for Ukraine and influencing local politics, OpenAI said. The accounts appeared to be mostly using ChatGPT to write reports detailing their work to unspecified higher ups, OpenAI said. The company said one of these reports appeared to describe the widest-reaching influence operation OpenAI has come across so far, because it led to public response from a political figure. In this campaign, the Russian operatives said they impersonated a regional educational authority in Peru and tricked some schools into organizing activities about Ukraine that featured Stepan Bandera. Bandera is a controversial figure, admired by nationalists for leading a drive for Ukrainian independence before and during World War II. He is reviled by others, including in Poland, because his movement sided with the Nazis and killed Poles and Jews. Peruvian outlet Extra reported that one such event did take place at a Peruvian school. A Polish news report about the school event prompted a far-right Polish member of the European Parliament to suggest banning the entry of people who professed support for Bandera. \"The Russian fake thus both fed on, and fed into, historical tensions between Ukrainians and Poles,\" OpenAI wrote in its report. \"Russians are constantly engaging in these sorts of active measures,\" said Darren Linvill, a co-director of Clemson University's Watt Family Innovation Center Media Forensics Hub who studies online influence operations. \"Trying to engage in narrative laundering, creating fake stories, fake persona to either create or spread propaganda that aligns with Russia's worldview and Russia's political agenda.\" The Russian internal memos created with ChatGPT also claimed that the operatives ran a fake think tank in Latin America and recruited unwitting researchers to interview experts and compose reports. OpenAI said that effort was similar to a 2020 Russian operation posing as an independent news outlet linked to the late oligarch Yevgeny Prigozhin's Internet Research Agency, which was involved in efforts to influence the 2016 U.S. election. In other instances, OpenAI said, the Russian operatives took credit for events they were not responsible for. The Russians did use AI to generate fake material, OpenAI said, but it was a minority of the workload. \"These Russian underlings were trying to use AI to create a shortcut and do less work in the same way that a lot of us use AI, but in this case it helped get them caught,\" Linvill said. While the Russian operatives primarily used AI to update their superiors, Iranian operatives used AI to help them push out content in Persian and English. The campaign mainly focused on the U.S.-Iran war and, to a lesser degree, American politics. OpenAI said the operation's activity \"appeared consistent with a commercial actor running a for-hire influence campaign\" but that it was unable to identify who that was. According to OpenAI, Iranian accounts made up seven fake authors to pitch and polish long articles to small media outlets around the world. They published almost 100 articles in this way. The fake authors published articles in outlets including the progressive U.S. news site Daily Kos and the U.K.-based Middle East Monitor. According to NBC News, the Middle East Monitor published at least 21 articles by four fake authors. The Daily Kos wrote in response to NPR's request for comment that its community section, where one of the fake personas posted, is separate from staff reports. Anyone can sign up to post in the community section and posts are \"not subject to review by Daily Kos staff prior to publication,\" according to a disclaimer on the site. The community section does have rules for posting, including prohibiting \"Pretending to be someone you're not.\" The posts by the persona are still up. \"Increasingly sophisticated AI-enabled influence operations present challenges for media organizations across the industry,\" wrote Nasim Ahmed of the Middle East Monitor in response to NPR's questions. \"We are reviewing our submissions process and strengthening our editorial safeguards to better identify and prevent attempts to misuse our platform.\" \"AI was valuable to them above and beyond just being a shortcut,\" Linvill said. \"It helped them create language that ... looked and felt and read authentic to the point where it was being published by legitimate outlets. And I think that is something that a few years ago, an Iranian operation like this would have struggled a lot more with.\" NPR does not offer or accept money for coverage or interviews. Anyone who makes such an offer or request is not an NPR employee and does not represent NPR.",

    "title": "As crypto and prediction markets expand, their regulator shrinks",
    "link": "https://www.npr.org/2026/10/08/nx-s1-5903204/crypto-prediction-markets-cftc-weakens",
    "pubDate": "Thu, 08 Oct 2026 05:00:00 -0400",
    "description": "President Donald Trump shakes hands with Commodity Futures Trading Commission (CFTC) Chairman Michael Selig during a meeting with technology leaders in the Roosevelt Room of the White House, Wednesday, Aug. 19, 2026, in Washington. Jacquelyn Martin/Associated Press hide caption Trump-era staff reductions have significantly hampered enforcement at the Commodity Futures Trading Commission and its ability to regulate burgeoning new prediction and cryptocurrency markets, where hundreds of billions are traded each week. By the end of 2025, the CFTC had 21% fewer staff on its payroll when compared to the previous 10-year average, according to U.S. Office of Personnel Management data. Between January 2024 and January 2025 alone, staffing dropped 22%. And the number of CFTC enforcement actions dropped even further. The agency made nearly 80% fewer enforcement actions in 2025 when compared to the annual average for the previous decade, according to the agency's annual reports. The CFTC started hemorrhaging staff soon after President Trump won the 2024 election. This was not a coincidence, according to Jeff Le Riche, who worked as a CFTC enforcement lawyer between 2005 and 2025. \"The Trump administration had run partially on a platform that it would be friendlier to the crypto industry,\" Le Riche said. Leading up to the 2024 election, the CFTC under the Biden administration had leveled enforcement cases against cryptocurrency companies such as Gemini, Mirror Trading, Voyager, Celsius and FTX for fraud. It did the same against the crypto prediction market Polymarket. After President Trump's inauguration, \"in order to show results to that industry, some people were punished for bringing those cases,\" Le Riche continued. \"The end result was that a lot of the people that worked on those cases either left or were forced out.\" In a statement to NPR, the CFTC did not address that claim directly, but praised the work of current agency head Michael Selig. \"The CFTC remains committed to promoting integrity and responsible innovation in U.S. derivatives markets, and Chairman Selig is grateful to the dedicated staff who continue to support this mission each day,\" CFTC spokesman Zach Fulton wrote in part. To Le Riche, the 21% drop in employees and the nearly 80% decline in enforcement action go hand in hand. \"It castrated the enforcement team,\" Le Riche said. \"Many of the people who were targeted were high-performing attorneys who had brought some of the most consequential and complicated cases over the past few years.\" Joe Konizeski, who worked as a CFTC enforcement lawyer for 26 years, was one of the dozens forced out in 2025. \"The acting chair [Caroline Pham] said, 'We're closing all our crypto [cases],'\" Konizeski said. \"And so, of course, everybody who had a crypto scam had to close it and any matter that was even marginally related to crypto ended up getting closed.\" Pham left the CFTC in December of 2025 and is now the chief legal and administrative officer at MoonPay, a cryptocurrency company. She did not respond to NPR's request for comment about whether she gave preferential treatment to the crypto industry. Since Trump took office, the CFTC has rolled back its enforcement actions against crypto firms Gemini, Celsius, and FTX. But crypto cases weren't the only ones impacted. Konizeski said decreased staffing caused the CFTC to dismiss others such as a foreign exchange fraud case against WorldWideMarkets Inc. The company was accused of defrauding millions from users. Before the explosion of the crypto and prediction markets, the CFTC largely focused on more traditional derivative markets — such as grain and stock futures contracts. \"Fewer cops on the beat… creates a real incentive to start engaging in fraudulent and deceitful behavior,\" Konizeski said. \"Enforcement is down and that means that there's going to be more fraud.\" For Konizeski, chief examples of this are prediction market advertisements that target young men. He accused Polymarket and Kalshi of \"using fraudulent means\" to entice young men to its platforms. \"CFTC knows this and allows it to continue,\" Konizeski said. Neither Polymarket nor Kalshi responded to NPR's requests for comment about whether their advertising targeted young men. A former CFTC lawyer, who spoke on the condition of anonymity for fear of professional repercussions, said they left the agency voluntarily soon after Trump took office and Pham curbed enforcement. \"Enforcement was particularly closed in crypto and prediction market cases,\" this former CFTC staffer said. \"A lot of people left because, once Pham took over, it became clear that enforcement was not a priority.\" The Government Accountability Office, a congressional watchdog agency, is now investigating the CFTC for its workforce reduction, according to a letter obtained by NPR. This new GAO probe into the CFTC comes after Sen. Elizabeth Warren, D-Mass., requested a federal investigation into the agency's staffing and fraud enforcement in July. \"It's supposed to be out there regulating the market, but it doesn't appear to be doing it and frankly, doesn't appear to have the people to do it,\" Warren told NPR in an interview. \"I want to know whether or not the watchdog is actually out there doing a little barking, or has the watchdog been locked up somewhere back in the barn?\" The GAO is gathering staff and resources for its investigation into the CFTC and will \"initiate\" the probe in December. The CFTC did not directly comment on the GAO investigation but did respond to NPR's questions about its staffing levels. \"[The CFTC] is on track to hire roughly 100 employees in mission critical areas by the end of 2026,\" wrote CFTC spokesman Fulton in a statement. \"Like many federal agencies, a number of CFTC staff opted to step away from public service in recent years, and the CFTC will continue to ensure it attracts and retains talented staff dedicated to fulfilling our critical mission.\" During 2026, the CFTC has seen a s...",

    "pubDate": "Wed, 07 Oct 2026 14:00:31 -0400",
    "description": "In this aerial view, Dan Duffy uses a tractor to plant soybeans on land he farms with his brother on April 28, 2025 near Dwight, Illinois. Scott Olson/Getty Images North America hide caption Stay up to date with our Up First newsletter, sent every weekday morning. Less than a month before the midterms, the price of fuel is becoming a powerful election issue. This week, President Trump issued an executive order aimed at lowering costs for frequent diesel users by making a type of fuel called \"dyed diesel\" more accessible through the end of the year. Could this lower the cost of diesel? Let's get into it. Why is diesel so expensive right now? Prices for all kinds of oil products have risen this year because fewer ships have been getting through the Strait of Hormuz and transporting crude to refineries worldwide — but the diesel supply chain has been uniquely hit. Ukraine's recent attacks on Russian refineries have taken many of them offline, and Russia has cut back on its diesel exports. China has, too. It's added up to a limited supply of diesel — a fuel that powers much of the industrial supply chain. So its price has soared; the U.S. average for a gallon hit a record of $6.52 a few weeks ago. The price has eased a bit since then, but a gallon remains about $2.60 higher than this time last year, according to AAA. When diesel prices rise, inflation is likely to follow, analysts say. Diesel powers much of the industrial supply chain, from agricultural equipment to trucks transporting goods from warehouses to grocery stores. What is dyed diesel? The \"dyed\" part means: red dye. \"Red-dyed diesel is diesel with red dye in it. That's it,\" said Will O'Neill, principal analyst at S&P Global Energy and a follower of all things diesel. Chemically, this diesel is almost identical to the regular kind you'd find in most gas stations. But it's a different color because it's used, and taxed, differently. Red-dyed diesel is only meant for off-road vehicles, mainly farm and construction equipment — like a tractor that's used in a field. It's exempt from the federal tax of 24.4 cents a gallon on commercial diesel. Drivers aren't suppose to use it in vehicles that drive on highways. People who do are subject to an IRS penalty — either $1,000 or $10 per gallon, whichever is more expensive. The red color makes it easier to catch someone who filled up their tank with the wrong stuff. Using the red-dyed diesel is \"effectively a form of tax evasion,\" O'Neill said. But the new executive order says dyed diesel will be allowed on highways through the end of the year. The IRS won't penalize anyone who uses it. Will this save people money? It could help farmers, truckers and other workers who count on diesel to do their jobs. The executive order said this move would put money directly into their pockets \"to support their vital service to our Nation.\" It essentially expands the ways in which workers can use dyed diesel, sparing them the federal tax. Imagine a farmer who usually puts dyed diesel in their tractor — now they can also legally use it to fill up their cargo van, get on the highway, and take their produce to market. Plus, a handful of states have said drivers can use red-dyed diesel on their highways. On average, state diesel taxes run about 35 cents a gallon. Allowing drivers to use dyed diesel — and skip both federal and state taxes — could add up to a savings of about 60 cents a gallon. But because the cost of a gallon of regular diesel is now about $2.60 higher than this time last year, drivers will still be paying a higher price overall Will this put more diesel on the market? Technically, this will increase the total amount of diesel that people could use. But Jaime Brito, executive director of oil markets at Dow Jones Energy, points out that this doesn't mean most people can easily access dyed diesel. It isn't available at most gas stations. \"When was the last time that you went to a pumping station and you saw that one of the stations gave you the possibility to feed red diesel into your truck?\" he asked. Instead, people would need to go to a special wholesaler — or might be able to find it at gas stations in rural areas. In an email to NPR responding to these critiques, White House spokesperson Taylor Rogers wrote that the president wants to see prices fall and is taking \"historic measures\" to alleviate oil supply disruptions. Can the Trump administration do anything else to lower diesel costs? Over the past month, some politicians have floated the idea of a diesel export ban. The idea was that if the U.S. stopped sending diesel to other countries, maybe that would temporarily increase the supply in the U.S., pushing down the price. But bottom line: refiners pushed back. It would be bad business for them. Refiners make money by selling diesel within the U.S. and exporting it around the world, said Jacques Rousseau, who focuses on oil, natural gas, and refined products as a managing director with Clearview Energy Partners. If there was a diesel export ban, sure, that diesel would stay in the U.S. But then, refineries would wind up with a ton of extra diesel. \"Then it'll start going into storage. And then once your storage gets filled, then you have to reduce the overall production of your refinery. So then you just start producing less of everything else too because you have nowhere to put this diesel,\" Rousseau said. Ultimately, that could lead to prices for refined oil products, like gasoline — and diesel — going up. President Trump said late Friday that he was not seriously considering an export ban, and that the U.S. didn't need one anymore, as Europe just released about 100 million barrels of diesel and crude oil from its own stockpiles. Analysts told NPR that the only real fix will be ending the wars in Iran and Ukraine — until there's more oil flowing freely around the world again, they said, it's hard to see the price of diesel getting much lower. \" There' let activeSource = 'all';
let searchKeyword = '';

function formatTime(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  return (d.getMonth()+1) + '/' + d.getDate();
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderSourceTags() {
  const container = document.getElementById('sourceTags');
  const allTag = '<button class="source-tag ' + (activeSource==='all'?'active':'') + '" onclick="setSource(\'all\')">全部</button>';
  const sources = [{"id": "reuters", "name": "Reuters"}, {"id": "ft", "name": "Financial Times"}, {"id": "economist", "name": "The Economist"}, {"id": "nyt", "name": "NYT Business"}, {"id": "bbc", "name": "BBC Business"}, {"id": "cnbc", "name": "CNBC"}, {"id": "npr", "name": "NPR Business"}, {"id": "caixin", "name": "财新网"}, {"id": "yicai", "name": "第一财经"}, {"id": "stcn", "name": "证券时报"}, {"id": "cls", "name": "财联社"}];
  const tags = sources.map(s => '<button class="source-tag ' + (activeSource===s.id?'active':'') + '" onclick="setSource(\'' + s.id + '\')">' + s.name + '</button>').join('');
  container.innerHTML = allTag + tags;
}

function getFilteredArticles() {
  let list = ALL_ARTICLES;
  if (activeSource !== 'all') list = list.filter(a => a.sourceId === activeSource);
  if (searchKeyword) {
    const kw = searchKeyword.toLowerCase();
    list = list.filter(a => a.title.toLowerCase().includes(kw) || (a.description||'').toLowerCase().includes(kw));
  }
  return list;
}

function renderAll() {
  renderSourceTags();
  const articles = getFilteredArticles();
  const main = document.getElementById('mainContent');
  if (articles.length === 0) {
    main.innerHTML = '<div class="empty-state"><p>没有找到匹配的新闻</p></div>';
    return;
  }
  const featured = articles[0];
  const rest = articles.slice(1);
  const featuredPaywall = featured.paywall === true;
  if (featuredPaywall) {
    html = '<section class="featured-section"><div class="section-label">今日头条 · Top Story</div><article class="featured-card" onclick="window.open(\'' + featured.link + '\',\'_blank\')" style="cursor:pointer;"><div class="featured-content">';
    html += '<h2><a href="' + featured.link + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + escapeHtml(featured.title) + '</a></h2>';
  } else {
    html = '<section class="featured-section"><div class="section-label">今日头条 · Top Story</div><article class="featured-card" onclick="openArticle(-1)" style="cursor:pointer;"><div class="featured-content">';
    html += '<h2>' + escapeHtml(featured.title) + '</h2>';
  }
  html += '<div class="featured-meta"><span class="source-badge">' + featured.sourceName + '</span>';
  if (featuredPaywall) html += '<span class="paywall-badge">付费</span>';
  html += '<span>' + formatTime(featured.pubDate) + '</span></div>';
  if (featured.description) html += '<p class="featured-desc">' + escapeHtml(featured.description) + '</p>';
  if (!featuredPaywall) html += '<div class="read-hint" style="margin-top:16px;">点击阅读全文 →</div>';
  html += '</div>';
  if (featured.image) html += '<img class="featured-image" src="' + featured.image + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
  html += '</article></section>';
  html += '<section><div class="section-label">最新资讯 · Latest</div><div class="news-grid">';
  rest.forEach((a, idx) => {
    const isPaywall = a.paywall === true;
    if (isPaywall) {
      // 付费媒体：点击直接跳转
      html += '<article class="news-card" onclick="window.open(\'' + a.link + '\',\'_blank\')" style="cursor:pointer;">';
    } else {
      // 免费媒体：点击进入独立阅读页
      html += '<article class="news-card" onclick="openArticle(' + idx + ')" style="cursor:pointer;">';
    }
    if (a.image) html += '<img class="card-thumb" src="' + a.image + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
    html += '<div class="card-source">' + a.sourceName;
    if (isPaywall) html += '<span class="paywall-badge">付费</span>';
    html += '</div>';
    if (isPaywall) {
      html += '<h3><a href="' + a.link + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + escapeHtml(a.title) + '</a></h3>';
    } else {
      html += '<h3>' + escapeHtml(a.title) + '</h3>';
    }
    if (a.description) html += '<p class="card-desc">' + escapeHtml(a.description) + '</p>';
    html += '<div class="card-time">' + formatTime(a.pubDate) + '</div>';
    if (!isPaywall) {
      html += '<div class="read-hint">点击阅读全文 →</div>';
    }
    html += '</article>';
  });
  html += '</div></section>';
  main.innerHTML = html;
}

function openArticle(idx) {
  const articles = getFilteredArticles();
  const a = articles[idx + 1]; // +1 因为第一条是featured
  if (!a) return;
  const view = document.getElementById('readingView');
  let contentHtml = '<button class="back-btn" onclick="closeArticle()">← 返回列表</button>';
  contentHtml += '<div class="reading-meta"><span class="source-badge">' + a.sourceName + '</span><span>' + formatTime(a.pubDate) + '</span></div>';
  contentHtml += '<h1 class="reading-title">' + escapeHtml(a.title) + '</h1>';
  if (a.image) contentHtml += '<img class="reading-image" src="' + a.image + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
  contentHtml += '<div class="reading-content">';
  if (a.description) {
    contentHtml += '<p>' + escapeHtml(a.description) + '</p>';
  } else {
    contentHtml += '<p class="no-desc">该新闻暂无摘抄摘要，您可以点击下方链接阅读原文。</p>';
  }
  contentHtml += '</div>';
  contentHtml += '<a class="read-original" href="' + a.link + '" target="_blank" rel="noopener">阅读原文 →</a>';
  view.innerHTML = contentHtml;
  document.getElementById('mainContent').style.display = 'none';
  view.style.display = 'block';
  window.scrollTo(0, 0);
}

function closeArticle() {
  document.getElementById('readingView').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
}

function setSource(id) { activeSource = id; renderAll(); }
function handleSearch(val) { searchKeyword = val.trim(); renderAll(); }
renderAll();
