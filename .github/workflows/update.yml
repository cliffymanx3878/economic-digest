name: 每日更新经济日报

on:
  schedule:
    # 北京时间每天 07:15 (UTC 23:15 前一天)
    - cron: '15 23 * * *'
  # 支持手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: 抓取新闻并生成 HTML
        run: python scripts/fetch_news.py

      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html articles/
          git diff --staged --quiet || git commit -m "每日新闻更新 $(date +'%Y-%m-%d')"
          git push
